a tarde perfecta,\nme gustar\u00eda saber qu\u00e9 har\u00edas con ella. Me interesa hasta c\u00f3mo imaginas."],["Poemita","Cuando estoy por escribirte,\nmis dedos a veces sonr\u00eden primero y mandan un coraz\u00f3n."],["Poemita","D\u00e9jame caminar contigo\nhasta que encontremos algo que nos d\u00e9 ganas de detenernos."],["Poemita","Un futuro contigo empieza tambi\u00e9n\nen c\u00f3mo te trato este martes cualquiera."],["Poemita","Te mereces un amor que ponga atenci\u00f3n.\nHoy quiero aprender una cosita m\u00e1s que te haga sentir querida."],["Poemita","Podr\u00edamos quedarnos mirando llover\ny llamar a eso una cita completa."],["Poemita","Tu risa me convence de algo bien sencillo:\nhay segundos que ya valen por todo el d\u00eda."],["Poemita","No siempre me alcanza la imaginaci\u00f3n para el futuro.\nPero al pensar en qui\u00e9n quiero cerca, te veo clarito."],["Poemita","A veces yo tambi\u00e9n necesito un respiro.\nPensar que m\u00e1s tarde puedo hablar contigo ya me afloja un poco."],["Poemita","Si el cari\u00f1o se viera por fuera,\nseguro mis orejas me delatar\u00edan cada vez que llegas."],["Poemita","Qu\u00e9 lindo ser\u00eda prepararte algo rico\ny verte probar el primer bocado antes de preguntarte c\u00f3mo qued\u00f3."],["Poemita","Antes de seguir con tu d\u00eda,\nqu\u00e9date un segundo conmigo en esta l\u00ednea. Ya, ahora te mando un beso."],["Poemita","Mi coraz\u00f3n entiende de pocas cuentas.\nPero distingue perfecto la diferencia entre ir solo e ir contigo."],["Poemita","Me gusta que mi amor por ti\ntenga sitio para tus ideas, incluso para las que reci\u00e9n est\u00e1s descubriendo."],["Poemita","Hay miradas que dan conversaci\u00f3n para rato.\nLa tuya a veces me deja queriendo preguntar en qu\u00e9 piensas."],["Poemita","En mi lista de cosas bonitas\nentran las flores, el cielo despejado y tu forma de decir mi nombre."],["Poemita","Si fueras a leer una sola frase m\u00eda hoy,\nquisiera que fuera esta: me alegra que seas t\u00fa."],["Poemita","Quiero ser esa persona a la que vuelves\ncon una noticia grande o con un simple \u00abhoy qu\u00e9 calor\u00bb."],["Poemita","El d\u00eda corre y yo le sigo el paso.\nPero si se trata de abrazarte, aprendo enseguida a quedarme quieto."],["Poemita","Abrir los ojos y encontrarte al lado\nser\u00eda una manera bien bonita de olvidarme de la hora."],["Poemita","A tu lado, hasta esperar un turno\npuede tener su parte buena si el hombro que rozo es el tuyo."],["Poemita","Me encanta esa sensaci\u00f3n\nde que un plan todav\u00eda lejano ya nos haga sonre\u00edr en el presente."],["Poemita","Si te dejara un papel en la mesa,\nlo doblar\u00eda poquito para que asome la parte que dice \u00abpara ti\u00bb."],["Poemita","Quiero conocer la canci\u00f3n que repetir\u00edas cien veces.\nMe gusta saber qu\u00e9 cosas te dan tantas ganas de volver."],["Poemita","En el mar hay mucha agua.\nEn m\u00ed, unas ganas tremendas de ir a ver el mar contigo."],["Poemita","Un beso en tu nariz\nser\u00eda mi manera favorita de interrumpir un silencio."],["Poemita","Me gusta cuando me entra la certeza\nde que estoy justo donde quer\u00eda estar: conversando contigo."],["Poemita","Si tu d\u00eda tuviera \u00edndice,\nyo empezar\u00eda por la parte que m\u00e1s ganas tengas de contar."],["Poemita","Qu\u00e9 lindo pensar que todav\u00eda nos faltan\npalabras nuestras que ni siquiera hemos inventado."],["Poemita","Mis planes contigo suelen empezar grandes.\nTambi\u00e9n ser\u00eda feliz devolvi\u00e9ndote una chompa en la puerta de casa."],["Poemita","Te quiero incluso cuando discrepas conmigo.\nConocerte tambi\u00e9n es escucharte decir lo que t\u00fa piensas."],["Poemita","La felicidad que deseo para ti\nincluye cosas que tal vez todav\u00eda no s\u00e9 nombrar. Cu\u00e9ntamelas cuando quieras."],["Poemita","Al final de un abrazo\nsiempre queda un segundo en el que yo me quedar\u00eda a vivir un ratito m\u00e1s."],["Poemita","Mishell cabe en seis letras.\nLo que me pasa al pronunciarlas ya ocupa bastante m\u00e1s."],["Poemita","Ven a sentarte en este pensamiento.\nJusto estaba imaginando qu\u00e9 bonito ser\u00eda verte hoy."],["Poemita","Si yo armara una mochila para un d\u00eda contigo,\ndejar\u00eda espacio para cualquier ocurrencia tuya de \u00faltimo minuto."],["Poemita","El amor me parece una palabra inmensa.\nCuando te agarro la mano, por fin entiendo su tama\u00f1o."],["Poemita","Entre cartas y llamadas,\nsigo siendo fan de esos segundos en que te tengo frente a m\u00ed."],["Poemita","Me gustar\u00eda aprender tus recetas favoritas,\nsobre todo la parte donde pruebo y t\u00fa me corriges con cari\u00f1o."],["Poemita","A veces decirte \u00abte extra\u00f1o\u00bb\nes mi forma abreviada de contarte todo lo que quisiera hacer contigo."],["Poemita","Del cielo s\u00e9 poquito.\nDe la alegr\u00eda que me da verte mirar hacia arriba, much\u00edsimo."],["Poemita","Qu\u00e9 ganas de una tarde en la que el plan\nsea seguir el olor de algo rico y compartir lo que encontremos."],["Poemita","Mi manera de mirarte cambia muy poco.\nDesde cerca o desde lejos, siempre termina queriendo que te acerques."],["Poemita","Eres mi persona favorita\npara empezar una an\u00e9cdota diciendo \u00abcreo que solo a m\u00ed me pasa esto\u00bb."],["Poemita","Si te pudiera envolver en una canci\u00f3n,\nelegir\u00eda una que te sepas y te den ganas de cantar."],["Poemita","Verte descubrir algo que te gusta\nme parece motivo suficiente para enamorarme otro poquito."],["Poemita","A m\u00ed d\u00e9jame la parte de recordarte\nque tambi\u00e9n puedes celebrar los pasitos peque\u00f1os."],["Poemita","Me imagino tomando t\u00e9 contigo\ny dejando que se enfr\u00ede por enredarnos en la charla."],["Poemita","Tu nombre tiene esa ma\u00f1a\nde aparecer en mis pensamientos cuando algo me sale bien."],["Poemita","Hay ma\u00f1anas que merecen un ramo.\nA ti te llevar\u00eda uno tambi\u00e9n en las ma\u00f1anas m\u00e1s corrientes."],["Poemita","Si alguna vez te tiemblan las ganas,\nsigue con calma. Yo puedo caminar a tu ritmo."],["Poemita","Quisiera que hoy te encuentre una cosa bonita\ntan de sorpresa como me encuentran tus sonrisas."],["Poemita","Pienso en todo lo que me gustar\u00eda regalarte\ny casi siempre acabo queriendo regalarte m\u00e1s tiempo juntos."],["Poemita","Acariciarte el pelo\nser\u00eda toda mi respuesta a la pregunta de qu\u00e9 quiero hacer ahorita."],["Poemita","Me gusta ser parte de tus d\u00edas\nhasta en los ratitos en que cada uno anda en sus cosas."],["Poemita","Uno podr\u00eda contar una cita por las horas.\nYo la contar\u00eda por las veces que terminamos sonriendo sin planearlo."],["Poemita","Nada me parece demasiado chiquito\nsi es algo que a ti te hace ilusi\u00f3n contarme."],["Poemita","Podr\u00eda so\u00f1ar con mil destinos.\nSi me das a elegir el primer paso, ser\u00eda ir a tocar tu puerta."],["Poemita","Me gustar\u00eda verte con mi chompa puesta,\naunque despu\u00e9s me toque andar negociando para recuperarla."],["Poemita","Si hoy te miras al espejo apurada,\npor m\u00ed te quedas otro segundo. Mira qu\u00e9 bonita chica tengo enfrente."],["Poemita","Hay algo en tus ojos al escucharme\nque me anima a seguir aun cuando no encuentro la frase exacta."],["Poemita","Soy de palabras a veces enredadas.\nCon una caricia te explicar\u00eda mejor todo este cari\u00f1o."],["Poemita","No s\u00e9 de jardines,\npero me aprender\u00eda el nombre de la flor que t\u00fa escogieras primero."],["Poemita","Me ilusiona que un d\u00eda podamos discutir\nsi el sill\u00f3n queda mejor al lado de la ventana y acabar ri\u00e9ndonos ah\u00ed sentados."],["Poemita","Todo lo bueno que te deseo\ntambi\u00e9n cabe en algo sencillo: que esta noche duermas en paz."],["Poemita","Te quiero con esa calma bonita\nde estar al lado de alguien y poder dejar el celular boca abajo."],["Poemita","Hoy me har\u00eda bien un abrazo tuyo.\nO dos, ya que estamos siendo sinceros."],["Poemita","Si la gente pudiera ver mis pensamientos,\nya conocer\u00eda la cara que pongo cuando apareces en ellos."],["Poemita","Una casa se reconoce por sus paredes.\nA ti te reconocer\u00eda en cualquier parte con solo o\u00edrte re\u00edr."],["Poemita","El mundo es grandote.\nA m\u00ed, cerca de ti, me alcanza un espacio bien chiquito."],["Poemita","Me gusta esta versi\u00f3n m\u00eda\nque se emociona por escribirle una carta a su enamorada."],["Poemita","Si te escribo \u00abven\u00bb,\nqu\u00e9 poquito ocupa la palabra\npara todas las ganas que tengo de verte."],["Poemita","Las cosas comunes tienen su gracia contigo.\nHasta escoger por d\u00f3nde cruzar se convierte en avanzar de la mano."],["Poemita","Amorcito, hoy te pienso con una sonrisa\ny te deseo una de esas alegr\u00edas que duran hasta la noche."],["Poemita","Cu\u00e1nto quiero a esa chica\nque va por ah\u00ed viviendo su d\u00eda sin saber que justo ahora la estoy pensando."],["Poemita","Yo prefiero tu versi\u00f3n completa,\ncon temas que te apasionan y cuentos a los que les das mil vueltas."],["Poemita","Esa habilidad m\u00eda de encontrarte bonita\nfunciona incluso cuando solo me acuerdo de ti."],["Poemita","Te escribir\u00eda despacito\npara que cada letra tenga tiempo de parecerse a lo que siento."],["Poemita","Qu\u00e9 bonito pensar en la palabra \u00abnosotros\u00bb\ny reconocer en ella tu vida junto a la m\u00eda."],["Poemita","Quiero hacerte cari\u00f1o a mi manera.\nSi hay otra que te llegue m\u00e1s bonito, me la ense\u00f1as."],["Poemita","Le pondr\u00eda una silla a tu tristeza\nsi alg\u00fan d\u00eda necesita quedarse un rato. Tambi\u00e9n s\u00e9 acompa\u00f1arte ah\u00ed."],["Poemita","Ser\u00eda lindo guardar en una cajita\nel sonido de las dos risas cuando el chiste nos agarra desprevenidos."],["Poemita","Si mi mano tuviera un sitio favorito,\nt\u00fa ya sabes entre qu\u00e9 dedos lo encontrar\u00eda."],["Poemita","Me gusta que el cari\u00f1o entre los dos\ntenga permiso de ser juguet\u00f3n y ponerse serio cuando hace falta."],["Poemita","De repente hay una tarde hermosa\nen la que ninguno tiene un gran tema y aun as\u00ed nos quedamos ah\u00ed."],["Poemita","Quisiera hacerte una trenza medio chueca\ny escuchar c\u00f3mo me ense\u00f1as a intentarlo de nuevo."],["Poemita","En mi cabeza hay una lista largu\u00edsima\nde cosas que te dir\u00eda si pudieras venir cinco minutos."],["Poemita","Si hoy te sale algo bien,\nme gustar\u00eda ser el que ande por ah\u00ed sonriendo por tu noticia."],["Poemita","Mi amor cabe en la palabra \u00abven\u00bb.\nLo dem\u00e1s te lo explicar\u00eda abriendo los brazos."],["Poemita","Un d\u00eda quiero reconocerte los pasos\nantes de que alcances a tocar la puerta."],["Poemita","Qu\u00e9 lindo que tengas ideas tan tuyas\nque al escucharlas sepa que nunca se me habr\u00edan ocurrido a m\u00ed."],["Poemita","Si me dieran una flor por cada vez que te pienso,\ntendr\u00eda que preguntarte d\u00f3nde nos cabe tanto florero."],["Poemita","Las despedidas se me hacen menos largas\nsi ya tenemos un \u00abnos vemos pronto\u00bb del cual agarrarnos."],["Poemita","Me imagino acerc\u00e1ndote el az\u00facar\nantes de que la pidas, despu\u00e9s de aprender c\u00f3mo tomas tus ma\u00f1anas."],["Poemita","Tu cari\u00f1o me cae como agua fresca\ncuando llevo demasiado rato con la cabeza llena."],["Poemita","A mi lado puedes pensar en voz alta.\nHasta los finales a los que llegas t\u00fa sola me encanta escucharlos."],["Poemita","Si alg\u00fan d\u00eda te falta inspiraci\u00f3n,\nte presto mis ojos: ven algo que admirar en ti hasta cuando descansas."],["Poemita","Me encanta preguntarte qu\u00e9 te apetece\ny ser parte del plan que se te dibuja en la cara."],["Poemita","Que en tus d\u00edas haya alguien\nque celebre que llegaste, incluso si solo ven\u00edas por un ratito. Aqu\u00ed estoy yo."],["Poemita","Mi bonita, te har\u00eda un poema con rima.\nPor ahora me sali\u00f3 uno con ganas de darte un beso."],["Poemita","De lo que cabe en mis brazos,\nt\u00fa eres lo que m\u00e1s feliz me pone tener cerquita."],["Poemita","A veces ser feliz\nes esperar a alguien con ganas y ver que esa persona tambi\u00e9n apura el paso."],["Poemita","El futuro anda ocupado llegando.\nMientras tanto, hoy ya tengo a qui\u00e9n mandarle todo este cari\u00f1o."],["Poemita","Dar\u00eda una vuelta m\u00e1s a la manzana\nsi eso me compra otro pedacito de conversaci\u00f3n contigo."],["Poemita","Te quiero con los ojos bien abiertos,\nmirando qui\u00e9n eres y todo lo que te importa."],["Poemita","D\u00e9jame aprender esa parte de tu historia\nque todav\u00eda cuentas bajito. Yo te escucho sin apurarte."],["Poemita","Si la ma\u00f1ana te encuentra despeinada,\nav\u00edsale que por m\u00ed ya se encontr\u00f3 con lo m\u00e1s bonito."],["Poemita","Te mandar\u00eda unas galletitas\nsi pudiera meter en el sobre el olorcito de reci\u00e9n hechas."],["Poemita","Abrazarte ser\u00eda un buen lugar\npara dejar de pensar qu\u00e9 hacer por un momento."],["Poemita","Yo tengo este defecto:\npienso en escribirte algo discreto y siempre se me nota que me encantas."],["Poemita","Me gusta cuando me cuentas tus razones.\nHasta en lo que vemos distinto encuentro algo tuyo que conocer."],["Poemita","Quisiera poder guardarte un pedazo de cielo\ncuando el atardecer se pone justo de ese color que quisieras mostrarle a alguien."],["Poemita","Si alg\u00fan d\u00eda pintamos una pared,\nseguro el mejor recuerdo va a ser decidir juntos el color."],["Poemita","Todo lo que se me ocurre decirte\nme suena mejor si te lo imagino escuchando a mi ladito."],["Poemita","Me gusta que hables con tus palabras.\nHasta las pausas me ayudan a entender lo que quieres decir."],["Poemita","Quiero que sientas mi cari\u00f1o\nhasta en la forma en que te dejo terminar una frase."],["Poemita","Qu\u00e9 linda se oye la palabra \u00abllegaste\u00bb\ncuando uno lleva toda la tarde esperando decirla."],["Poemita","Ser\u00eda capaz de aprender a envolver regalos\npor el puro gusto de verte desatar la cinta despacito."],["Poemita","Te quiero mirando hacia delante,\nilusionada por lo que vas a hacer, aunque todav\u00eda te d\u00e9 un poquito de miedo."],["Poemita","Si mi alegr\u00eda escribiera una carta,\nempezar\u00eda con tu apodo y acabar\u00eda pidiendo verte pronto."],["Poemita","Hay algo que nunca me canso de imaginar:\nencontrarte al salir y que los dos nos alegremos igual."],["Poemita","A veces me sorprende cu\u00e1nto se parece el cari\u00f1o\na ponerle cuidado a una respuesta que pudo pasar desapercibida."],["Poemita","Ese brillo que tienes al hablar de algo tuyo\nno necesita que yo entienda el tema para que me encante."],["Poemita","Podr\u00eda ponerle t\u00edtulo a esta nota.\nPero me gusta que tu nombre sea lo primero que pienso al leerla."],["Poemita","Mi cari\u00f1o tiene d\u00edas callados.\nEn ellos igual te acercar\u00eda la manta y me quedar\u00eda contigo."],["Poemita","Si sientes un rayito de sol en los dedos,\nimagina que te alcanc\u00e9 la mano desde aqu\u00ed."],["Poemita","Lo nuestro tiene esa gracia\nde que puedo tomarme en serio tu pena y al rato re\u00edrme contigo cuando te nazca."],["Poemita","Para ti quiero ventanas abiertas,\ncaminos seguros y alguien querido esper\u00e1ndote al otro lado."],["Poemita","Quisiera ser puntual hasta para el cari\u00f1o:\nllegar con el abrazo justo en el momento en que te haga falta."],["Poemita","Si te animas a probar algo nuevo,\nme gustar\u00eda estar ah\u00ed para disfrutar contigo hasta el primer intento chueco."],["Poemita","Hoy te mando una ternura bien concreta:\nojal\u00e1 llegues, te quites los zapatos y sientas que ya puedes descansar."],["Poemita","En mis pensamientos hay ratos libres\nque se llenan solos de ganas de saber de ti."],["Poemita","Mirarte mientras miras otra cosa\ndebe de ser mi forma menos discreta de decirte que me gustas."],["Poemita","Un d\u00eda voy a necesitar un mapa\npara se\u00f1alar tantos lugares a los que quisiera llevarte a pasear."],["Poemita","Si tuviera que elegir entre dos deseos\npedir\u00eda verte y dejar\u00eda que t\u00fa escojas el otro."],["Poemita","Me gustar\u00eda hacerte un desayuno sencillo:\npan, algo calentito y el tiempo suficiente para que no tengamos que correr."],["Poemita","El cari\u00f1o tambi\u00e9n puede ser pr\u00e1ctico.\nTe prestar\u00eda la casaca primero y discutir\u00eda despu\u00e9s cu\u00e1l de los dos ten\u00eda m\u00e1s fr\u00edo."],["Poemita","Si mis ojos fueran c\u00e1mara,\ntendr\u00eda una colecci\u00f3n entera de instantes en que te veo contenta."],["Poemita","Me sale f\u00e1cil pensar cosas bonitas de ti.\nLo que estoy aprendiendo es dec\u00edrtelas a tiempo."],["Poemita","No todos los d\u00edas s\u00e9 qu\u00e9 escribirte.\nTodos los d\u00edas me parece linda la idea de que sepas cu\u00e1nto importas."],["Poemita","Te invitar\u00eda a mirar el amanecer,\naunque capaz me quede m\u00e1s embobado viendo c\u00f3mo lo miras t\u00fa."],["Poemita","Qu\u00e9 lindo imaginar una biblioteca peque\u00f1a\ndonde encuentres notitas m\u00edas entre las p\u00e1ginas de tus libros."],["Poemita","A tu alegr\u00eda le tengo cari\u00f1o\nporque primero te hace bien a ti y despu\u00e9s me llega de rebote."],["Poemita","Si hoy est\u00e1s lejos,\nac\u00e9ptame este intento chiquito de sentarme contigo a la distancia."],["Poemita","Ser feliz contigo podr\u00eda verse desde afuera\ncomo dos personas demor\u00e1ndose en terminar un vaso de jugo."],["Poemita","Las palabras m\u00e1s dulces que conozco\nson las que te oir\u00eda decir justo cuando llego a casa."],["Poemita","Mi tarde entera puede seguir igual.\nCon saber que m\u00e1s ratito te veo, ya la miro de otra manera."],["Poemita","Quiero que mi compa\u00f1\u00eda se sienta c\u00f3moda,\ncomo sentarte donde puedes estirar las piernas sin pedir permiso."],["Poemita","El beso que te mando va despacio.\nTiene que encontrar tu frente y quedarse ah\u00ed un ratito."],["Poemita","Me gustar\u00eda que sepas cu\u00e1nto celebro\nque te atrevas a ser como eres delante de m\u00ed."],["Poemita","Si la luna estuviera un poco m\u00e1s baja,\nte invitar\u00eda a verla con detalle. Igual podemos juntarnos a mirarla desde ac\u00e1."],["Poemita","No pretendo adivinarte.\nPrefiero preguntarte y disfrutar c\u00f3mo me vas ense\u00f1ando a conocerte."],["Poemita","Hay una parte del d\u00eda que me encanta:\nel instante en que dejo de imaginarte porque por fin est\u00e1s aqu\u00ed."],["Poemita","Quisiera que siempre te quede tiempo\npara esas cosas tuyas que te devuelven el entusiasmo."],["Poemita","Cuando algo te d\u00e9 alegr\u00eda,\nt\u00f3came el hombro. Quiero alcanzar a verlo antes de que pase."],["Poemita","Mi amor por ti\nno exige ocasi\u00f3n especial para ponerse su mejor cara."],["Poemita","Si pudieras ver desde aqu\u00ed tu manera de re\u00edr,\nentender\u00edas por qu\u00e9 a veces alargo un chiste mal\u00edsimo."],["Poemita","Me imagino cuidando una plantita contigo.\nT\u00fa decides su nombre. Yo ya estoy habl\u00e1ndole de ti."],["Poemita","Te amo con ganas de seguir aprendiendo\na darte el cari\u00f1o de la forma en que mejor lo sientes."],["Poemita","Creo que los poemas nacieron as\u00ed:\nalguien se qued\u00f3 con algo bonito por decirle a alguien y busc\u00f3 d\u00f3nde escribirlo."],["Poemita","Mishell, apenas digo tu nombre\nya estoy un poquito m\u00e1s cerca de aquello que quer\u00eda contarte."],["Poemita","La pr\u00f3xima vez que no sepa terminar una carta,\nte voy a dibujar dos brazos abiertos. Ese final me sale."],["Poemita","Para entender cu\u00e1nto me alegra verte,\nimagina una puerta abri\u00e9ndose justo cuando ven\u00edas llegando a casa con fr\u00edo."],["Poemita","Qu\u00e9 bonito es poder quererte\ny al mismo tiempo seguir sorprendi\u00e9ndome por lo que descubro de ti."],["Poemita","Si hoy estamos cada uno por su lado,\nigual quiero que tengas compa\u00f1\u00eda en alguna de estas palabras."],["Poemita","Me gustar\u00eda que alguna ma\u00f1ana\ntodo el apuro sea decidir qui\u00e9n se queda con la \u00faltima tostada."],["Poemita","Tu cari\u00f1o tiene algo que reconozco:\nla paciencia de quedarse un momento m\u00e1s cuando al otro le cuesta hablar."],["Poemita","Sentir amor por ti\nme da ganas de tratar con m\u00e1s ternura hasta las cosas peque\u00f1as."],["Poemita","Si pudiera doblar este minuto y mand\u00e1rtelo,\nencontrar\u00edas adentro a alguien sonriendo mientras escribe para ti."],["Poemita","Har\u00eda una pausa en la pel\u00edcula\npara o\u00edr el comentario que te est\u00e9s aguantando. Seguro me interesa m\u00e1s."],["Poemita","Me gusta tu mirada curiosa.\nMe recuerda que hasta por mi propio barrio quedan cosas que descubrir."],["Poemita","Hay una parte de m\u00ed que todav\u00eda se pone nerviosa\nsi sabe que en un ratito te va a tener enfrente."],["Poemita","A mi cari\u00f1o se le dio por vivir en los detalles.\nCuando pregunto por ese pendiente tuyo, tambi\u00e9n te estoy diciendo que te quiero."],["Poemita","D\u00e9jame regalarte un instante de certeza:\nt\u00fa me importas much\u00edsimo, incluso en medio de un d\u00eda com\u00fan."],["Poemita","Cada vez que encuentro algo que s\u00e9 que te gustar\u00eda,\nme imagino tu reacci\u00f3n y ya me empieza a gustar m\u00e1s a m\u00ed tambi\u00e9n."],["Poemita","Qu\u00e9 ganas de llegar con dos entradas\ny que la mejor parte del plan sea con qui\u00e9n voy a ir."],["Poemita","A veces estoy ocupado y me acuerdo de ti.\nEs la interrupci\u00f3n m\u00e1s dulce que se me ocurre."],["Poemita","Te quiero tambi\u00e9n en las despedidas cortas,\ncuando el abrazo tiene que explicar todo en dos segundos."],["Poemita","Pondr\u00eda tu inicial en una esquina del cuaderno\ny me har\u00eda el loco si alguien pregunta por qu\u00e9 sonre\u00ed al escribirla."],["Poemita","No hace falta entenderte de golpe.\nMe gusta la idea de tener tiempo para ir entendi\u00e9ndote bien."],["Poemita","Si pudi\u00e9ramos pasear por este poema,\nal final de la l\u00ednea te estar\u00eda esperando para salir de la mano."],["Poemita","Me da gusto que tengas tu propio mundo.\nQu\u00e9 suerte la m\u00eda cuando me invitas a asomarme."],["Poemita","Una tarde con viento\nser\u00eda m\u00e1s bonita pele\u00e1ndonos de risa con una cometa entre los dos."],["Poemita","A m\u00ed me ganan esas cosas chiquitas\nque haces sin estar pensando en si alguien las nota."],["Poemita","Qu\u00e9 ganas de una cocina desordenada\ny nosotros felices porque algo nos sali\u00f3 rico al primer intento."],["Poemita","Cada vez que te leo con entusiasmo\nse me olvida que estoy viendo letras y me parece que te tengo enfrente."],["Poemita","Te quisiera regalar esa calma\nque me entra cuando puedo apoyar la cabeza en alguien que me quiere."],["Poemita","Si hay una palabra bonita para lo que siento,\nseguro se pronuncia parecido a cuando te llamo bajito."],["Poemita","Me imagino compartiendo un paraguas contigo.\nMe importar\u00eda poco mojarme un hombro si t\u00fa vas c\u00f3moda."],["Poemita","Hay algo inmensamente lindo\nen saber que una misma tarde nos est\u00e1 pasando a los dos."],["Poemita","A veces me acuerdo de ti\ny se me queda una sonrisa puesta que nadie m\u00e1s sabe de d\u00f3nde sali\u00f3."],["Poemita","Quisiera que nuestros d\u00edas tengan espacio\npara los planes importantes y para las bromas tontas que nos hacen bien."],["Poemita","T\u00fa puedes escoger la foto.\nYo ya s\u00e9 que me voy a quedar con cari\u00f1o hasta con la que sali\u00f3 movida."],["Poemita","Si hoy necesitas hacer las cosas despacio,\nme siento a tu lado. Nos alcanza con este pasito."],["Poemita","Te quiero con esa ternura\nque me hace bajarle la voz al mundo si te imagino descansando."],["Poemita","Un cari\u00f1o de bolsillo\nser\u00eda este besito que puedes llevarte aunque te toque salir apurada."],["Poemita","Cuando me preguntas en qu\u00e9 pienso\na veces la respuesta est\u00e1 ah\u00ed mismo, mir\u00e1ndome a los ojos."],["Poemita","Qu\u00e9 bonito llamarte por un apodo\ny que salga de tu cara una reacci\u00f3n que ya conozco y me sigue encantando."],["Poemita","Siempre pens\u00e9 que guardar el tiempo era imposible.\nLuego me abrazas y juro que un poquito s\u00ed se puede."],["Poemita","Si te veo llegar con ganas de hablar,\nmi tarde ya tiene el plan que le faltaba."],["Poemita","Amarte me parece un verbo bonito\nsobre todo cuando lo pongo a trabajar: escuchar, acompa\u00f1ar, cuidar."],["Poemita","Con una sola mirada tuya\nme pueden dar ganas de quedarme aun cuando ya estaba buscando mis llaves."],["Poemita","Quiero conocer cu\u00e1les son las palabras\nque mejor te hacen compa\u00f1\u00eda cuando toca esperar una buena noticia."],["Poemita","Te har\u00eda un abrigo de mis palabras m\u00e1s lindas.\nY si hiciera fr\u00edo de verdad, te paso mi casaca tambi\u00e9n."],["Poemita","Una de mis escenas favoritas del futuro\nes tan chiquita como sentarnos a decidir juntos qu\u00e9 hacemos de comer."],["Poemita","Qu\u00e9 lindo mirarte al final del d\u00eda\ny tener la confianza de decirte que hoy simplemente necesito estar cerca."],["Poemita","Si te pintara un coraz\u00f3n en la palma,\nme gustar\u00eda que te dure hasta que podamos juntar las manos otra vez."],["Poemita","Me hace feliz quererte despacio,\ndescubriendo cosas tuyas que solo se ven cuando uno presta atenci\u00f3n."],["Poemita","Contigo la ternura tiene muchas caras.\nUna de ellas me mira de costado y sabe que estoy por re\u00edrme."],["Poemita","Yo dejar\u00eda este poema sin punto final\nporque todav\u00eda me siguen dando ganas de decirte cosas."],["Poemita","Imagina que esta hoja huele a pan reci\u00e9n hecho.\nAhora imagina que estamos desayunando juntos. Ah\u00ed quer\u00eda llevarte."],["Poemita","Un espacio junto a ti vale mucho.\nSobre todo si puedo quedarme ah\u00ed sin pensar qu\u00e9 cara deber\u00eda poner."],["Poemita","Hay mensajes que caben en una palabra.\nMi favorito ser\u00eda \u00abllegu\u00e9\u00bb si llegara a donde est\u00e1s t\u00fa."],["Poemita","A veces me pregunto c\u00f3mo se ve el cari\u00f1o.\nLuego pienso en alguien que se acuerda de preguntarte c\u00f3mo te sali\u00f3 aquello."],["Poemita","Me gusta que una parte de tu mundo\nse me vaya haciendo familiar cada vez que me cuentas algo nuevo."],["Poemita","Si por m\u00ed fuera, los abrazos se podr\u00edan reservar.\nYo apartar\u00eda uno para la pr\u00f3xima vez que te vea."],["Poemita","Con ese pedacito de atenci\u00f3n que me regalas\nme ayudas a encontrarle sentido a cosas que tra\u00eda revueltas."],["Poemita","Amor m\u00edo, cada d\u00eda tiene lo suyo.\nHoy el m\u00edo ya tuvo este ratito de sentarme a escribirte."],["Poemita","Qu\u00e9 suerte que no seamos iguales.\nAs\u00ed todav\u00eda puedes acercarme a mirar algo desde donde est\u00e1s t\u00fa."],["Poemita","Hay un besito imaginario\nesperando el d\u00eda en que pueda darse el lujo de ser de verdad."],["Poemita","Si un d\u00eda entramos en una tienda de plantas,\nquiero averiguar cu\u00e1l escoger\u00edas para ponerle verde a la ventana."],["Poemita","Har\u00eda m\u00e1s cortito el camino hasta ti\ny bien largo el que nos toque recorrer de la mano."],["Poemita","Tu nombre tiene un sitio seguro\nentre las cosas que pronuncio y me alegran por dentro."],["Poemita","Cuando pienso en un lugar tranquilo,\na veces me basta la imagen de tu cabeza apoyada en mi hombro."],["Poemita","De todos los poemas que podr\u00eda hacerte,\nel mejor dicho en voz baja seguir\u00eda siendo un \u00abven, mi vida\u00bb."],["Poemita","Te dejar\u00eda esta nota en el bolsillo\npara que un d\u00eda cualquiera metas la mano y encuentres cari\u00f1o."],["Poemita","En un abrazo tuyo me siento afortunado.\nY eso que cuando estoy ah\u00ed, apenas me acuerdo de pensar."],["Poemita","Me quedar\u00eda a verte amanecer,\na escuchar tu primera idea del d\u00eda\ny a preguntarte si quieres dormir cinco minutitos m\u00e1s."],["Para ti","Me gustas hasta cuando no estoy tratando de pensar en ti. Mira nom\u00e1s en qu\u00e9 ando ahora."],["De m\u00ed para ti","Te amo musho, china. As\u00ed, con faltas y todo."],["Para ti","Voy a ser bien sincero contigo, chinita. Entre todos los planes que podr\u00eda hacer hoy, mi favorito sigue siendo verte."],["Para ti","Hay algo muy tuyo en la manera de alegrarte por las cosas chiquitas. Ojal\u00e1 nunca pierdas eso."],["Para ti","Cuando me dan una noticia bonita, mis ganas de cont\u00e1rtela llegan antes de que termine de escuchar."],["Para ti","Quiero seguir conoci\u00e9ndote incluso el d\u00eda en que crea saberme tus gustos de memoria."],["Para ti","Te quiero de esa forma en que me acuerdo de preguntarte c\u00f3mo termin\u00f3 algo que me contaste hace d\u00edas."],["Para ti","Cuando dices lo que piensas con tus propias palabras, me encantas. No hace falta que te salga bonito para que yo quiera escucharlo."],["Para ti","Mishell, me gusta esa confianza de poder decirte \u00abtengo ganas de verte\u00bb sin tener que inventarme otra excusa."],["Para ti","Qu\u00e9 lindo que la persona con la que puedo hablar de cosas importantes sea tambi\u00e9n con la que puedo hacer tanta tonter\u00eda."],["Para ti","Cuando te cuento algo y te emocionas conmigo, me dan ganas de celebrar dos veces."],["Para ti","A m\u00ed tambi\u00e9n me da nervios decir cosas bonitas en voz alta. Igual te las quiero decir, aunque me r\u00eda a la mitad."],["Para ti","Mi bonita, hasta los d\u00edas normales me dan motivos para agradecer que est\u00e9s en mi vida."],["Para ti","Lo que siento por ti me sale en detalles bien sencillos. Como acordarme de guardar algo porque s\u00e9 que te gustar\u00eda verlo."],["Para ti","Siempre quiero saber c\u00f3mo est\u00e1s de verdad, incluso si tu respuesta necesita m\u00e1s de un mensaje."],["Para ti","Qu\u00e9 suerte poder llamarte por tu nombre y que para m\u00ed signifique tanto."],["Para ti","La verdad, si pudiera pasar un ratito a tu lado ahora, no gastar\u00eda ni un minuto tratando de hacerme el interesante."],["Para ti","Me haces querer estar m\u00e1s atento. A veces lo m\u00e1s lindo que puedo hacer por ti es acordarme de una cosa que mencionaste de pasada."],["Para ti","Que seas mi enamorada todav\u00eda me parece una noticia que vale la pena celebrar."],["Para ti","Hoy se me ocurri\u00f3 que quiz\u00e1 t\u00fa tampoco sabes lo bonita que se te pone la cara cuando algo te sale bien."],["Para ti","Si hay que elegir entre tener la \u00faltima palabra o quedarme otro rato abraz\u00e1ndote, ya sabes qu\u00e9 elijo."],["Para ti","Te mereces escuchar cosas bonitas tambi\u00e9n los d\u00edas en que todo te sale f\u00e1cil. As\u00ed que ah\u00ed va una: me encanta verte confiar en ti."],["Para ti","No llevo la cuenta de las veces que pienso en ti. Ser\u00eda bien dif\u00edcil hacer cualquier otra cosa."],["Para ti","Ojal\u00e1 te llegue un poquito de todo el cari\u00f1o con el que escrib\u00ed tu nombre aqu\u00ed, Mishell."],["Para ti","A veces me preguntas qu\u00e9 pasa y yo solo estoy contento de tenerte al lado. \u00bfC\u00f3mo te explico eso sin ponerme todo cursi?"],["Para ti","Puedes venir a contarme hasta una historia sin final. A m\u00ed me interesa qu\u00e9 te pas\u00f3 a ti."],["Para ti","Me gusta que podamos querernos sin tener que estar siempre diciendo algo brillante."],["Para ti","Nunca me parece poca cosa que hagas tiempo para m\u00ed. Ese ratito tambi\u00e9n es tuyo, y decides pasarlo conmigo."],["Para ti","Cuando tengas un d\u00eda que quieras recordar, cu\u00e9ntamelo. Me har\u00eda feliz ayudarte a guardarlo."],["Para ti","Me sale muy natural incluirte cuando imagino algo bonito. Me pasa hasta con las cosas que todav\u00eda no tienen fecha."],["Para ti","Tu manera de ser me da curiosidad. Siempre hay un porqu\u00e9 detr\u00e1s de lo que eliges y me gusta descubrirlo."],["Para ti","Si hoy necesitas que alguien te haga barra, aqu\u00ed tienes a tu hincha m\u00e1s entusiasta."],["Para ti","No tengo una frase elegante para esto. Me siento querido contigo y eso para m\u00ed es enorme."],["Para ti","Que alguien te entienda incluso un poquito ya es lindo. Que encima ese alguien seas t\u00fa me encanta."],["Para ti","Te escuchar\u00eda contarme con lujo de detalles por qu\u00e9 cambiaste de opini\u00f3n. A veces esa es la mejor parte de la historia."],["Para ti","Cuando algo sale distinto de lo que pensabas, igual sigo viendo todo el esfuerzo que le pusiste."],["Para ti","Quisiera que cada vez que leas tu nombre escrito por m\u00ed sepas que lo escrib\u00ed sonriendo."],["Para ti","Me interesa lo que te hace feliz aunque yo reci\u00e9n est\u00e9 aprendiendo por qu\u00e9 te gusta tanto."],["Para ti","No s\u00e9 c\u00f3mo haces, pero hasta mi \u00abya te cuento despu\u00e9s\u00bb contigo termina siendo \u00abya, mira, te cuento\u00bb."],["Para ti","Gracias por darme a conocer tu forma de ver las cosas. Hay ideas que se me habr\u00edan pasado de largo sin ti."],["Para ti","De todas las palabras cari\u00f1osas que uso contigo, en todas quiero decirte lo mismo: me importas un mont\u00f3n."],["Para ti","Hay d\u00edas en que tenerte cerca es un plan completo. Hasta puedo cancelar mi gran compromiso de mirar el techo, imag\u00ednate."],["Para ti","Tu cari\u00f1o me llega tambi\u00e9n en las preguntas chiquitas. Sobre todo en esas que me haces porque s\u00ed te acuerdas."],["Para ti","Quiero que te sientas libre de cambiar de gustos. Me va a gustar conocer tambi\u00e9n a la Mishell de despu\u00e9s."],["Para ti","Verte orgullosa de algo que hiciste debe de estar entre mis alegr\u00edas favoritas."],["Para ti","Cuando hablo de ti me delato rapid\u00edsimo. A la segunda frase ya se me nota lo enamorado que estoy."],["Para ti","Aunque lo \u00fanico que tengas para contar sea que hoy descansaste rico, igual quiero saberlo."],["Para ti","Me pone contento pensar que por ah\u00ed vas caminando, haciendo tus cosas, sin tener idea de que justo estoy pensando en ti."],["Para ti","Hay algo muy bonito en aprender c\u00f3mo quiere que la quieran otra persona. Contigo me dan ganas de seguir aprendiendo."],["Para ti","Me gustas cuando vas decidida, cuando te tomas tu tiempo y cuando necesitas pensarlo otra vez."],["Para ti","Si te emocionas a mitad de una explicaci\u00f3n y tienes que empezar de nuevo, empieza. Yo me acomodo para escucharte."],["Para ti","Ser tu enamorado me da unas alegr\u00edas bien espec\u00edficas. Por ejemplo, poder decir \u00abesa es mi chica\u00bb con todo el orgullo del mundo."],["Para ti","El cari\u00f1o que te tengo cabe en dos palabras, pero cada d\u00eda se me ocurren m\u00e1s razones para dec\u00edrtelas."],["Para ti","No hace falta que el d\u00eda venga bonito de f\u00e1brica. A veces apareces t\u00fa con un comentario y ya qued\u00f3 arregladito."],["Para ti","Quiero que puedas decirme qu\u00e9 necesitas sin preocuparte por encontrar las palabras perfectas."],["Para ti","T\u00fa me gustas entera, hasta en lo que todav\u00eda me falta entender de ti."],["Para ti","Mi vida, cuando algo te d\u00e9 mucha ilusi\u00f3n, ven a cont\u00e1rmelo as\u00ed de emocionada. A m\u00ed me alegra que me hagas parte."],["Para ti","Me encanta esa cercan\u00eda en la que ya puedo reconocer que algo te gust\u00f3 incluso antes de que me lo digas."],["Para ti","Si te parece que ya me contaste algo, cu\u00e9ntamelo igual. Tal vez justo ten\u00eda ganas de volver a escucharlo."],["Para ti","Hay detalles tuyos que me alegran y seguro t\u00fa ni los cuentas como detalles."],["Para ti","Contigo me sale preguntar una cosa m\u00e1s. Siempre me da curiosidad qu\u00e9 pensaste, c\u00f3mo te sentiste, qu\u00e9 pas\u00f3 despu\u00e9s."],["Para ti","A veces no necesito que me animes. Saber que est\u00e1s de mi lado ya me da bastante tranquilidad."],["Para ti","Quiero verte cumplir tus planes tambi\u00e9n desde la primera fila de los intentos. Ah\u00ed tambi\u00e9n tienes quien te aplauda."],["Para ti","Me gusta que puedas ense\u00f1arme algo y al ratito estemos los dos ri\u00e9ndonos de cualquier ocurrencia."],["Para ti","No me voy a hacer el discreto en mi propio papelito. Estoy bien enamorado de ti."],["Para ti","El d\u00eda que te preguntes si alguien se fija en tus esfuerzos chiquitos, acu\u00e9rdate de que yo s\u00ed."],["Para ti","Me agrada la persona que soy cuando estoy contigo. Me dan m\u00e1s ganas de escuchar, de preguntar y de decir lo que siento."],["Para ti","Qu\u00e9 bonito que seas t\u00fa quien recibe este mensaje. Lo escrib\u00ed con tu carita en mente."],["Para ti","Si estuvieras sentada aqu\u00ed ahora, seguramente tardar\u00eda en decirte todo esto. Primero querr\u00eda quedarme vi\u00e9ndote un poquito."],["Para ti","No s\u00e9 cu\u00e1l de todos tus apodos me gusta m\u00e1s. Creo que me gusta que, con cualquiera de ellos, sabes que te estoy hablando con cari\u00f1o."],["Para ti","Me hace ilusi\u00f3n hasta preguntarte qu\u00e9 tal va una cosa que te tiene emocionada."],["Para ti","Me importa tu opini\u00f3n por una raz\u00f3n sencilla: viene de ti, y me gusta saber lo que piensas."],["Para ti","Tienes derecho a cambiar de idea a mitad del plan. Yo feliz de enterarme de lo que ahora te hace ilusi\u00f3n."],["Para ti","A veces me dan ganas de decirte \u00abgracias\u00bb en medio de la nada. Es porque de repente caigo en la cuenta de lo bien que me hace tenerte."],["Para ti","Podr\u00eda hacerte un cumplido enorme, pero hoy quiero uno sencillo. Qu\u00e9 bonita compa\u00f1\u00eda eres."],["Para ti","Me conmueve que me tengas paciencia cuando intento explicar algo y todav\u00eda ni yo s\u00e9 c\u00f3mo decirlo."],["Para ti","Una de mis cosas favoritas de estar contigo es que puedo alegrarme por cosas que antes ni siquiera conoc\u00eda."],["Para ti","Si ma\u00f1ana se te ocurre un sue\u00f1o distinto, yo quiero saber de ese tambi\u00e9n."],["Para ti","Cuando dudes entre mandarme algo que te dio risa o dejarlo pasar, m\u00e1ndamelo. Me encanta enterarme de qu\u00e9 te hizo re\u00edr."],["Para ti","Me importa c\u00f3mo te tratas cuando te equivocas. Ojal\u00e1 puedas mirarte con la misma ternura con la que yo te mirar\u00eda."],["Para ti","Me gusta cuando una opini\u00f3n tuya me hace quedarme pensando. As\u00ed siento que te voy conociendo un poquito m\u00e1s."],["Para ti","Esto es para recordarte algo que en persona a veces cambio por un abrazo: me encanta estar contigo."],["Para ti","Tener confianza contigo tambi\u00e9n es poder decir \u00abno entend\u00ed, cu\u00e9ntame otra vez\u00bb y quedarme a escuchar."],["Para ti","No te apures en responder este papelito en tu cabeza. Con que te haga sonre\u00edr un segundo, yo ya estoy feliz."],["Para ti","Lo m\u00e1s lindo de decirte que te quiero es que puedo volver a dec\u00edrtelo ma\u00f1ana y voy a seguir sinti\u00e9ndolo."],["Para ti","Si me vieras cuando aparece algo que s\u00e9 que te va a gustar, entender\u00edas por qu\u00e9 a veces te escribo tan de repente."],["Para ti","Me gustas en las cosas grandes y tambi\u00e9n en tus peque\u00f1as preferencias, esas que hacen que t\u00fa seas t\u00fa."],["Para ti","Qu\u00e9 gusto me da cuando te animas a decir \u00abesto s\u00ed me sale bien\u00bb. Yo tambi\u00e9n creo en eso que haces."],["Para ti","Me importa estar para ti de una manera que de verdad te sirva. Si solo quieres compa\u00f1\u00eda, traigo compa\u00f1\u00eda."],["Para ti","T\u00fa haces que mi cari\u00f1o tenga a qui\u00e9n llegar. Parece una cosa bien sencilla y para m\u00ed significa much\u00edsimo."],["Para ti","Cada vez que descubro algo nuevo de ti siento un poquito de la ilusi\u00f3n de cuando uno empieza a conocer a alguien que le gusta."],["Para ti","A veces una palabra tuya basta para que yo quiera saber el cuento entero."],["Para ti","No todas mis ganas de verte vienen de extra\u00f1arte. A veces acabo de verte y simplemente me qued\u00e9 con ganas de m\u00e1s."],["Para ti","Mi parte favorita de tus gustos es escuchar c\u00f3mo los explicas t\u00fa."],["Para ti","Quiero que puedas celebrar cosas peque\u00f1as conmigo. Si te cost\u00f3 esfuerzo, ya tenemos motivo."],["Para ti","Hoy te quiero con la naturalidad con la que se busca la mano de alguien querido al caminar."],["Para ti","Si te digo que eres preciosa justo cuando est\u00e1s concentrada en otra cosa, es porque tambi\u00e9n entonces me lo pareces."],["Para ti","Mi cari\u00f1o por ti no depende de que tengas un d\u00eda redondito. Tambi\u00e9n te quiero con pendientes y con sue\u00f1o."],["Para ti","A veces se me pasa por la cabeza lo raro que ser\u00eda haberme perdido de conocerte. Qu\u00e9 bueno que no."],["Para ti","Chiki, tienes toda mi atenci\u00f3n. Y si me distraigo mir\u00e1ndote, un poquito de culpa s\u00ed tienes."],["Para ti","Me alegra que tengas un mundo tuyo que yo pueda ir conociendo despacito y al que puedas volver cada vez que lo necesites."],["Para ti","Si estuviera eligiendo un regalo para ti, lo primero ser\u00eda preguntarme qu\u00e9 te har\u00eda sentir escuchada. Ah\u00ed suele estar lo bonito."],["Para ti","Te tengo un cari\u00f1o que se acuerda de ti incluso cuando el d\u00eda anda lleno."],["Para ti","Yo s\u00e9 que eres capaz de resolver tus cosas. Igual quiero ofrecerte mi mano para cuando prefieras hacerlo acompa\u00f1ada."],["Para ti","Ojal\u00e1 sigas teniendo motivos para decir \u00abestoy feliz\u00bb. A m\u00ed se me alegra algo por dentro cada vez que te escucho decirlo."],["Para ti","Morenita, hasta un saludo tuyo me recuerda que entre t\u00fa y yo hay un cari\u00f1o bien bonito."],["Para ti","Me gusta c\u00f3mo algo que a m\u00ed me parec\u00eda simple se vuelve interesante apenas me cuentas por qu\u00e9 te importa."],["Para ti","Es bonito aprender a reconocerte en lo que eliges. Un color, una canci\u00f3n, una opini\u00f3n que dir\u00edas bien segura."],["Para ti","No siempre voy a adivinar qu\u00e9 necesitas. S\u00ed quiero que sepas que me importa lo suficiente como para preguntarte."],["Para ti","Me dieron ganas de escribirte una de esas cosas que le salen a uno sin pensar tanto: qu\u00e9 feliz estoy de quererte."],["Para ti","De todo lo que podemos compartir, tu confianza sigue pareci\u00e9ndome uno de los regalos m\u00e1s lindos."],["Para ti","Quiero cuidarte tambi\u00e9n en las cosas que no se ven, como recordar qu\u00e9 temas prefieres conversar con calma."],["Para ti","Te quiero tanto que a veces lo m\u00e1s rom\u00e1ntico que se me ocurre es quitarte un pendiente para que descanses."],["Para ti","Si alguien me pregunta qu\u00e9 me enamora de ti, seguro me demoro. C\u00f3mo explico en una sola frase todo lo que encuentro cuando te presto atenci\u00f3n."],["Para ti","Qu\u00e9 bonito me resulta saber que hay cosas del d\u00eda que t\u00fa eliges venir a contarme a m\u00ed."],["Para ti","Confiar en ti tambi\u00e9n se siente as\u00ed: puedo reconocer que algo me importa sin que me d\u00e9 roche que se me note."],["Para ti","A veces quisieras explicarme por qu\u00e9 algo te da risa y ya estoy ri\u00e9ndome contigo solo de verte tan contenta."],["Para ti","Me gusta cuando eliges algo porque a ti te encanta. Esa felicidad tuya tiene su propia gracia."],["Para ti","Podemos estar cada uno haciendo sus cosas y aun as\u00ed llevarnos presentes. Eso tambi\u00e9n me parece una forma bien bonita de acompa\u00f1arnos."],["Para ti","Si me das a escoger el mejor momento para dec\u00edrtelo, siempre se me ocurre \u00abahora\u00bb. Te amo, mi bonita."],["Para ti","Soy de fijarme en lo que te entusiasma, por si alg\u00fan d\u00eda puedo sorprenderte con algo que s\u00ed te haga ilusi\u00f3n."],["Para ti","Gracias por hacerme sentir que lo que me pasa, por m\u00e1s peque\u00f1o que sea, tiene cabida en tu d\u00eda."],["Para ti","Hay preguntas tuyas que me ayudan a conocerme. Qu\u00e9 especial que hasta eso me pase conversando contigo."],["Para ti","El cari\u00f1o tambi\u00e9n se me nota en las ganas de quedarme a entender lo que quisiste decir."],["Para ti","Hoy quiero que te llegue un cumplido que quiz\u00e1 no te digo suficiente. Me encanta tu criterio para elegir lo que te hace bien."],["Para ti","Contigo hasta me animo a contar historias en las que yo quedo medio sonso. Considera eso una prueba muy seria de amor, jaja."],["Para ti","Me da ternura imaginarte leyendo esto con la misma cara que pondr\u00edas si te lo dijera al o\u00eddo."],["Para ti","Quiero saber tanto de lo que lograste como de lo que est\u00e1s intentando. En las dos cosas est\u00e1s poniendo algo tuyo."],["Para ti","Me hace feliz tener la confianza de preguntarte tonter\u00edas. A veces de ah\u00ed salen las respuestas m\u00e1s interesantes."],["Para ti","Si hoy te acordaste de m\u00ed en un momento cualquiera, ya tuvimos una cita chiquitita en tu cabeza. Yo organizo la pr\u00f3xima en la m\u00eda."],["Para ti","Me gusta poder decirte que te admiro y saber exactamente por qu\u00e9. Le pones coraz\u00f3n a lo que es importante para ti."],["Para ti","Qu\u00e9 suerte la m\u00eda, que de todas las personas que pod\u00eda conocer, termin\u00e9 aprendiendo a quererte a ti."],["Para ti","Mishell, a veces pongo cara tranquila mientras por dentro estoy celebrando que te tengo enfrente."],["Para ti","A mi cari\u00f1o le sale f\u00e1cil tu nombre. Es lo primero que pienso cuando algo me recuerda lo que me hace bien."],["Para ti","Si hoy est\u00e1s especialmente contenta, perm\u00edteme ser un poquito cargoso y preguntarte todo sobre eso."],["Para ti","Me gusta tanto tu compa\u00f1\u00eda que hasta las despedidas cortitas me dejan mirando un ratito m\u00e1s."],["Para ti","Lo que haces por m\u00ed lo noto. Incluso cuando t\u00fa lo ves como algo tan natural que ni se te ocurre mencionarlo."],["Para ti","Hay un pedacito de alegr\u00eda en saber que en alg\u00fan rato del d\u00eda vas a leer esto."],["Para ti","Gracias por querer conocer mi versi\u00f3n real, la que acomoda las palabras tarde y a veces se r\u00ede antes de terminar el chiste."],["Para ti","No me canso de aprender qu\u00e9 detalles s\u00ed te gustan a ti. Quererte se siente m\u00e1s bonito cuando acierto por haberte escuchado."],["Para ti","Si pudieras o\u00edr mi voz leyendo esta nota, se me notar\u00eda el cari\u00f1o hasta en las comas."],["Para ti","Me encanta que tengamos tiempo para hacernos preguntas nuevas. A\u00fan me quedan un mont\u00f3n de cosas que quiero saber de ti."],["Para ti","Hoy capaz andamos cada uno en lo suyo. Igual te mando un besito para que nuestros d\u00edas se crucen un momentito."],["Para ti","Hasta en los d\u00edas ocupados se me escapa un pensamiento bonito contigo. Este se convirti\u00f3 en papelito."],["Para ti","Si alguna vez me ves demasiado orgulloso de ti, d\u00e9jame. Estoy ejerciendo mi derecho de chico enamorado."],["Para ti","Te quiero con curiosidad por todo lo que viene y con gratitud por lo que ya somos."],["Para ti","Me parece lindo que podamos ser dos personas distintas y aun as\u00ed tener tantas ganas de entendernos."],["Para ti","No s\u00e9 cu\u00e1l es la mejor forma de empezar una carta de amor. Yo empezar\u00eda diciendo \u00abhola, Mishell\u00bb y ya estar\u00eda sonriendo."],["Para ti","Me gustas cuando te r\u00edes y tambi\u00e9n en ese segundo anterior, cuando parece que est\u00e1s decidiendo si vas a aguantar la risa."],["Para ti","Cuando un d\u00eda se siente muy largo, pensar en que luego puedo saber de ti me pone de buen \u00e1nimo."],["Para ti","Hay cari\u00f1o en hacerte una pregunta y dejarte espacio para contestarla a tu manera. Quiero darte mucho de ese cari\u00f1o."],["Para ti","Una cosa tengo clara: escuchar que te fue bien me pone content\u00edsimo aunque el d\u00eda reci\u00e9n empiece."],["Para ti","Capaz ahora ando haciendo cualquier cosa y t\u00fa est\u00e1s leyendo esto. Me gusta haberte dejado compa\u00f1\u00eda por adelantado."],["Para ti","Ac\u00e1 hay un enamorado que oye tu nombre y pone atenci\u00f3n aunque est\u00e9n llamando a otra persona."],["Para ti","Me gustas en los ratitos en que te olvidas de c\u00f3mo te ves porque est\u00e1s pas\u00e1ndola bien."],["Para ti","Cuando estoy cerca de ti, me dan ganas de quedarme lo suficiente para escuchar tambi\u00e9n lo que ibas a contarme al final."],["Para ti","Es bien bonito que algo que te pasa a ti pueda hacerme tan feliz a m\u00ed."],["Para ti","Yo tambi\u00e9n estoy aprendiendo c\u00f3mo se quiere bien. Contigo me nace seguir poniendo de mi parte."],["Para ti","Quiero que te sientas elegida hasta en las cosas peque\u00f1as. Como reservar un rato del d\u00eda solo para escucharte."],["Para ti","No sab\u00eda que preguntar \u00ab\u00bfllegaste bien?\u00bb pod\u00eda llevar tanto cari\u00f1o adentro hasta que empec\u00e9 a pregunt\u00e1rtelo a ti."],["Para ti","Mi coraz\u00f3n se emociona por cosas bien simples \u00faltimamente. Por ejemplo, que el mensaje diga tu nombre."],["Para ti","Me encanta que me tengas presente cuando ves algo que crees que va conmigo. Se siente bonito saber que me conoces."],["Para ti","Si hoy no alcanzaste a hacer todo, igual hiciste algo importante: seguir a tu ritmo. A m\u00ed me alegra que te cuides."],["Para ti","Entre tanto ruido que hay a veces, tu voz es de las que de verdad quiero escuchar."],["Para ti","Si me dicen que pida un gusto peque\u00f1o, pedir\u00eda poder sentarme junto a ti cuando tengas algo que contarme."],["Para ti","Tu forma de entusiasmarte me recuerda que todav\u00eda hay un mont\u00f3n de cosas bonitas por descubrir."],["Para ti","Quer\u00eda dejarte por escrito que valoro mucho c\u00f3mo me escuchas. En una conversaci\u00f3n cualquiera t\u00fa puedes hacerme sentir importante."],["Para ti","Me gusta tanto cuando conf\u00edas en una idea tuya que a ratos dan ganas de aplaudirte antes de que termines de contarla."],["Para ti","Una de las cosas m\u00e1s lindas que puedo ofrecerte es mi atenci\u00f3n. Y ahorita, aun sin tenerte enfrente, la tienes."],["Para ti","Quiero seguir siendo esa persona a la que te nazca contarle una alegr\u00eda mientras todav\u00eda est\u00e1 fresquita."],["Para ti","Cada \u00abte amo\u00bb m\u00edo tiene algo de ti. C\u00f3mo me miras, qu\u00e9 me dices, c\u00f3mo te tomas el tiempo de estar."],["Para ti","Si tuviera que resumirte mi estado de \u00e1nimo ahora, dir\u00eda \u00abcon ganas de darle un beso a mi chica\u00bb."],["Para ti","Mira qu\u00e9 curioso: puedo estar escribi\u00e9ndote para alegrarte un poquito y termino content\u00e1ndome yo tambi\u00e9n."],["Para ti","Tu tranquilidad me importa tanto como tu alegr\u00eda. Ojal\u00e1 hoy tengas un rato sin prisa para ti."],["Para ti","Me gusta tratarte con cari\u00f1o hasta en los detalles m\u00e1s normales. Sobre todo ah\u00ed, que es donde pasa la vida."],["Para ti","Quiero acordarme de agradecerte cuando haces que algo dif\u00edcil sea un poquito m\u00e1s f\u00e1cil para m\u00ed."],["Para ti","Hay un mont\u00f3n de planes bonitos en el mundo. Tambi\u00e9n hay uno bien simple que se llama \u00abllegar y encontrarte\u00bb."],["Para ti","Bodoque, ojal\u00e1 t\u00fa tambi\u00e9n notes lo f\u00e1cil que me sale ser cari\u00f1oso cuando estoy contigo."],["Para ti","Si te cuento que tuve un buen d\u00eda, capaz una de las razones fue algo tuyo que hasta a ti se te pas\u00f3 por alto."],["Para ti","Yo s\u00ed quiero conocer la canci\u00f3n que tienes pegada. Luego, cuando se me pegue a m\u00ed, fingir\u00e9 sorpresa."],["Para ti","Las ganas de darte cari\u00f1o me aparecen a cualquier hora. No podr\u00eda ponerles horario aunque quisiera."],["Para ti","Me gusta pensar que podemos acompa\u00f1arnos en los cambios sin dejar de tenernos curiosidad."],["Para ti","Hay cosas que solo le contar\u00eda a alguien con quien me siento en casa. Qu\u00e9 bonito que tan seguido esa persona seas t\u00fa."],["Para ti","Cuando me escribes para contarme algo que hiciste por primera vez, siento una ilusi\u00f3n incre\u00edble de que me hayas hecho parte."],["Para ti","Me quedar\u00eda un ratito oy\u00e9ndote decir lo que te gusta de ti. Me alegra cuando puedes verte con cari\u00f1o."],["Para ti","Tus ganas de entenderme merecen m\u00e1s que un \u00abgracias\u00bb. Tambi\u00e9n quiero tener contigo esa misma paciencia."],["Para ti","Quiero que puedas decir \u00abesto me hace ilusi\u00f3n\u00bb y sentir que conmigo la ilusi\u00f3n te puede crecer."],["Para ti","Hasta cuando explicas algo muy en serio hay un detalle tuyo que me da ternura. Creo que ya estoy perdidazo."],["Para ti","Me encanta cada vez que hacemos un espacio para saber del otro aunque el d\u00eda no haya tenido nada espectacular."],["Para ti","A veces veo algo bonito y ya estoy sacando el celular para ense\u00f1\u00e1rtelo. As\u00ed apareces en mi d\u00eda, hasta cuando ando haciendo otras cosas."],["Para ti","Me importas de una manera que se me aparece hasta al pensar si descansaste bien."],["Para ti","La manera en que te animas a probar algo nuevo me parece m\u00e1s bonita de lo que quiz\u00e1 te he dicho."],["Para ti","Tienen suerte las personas que pueden conocer tu lado m\u00e1s cari\u00f1oso. Yo, que soy una de ellas, lo s\u00e9 bien."],["Para ti","Quiero que tambi\u00e9n puedas venir a celebrar conmigo las cosas que solo t\u00fa sabes cu\u00e1nto te costaron."],["Para ti","Me hace gracia lo poco que me dura la cara normal cuando veo que te est\u00e1s riendo."],["Para ti","A ti te sale natural ser t\u00fa. A m\u00ed me sale natural quedarme encantado con eso."],["Para ti","Si hay una parte de tu d\u00eda de la que quieres hablar m\u00e1s, yo feliz de volver justo a esa parte."],["Para ti","Da gusto querer a alguien a quien tambi\u00e9n admiras. Contigo me pasan las dos cosas."],["Para ti","Me imagino tu cara al leer algo tierno y ya con eso me dan ganas de seguir escribi\u00e9ndote."],["Para ti","No hace falta que me prometas un d\u00eda extraordinario. Si me das un beso y me cuentas c\u00f3mo est\u00e1s, yo feliz."],["Para ti","Hay gente que oye un chisme y necesita contarlo. Yo veo algo bonito y necesito que t\u00fa tambi\u00e9n lo veas."],["Para ti","Mishell, tu cari\u00f1o le hace bien a partes de m\u00ed que ni sab\u00eda c\u00f3mo explicar."],["Para ti","Me gusta que tus opiniones tengan tu propia historia detr\u00e1s. A veces pregunto por curiosidad y termino aprendiendo mucho de ti."],["Para ti","Qu\u00e9 alivio poder decirte \u00abesto me dio nervios\u00bb y sentir que puedo seguir hablando tranquilo."],["Para ti","Si hay algo lindo que quisiera repetirte muchas veces, es que estoy agradecido de ser parte de tu vida."],["Para ti","Siempre que te nazca mostrarme algo que hiciste, tr\u00e1elo. Me ilusiona ver la parte tuya que le pusiste."],["Para ti","Qu\u00e9 bonito que pueda pensar en tu felicidad y que de verdad me importe aunque yo no tenga nada que ver con lo que te alegr\u00f3."],["Para ti","Disfruto mucho cuando puedo hacer algo por ti y s\u00e9 que justo necesitabas ese gesto."],["Para ti","Hoy te mando un \u00abte quiero\u00bb de los tranquilos, como dicho al pasar mientras cada uno sigue con sus cosas."],["Para ti","Me hace gracia cuando intento describirte sin sonar enamorado. Duro m\u00e1s o menos hasta que tengo que decir tu nombre."],["Para ti","A veces la palabra \u00abnovia\u00bb me queda cortita para todo lo que eres para m\u00ed. Encima eres t\u00fa quien me escucha, me ense\u00f1a y me hace re\u00edr."],["Para ti","Te quiero en cada versi\u00f3n de tu \u00e1nimo. Si hoy viene una bien dormilona, tambi\u00e9n le toca besito."],["Para ti","Me encantar\u00eda que te vieras por un momento desde donde estoy yo cuando te veo hacer algo que te apasiona."],["Para ti","Me emociona la confianza que vas poniendo en m\u00ed cada vez que te animas a contarme una cosa tuya."],["Para ti","Si te pudiera dar algo ahora mismo, ser\u00eda la certeza de que te tomo en serio cuando me dices que algo te importa."],["Para ti","Hay un gesto de cari\u00f1o que cuesta poquito y para m\u00ed vale much\u00edsimo: que vuelvas a preguntarme por algo que te cont\u00e9."],["Para ti","Me pongo orgulloso cuando te escucho defender algo en lo que crees. Da gusto conocer tu manera de pensar."],["Para ti","Me gustas en ese punto exacto en que ya entraste en confianza y se te van soltando las ocurrencias."],["Para ti","Bonita, si hoy tienes un d\u00eda com\u00fan, d\u00e9jame meterle este detallito: hay alguien bien feliz de haberte conocido."],["Para ti","Que me muestres algo con un \u00abmira\u00bb chiquitito ya es suficiente invitaci\u00f3n para que yo quiera acercarme."],["Para ti","Si t\u00fa supieras qu\u00e9 feliz me hace poder estar para ti en una cosa concreta, capaz me pedir\u00edas ayuda un poquito m\u00e1s seguido."],["Para ti","A veces extra\u00f1o hasta escucharte acomodar la historia antes de empezar a contarla. Quiero introducci\u00f3n, contexto y todo, por favor."],["Para ti","Me encanta poder celebrar lo nuestro tambi\u00e9n cuando no hay fecha especial en el calendario."],["Para ti","Si hoy me preguntaras qu\u00e9 hice por amor, te ense\u00f1ar\u00eda estas l\u00edneas. Las escrib\u00ed pensando en c\u00f3mo te gusta que te hable."],["Para ti","Me gustas de una forma bien tranquila y bien intensa a la vez. Te veo, se me alegra todo y al mismo tiempo me siento en paz."],["Para ti","Ojal\u00e1 haya muchas ocasiones en las que puedas decir \u00abme anim\u00e9\u00bb y encontrarme a tu lado celebr\u00e1ndolo."],["Para ti","Conocer tus gustos es una cosa. Saber por qu\u00e9 le tienes cari\u00f1o a un gusto tuyo me parece todav\u00eda m\u00e1s bonito."],["Para ti","Te quisiera dar un beso de esos que uno da porque s\u00ed y despu\u00e9s sigue hablando como si le hubiera parecido lo m\u00e1s natural del mundo."],["Para ti","A m\u00ed me quedan ganas de seguir siendo atento contigo incluso cuando ya sabes perfectamente que te quiero."],["Para ti","Lo bueno de que seas t\u00fa quien lea este papel es que entiendes hasta cu\u00e1ndo me da roche lo rom\u00e1ntico que me puse."],["Para ti","Me gusta cuando nuestras ideas van por caminos distintos y terminamos entendiendo un poquito mejor de d\u00f3nde viene el otro."],["Para ti","Cuando te nazca contarme algo sin que yo te pregunte, hazlo. Se siente bonito que me elijas de p\u00fablico para tus ocurrencias."],["Para ti","Hay veces en que lo \u00fanico que quiero decirte es \u00abme import\u00f3 eso que dijiste\u00bb. Este papelito es para que lo sepas."],["Para ti","No s\u00e9 qu\u00e9 tendr\u00e1s planeado para despu\u00e9s de leer esto. Ojal\u00e1 te lleves aunque sea una sonrisita al resto de tu d\u00eda."],["Para ti","He pensado que la confianza contigo se parece a poder llegar tal como estoy y aun as\u00ed tener ganas de acercarme."],["Para ti","Tu sentido del humor tiene algo bien tuyo. Si me mandaras tres chistes de otra gente y uno tuyo, yo me animar\u00eda a buscar cu\u00e1l es."],["Para ti","Para m\u00ed es un privilegio que conf\u00edes en m\u00ed cuando algo te pone nerviosa. Quiero cuidar mucho esa confianza."],["Para ti","Me dan ganas de acompa\u00f1arte hasta en cosas ajenas a mis gustos. Seguro termino pregunt\u00e1ndote m\u00e1s que nadie."],["Para ti","Si una tarde te provoca hacer nada, me parece un excelente asunto para hacer juntos."],["Para ti","Te celebro hasta cuando lo \u00fanico que lograste fue animarte a empezar. Ya s\u00e9 todo lo que a veces cuesta ese primer paso."],["Para ti","Me gusta ese cari\u00f1o tuyo que aparece en los detalles y se siente sin que tengas que explicarlo."],["Para ti","Hace falta conocer a alguien para saber qu\u00e9 cosas le importan aunque parezcan peque\u00f1itas. Yo quiero ser cada vez mejor en eso contigo."],["Para ti","Para todos eres Mishell. Yo escucho ese nombre y pienso en una persona con quien puedo estar horas siendo yo."],["Para ti","Mi coraz\u00f3n se ha puesto bien poco discreto desde que sabe a qui\u00e9n quiere."],["Para ti","Agradezco que seas t\u00fa misma conmigo, incluso cuando opinas distinto. Me interesa conocerte como eres de verdad."],["Para ti","Me hace sentir afortunado que a veces una cosa bonita te pase a ti y te den ganas de incluirme en la noticia."],["Para ti","Cuando algo te gusta mucho, no te midas al cont\u00e1rmelo. Yo tambi\u00e9n soy de entusiasmarme largo, sobre todo contigo."],["Para ti","Bizcochito, admito que este papelito existe porque me dio la gana de decirte un apodo bonito a mitad de tu d\u00eda."],["Para ti","Si el cari\u00f1o se notara por la cantidad de veces que pienso \u00abesto le gustar\u00eda\u00bb, ya sabr\u00edas cu\u00e1nto te quiero."],["Para ti","Lo mejor de acercarme a ti es ir descubriendo qu\u00e9 te hace sentir c\u00f3moda y saber que puedo darte m\u00e1s de eso."],["Para ti","Si est\u00e1s leyendo esto acostadita, considera que te acabo de dar un beso en la frente. Si est\u00e1s parada, igual llego."],["Para ti","Lo m\u00e1s f\u00e1cil que puedo decirte hoy es que te elegir\u00eda para acompa\u00f1arme hasta en la tarea m\u00e1s aburrida."],["Para ti","Hay una dulzura bien tuya que a veces aparece justo cuando est\u00e1s tratando de hacerte la seria."],["Para ti","Me hace bien que tengamos confianza para hablar de cosas que a veces cuesta decir. Te agradezco cada conversaci\u00f3n as\u00ed."],["Para ti","Se me hace muy bonito que el cari\u00f1o pueda crecer tambi\u00e9n en una tarde tranquila en la que aparentemente no pas\u00f3 nada."],["Para ti","Si te pudiera mandar mi expresi\u00f3n exacta cuando pienso en ti, este papelito vendr\u00eda con tremenda sonrisa."],["Para ti","Me gusta acompa\u00f1arte cuando tienes un plan claro y cuando reci\u00e9n est\u00e1s tanteando qu\u00e9 camino te provoca m\u00e1s."],["Para ti","Gracias por cada detalle que pones de tu parte para que nos entendamos. S\u00e9 que quererse tambi\u00e9n lleva atenci\u00f3n."],["Para ti","A veces ando cansado para casi todo, pero me preguntas si quiero un abrazo tuyo y recobro facultades de inmediato."],["Para ti","Cuando me das tu tiempo, te prometo prestarte atenci\u00f3n de verdad. S\u00e9 que entre tus cosas tambi\u00e9n me est\u00e1s haciendo un sitio."],["Para ti","Quererte me tiene con unas ganas tremendas de llegar a conocerte en d\u00edas y lugares que a\u00fan no hemos vivido."],["Para ti","Me gusta que me d\u00e9 ternura hasta tu nombre guardado entre las cosas m\u00e1s cotidianas de mi d\u00eda."],["Para ti","Si te quedaste pensando en algo bonito que te dijeron, bien merecido. Y si quieres otro cumplido, me fascina c\u00f3mo eres conmigo."],["Para ti","Te admiro cuando sabes qu\u00e9 quieres y tambi\u00e9n cuando te atreves a admitir que sigues averigu\u00e1ndolo."],["Para ti","Qu\u00e9 lindo tener por qui\u00e9n emocionarse cuando a otra persona le sale algo bien. T\u00fa me regalas esa alegr\u00eda a cada rato."],["Para ti","Hay un tipo de felicidad que me llega despu\u00e9s de despedirnos, al pensar \u00abqu\u00e9 bien la paso con ella\u00bb."],["Para ti","La idea de que leas un papelito sin saber qu\u00e9 te voy a decir me parece tierna. Yo tambi\u00e9n me puse nervioso pensando qu\u00e9 dejarte escrito."],["Para ti","Si en alg\u00fan momento dudas de si contarme lo que te ilusiona, te adelanto la respuesta: claro que quiero escucharlo."],["Para ti","Mishell, para tu enamorado sigue siendo un acontecimiento importante cada vez que te ve feliz."],["Para ti","Tienes una manera de ganarte mi cari\u00f1o que pasa incluso cuando t\u00fa est\u00e1s en lo tuyo y ni te enteras."],["Para ti","A veces lo m\u00e1s bueno del d\u00eda llega con dos palabras tuyas y me encuentra justo cuando me hac\u00edan falta."],["Para ti","Me parece bonito poder usar la palabra \u00abnosotros\u00bb y que detr\u00e1s de ella sigamos estando t\u00fa, con tus cosas, y yo, con las m\u00edas."],["Para ti","Cuando se te ocurra que algo \u00abno es para tanto\u00bb, acu\u00e9rdate de que igual puede ser un mont\u00f3n para quien te quiere ver feliz."],["Para ti","Tu nombre me queda bonito hasta escrito con mala letra. Lo que trato de decirte tambi\u00e9n, espero, jaja."],["Para ti","Pienso en lo mucho que has aprendido de m\u00ed y me entran m\u00e1s ganas de aprender c\u00f3mo acompa\u00f1arte cuando t\u00fa lo necesites."],["Para ti","Si pudieras elegir una sensaci\u00f3n para llevarte de este mensaje, quisiera que fuera esta: sentirte querida tal como est\u00e1s hoy."],["Para ti","Me alegra que tengas ratos de calma que sean tuyos. Y me alegra el doble cuando en uno de esos ratos te acuerdas de m\u00ed."],["Para ti","Querer saber c\u00f3mo te fue es mi forma m\u00e1s frecuente de decirte \u00abhe estado pensando en ti\u00bb."],["Para ti","Ojal\u00e1 cada vez que te mires con orgullo te acuerdes de que por aqu\u00ed hay alguien asintiendo con todas sus fuerzas."],["Para ti","T\u00fa me haces una pregunta sencilla y a veces te termino contando media vida. Ser\u00e1 porque me encanta c\u00f3mo prestas atenci\u00f3n."],["Para ti","Me parece preciosa la confianza con la que puedes decirme qu\u00e9 cosas te dan verg\u00fcenza. A m\u00ed tambi\u00e9n me da menos roche cuando estoy contigo."],["Para ti","Hay ratos en que te miro y me da ternura todo junto. T\u00fa, yo poni\u00e9ndome nervioso y la suerte de que podamos estar ah\u00ed."],["Para ti","Si te cruzas con algo interesante y piensas que solo te interesar\u00eda a ti, cu\u00e9ntamelo igual. T\u00fa ya eres raz\u00f3n suficiente para que me d\u00e9 curiosidad."],["Para ti","Hoy tambi\u00e9n te mandar\u00eda un abrazo sin necesidad de que te haya pasado nada. Para quererte no estoy esperando ocasi\u00f3n."],["Para ti","Me gusta que haya cosas tuyas que todav\u00eda me sorprenden. La familiaridad contigo tambi\u00e9n trae sus peque\u00f1os descubrimientos."],["Para ti","Cuando te digo \u00abqu\u00e9 bueno, amor\u00bb, a veces quisiera que vieras lo mucho que de verdad me alegr\u00e9 por ti."],["Para ti","Se siente bien poder decirte que te extra\u00f1o con la tranquilidad de saber que entiendes el cari\u00f1o que hay detr\u00e1s."],["Para ti","Si me quedo pensando despu\u00e9s de que me cuentas algo, muchas veces es porque me interesa de verdad lo que dijiste."],["Para ti","Amor, qu\u00e9 gusto que conmigo tengas una persona a la que puedes mostrarle tus lados m\u00e1s dulces y tus ocurrencias m\u00e1s raras."],["Para ti","Ojal\u00e1 pueda seguir haci\u00e9ndote sentir lo que yo siento cuando t\u00fa te acuerdas de un detalle que para m\u00ed era importante."],["Para ti","Cuando me haces parte de un logro tuyo me dan unas ganas tremendas de llevar pancarta. Te ahorro el roche, pero ganas s\u00ed tengo."],["Para ti","A veces estoy eligiendo entre decirte \u00abbonita\u00bb y darte un beso. No veo por qu\u00e9 tendr\u00eda que escoger."],["Para ti","Me gusta tu manera de acompa\u00f1arme sin querer decidir por m\u00ed. Se siente muy bonito que conf\u00edes en lo que puedo hacer."],["Para ti","Que t\u00fa sepas querer de esa manera tan tuya me alegra la vida m\u00e1s de lo que logro decirte en un mensaje."],["Para ti","Me quedo bien contento cuando encuentro una forma peque\u00f1ita de facilitarte el d\u00eda. Con que descanses cinco minutos m\u00e1s, ya vali\u00f3."],["Para ti","Si hay una parte de ti que todav\u00eda est\u00e1s conociendo, qu\u00e9 bonito poder ir descubri\u00e9ndola contigo."],["Para ti","Hoy te dejo un \u00abte adoro\u00bb muy m\u00edo, de esos que en persona me salen mientras trato de mirarte y me da risa lo enamorado que estoy."],["Para ti","Hay algo que me gusta de tus silencios: s\u00e9 que puedo quedarme cerca sin estar buscando con qu\u00e9 llenarlos."],["Para ti","Te mereces a alguien que te anime a probar, que se emocione contigo y que se alegre de que lo intentaste. Yo quiero estar a la altura."],["Para ti","Si t\u00fa te emocionas con algo, yo me emociono un poquito por eso y un mont\u00f3n por ti."],["Para ti","Cada uno tiene una forma de sentirse en confianza. La m\u00eda es estar contigo y darme cuenta de que no ando ensayando qu\u00e9 decir."],["Para ti","Cuando te r\u00edas hoy, ojal\u00e1 sea de esas risas que te hacen olvidar un ratito qu\u00e9 estabas haciendo. Son mis favoritas."],["Para ti","Te quiero con la misma naturalidad con la que estiro la mano si te siento cerquita."],["Para ti","Si me ves entusiasmado planeando c\u00f3mo sorprenderte, d\u00e9jame creer que todav\u00eda tengo cara de guardar secretos."],["Para ti","Me hace ilusi\u00f3n acompa\u00f1arte en lo que esperas, aunque por ahora solo sea saber en qu\u00e9 fecha vas a tener noticias."],["Para ti","A ti te confiar\u00eda tanto una decisi\u00f3n que me cuesta como la tonter\u00eda que se me ocurri\u00f3 hace diez segundos. Las dos dicen mucho de la confianza que te tengo."],["Para ti","Cuando te digo que me importas, tambi\u00e9n me refiero a lo que te preocupa y a esas cosas que te gustar\u00eda mejorar."],["Para ti","Me gustar\u00eda que pudieras guardar la voz con la que te dir\u00eda esto ahora mismo: qu\u00e9 lindo es tenerte en mi vida."],["Para ti","Si por ah\u00ed hoy andas con poquito \u00e1nimo, te mando compa\u00f1\u00eda sin preguntas. Y si te provoca hablar, te escucho."],["Para ti","Alguien deber\u00eda inventar una forma de enviarte el calorcito exacto de mi mano. Mientras tanto, te mando esta notita."],["Para ti","Mishell, me da mucha ilusi\u00f3n que nos sigamos eligiendo tambi\u00e9n en los d\u00edas en que hay que poner paciencia de los dos lados."],["Para ti","Me encanta que al final de una conversaci\u00f3n contigo casi siempre termine sabiendo algo que no sab\u00eda. A veces de ti, a veces de m\u00ed."],["Para ti","Que me tengas cari\u00f1o ya me parece bonito. La manera tan tuya de demostrarlo es lo que me hace sentir especialmente afortunado."],["Para ti","Si hoy te sorprendiste haciendo algo mejor que antes, me encantar\u00eda saber qu\u00e9 fue. Esas peque\u00f1as victorias tambi\u00e9n cuentan."],["Para ti","Creo que jam\u00e1s me va a dejar de gustar ese segundo en que me doy cuenta de que te est\u00e1s acercando."],["Para ti","Me siento bien contigo hasta cuando tengo que admitir que no sab\u00eda algo. Es rico tener esa confianza para preguntar."],["Para ti","Me gusta que te r\u00edas con todo el cuerpo cuando algo te causa mucha gracia. Hasta de imaginarlo se me contagia."],["Para ti","D\u00e9jame aprovechar que est\u00e1s aqu\u00ed un segundo para decirte que esas ganas tuyas de salir adelante me parecen preciosas."],["Para ti","A m\u00ed me importa lo que pienses aunque reci\u00e9n est\u00e9s formando una opini\u00f3n. Ac\u00e1 puedes pensar en voz alta."],["Para ti","Si hoy no encuentro c\u00f3mo decirte todo lo que siento, puedo empezar por una cosa concreta: gracias por elegirme para compartir tu tiempo."],["Para ti","No todos los d\u00edas salen como uno quisiera. En cualquiera de ellos, amor, me sigue alegrando saber que puedo mandarte un beso."],["Para ti","Me gusta que puedas hacer algo solo porque te alegra, aunque a nadie m\u00e1s le parezca gran cosa. Yo hasta te har\u00eda barra."],["Para ti","Qu\u00e9 emoci\u00f3n pensar que a veces una frase m\u00eda te puede acompa\u00f1ar un ratito despu\u00e9s de leerla."],["Para ti","Si tuviera que dibujar c\u00f3mo me siento cuando estoy contigo, seguro me quedar\u00eda chueco. Pero se distinguir\u00eda la sonrisa desde lejos."],["Para ti","Gracias por dejarme descubrirte sin apuro. Yo sigo disfrutando tanto de lo que ya conozco como de lo que me sorprende."],["Para ti","Hoy no traje gran discurso, coraz\u00f3n. Solo vine a dejarte un besito porque me acord\u00e9 de ti."],["Para ti","Me importa que est\u00e9s tranquila para contarme tambi\u00e9n lo que todav\u00eda no tienes resuelto. No tienes que traer la soluci\u00f3n a la conversaci\u00f3n."],["Para ti","Si est\u00e1s leyendo esto con el d\u00eda reci\u00e9n empezado, ojal\u00e1 te arranque una sonrisa. Si el d\u00eda ya se acab\u00f3, ojal\u00e1 te la lleves a dormir."],["Para ti","Hay veces en que te pienso con poquitas palabras. Hoy son estas: me hace feliz ser tuyo."],["Para ti","Gracias por cada vez que eliges decirme algo con cari\u00f1o aun cuando lo que tienes que explicar no es f\u00e1cil."],["Para ti","Me enamora que seas una persona a la que todav\u00eda le pueden dar ilusi\u00f3n cosas nuevas. Me encanta saber cu\u00e1l ser\u00e1 la siguiente."],["Para ti","Si todo el mundo hablara a la vez y t\u00fa quisieras contarme algo bajito, yo me acercar\u00eda a ti."],["Para ti","Quisiera guardar tu entusiasmo en una foto para que en un d\u00eda pesado puedas acordarte de todo lo que te hace brillar."],["Para ti","Me gusta tener motivos para darte las gracias y, sobre todo, tenerte a ti para poder dec\u00edrtelas."],["De m\u00ed para ti","Cada vez que nos vemos nos abrazamos s\u00ed o s\u00ed."],["Con una sonrisa","Te iba a mandar un beso discreto, pero me acord\u00e9 de qui\u00e9n lo recibe. Muaaaaa."],["Con una sonrisa","Si me ves muy concentrado mir\u00e1ndote, tranquila. Estaba intentando acordarme de qu\u00e9 iba a decir."],["Con una sonrisa","Qu\u00e9 injusto que t\u00fa puedas ponerte as\u00ed de bonita y yo tenga que seguir hablando con normalidad."],["Con una sonrisa","Quisiera ser un poquito m\u00e1s misterioso. El problema es que me preguntas si te extra\u00f1\u00e9 y ya estoy abriendo los brazos."],["Con una sonrisa","De todas las decisiones dif\u00edciles de la vida, sentarme a tu costado es bastante facilita."],["Con una sonrisa","Hoy amanec\u00ed con ganas de verte. La sorpresa hubiera sido lo contrario, la verdad."],["Con una sonrisa","Mishell, ten\u00edas raz\u00f3n. Guarda este papelito, que todav\u00eda no hemos discutido de qu\u00e9."],["Con una sonrisa","Si el cari\u00f1o se pudiera mandar por delivery, el repartidor necesitar\u00eda ayuda para subir el m\u00edo."],["Con una sonrisa","Podr\u00eda pasar por tu lado haci\u00e9ndome el guapo. Conoci\u00e9ndome, termino salud\u00e1ndote con las dos manos."],["Con una sonrisa","Qu\u00e9 peligro invitarte a caminar. Yo digo que es por el ejercicio y despu\u00e9s quiero sentarme contigo a conversar."],["Con una sonrisa","Un besito en la frente me parece un excelente uso de mi tiempo. Tengo la tarde para justificarlo."],["Con una sonrisa","Extra\u00f1arte un poquito ser\u00eda m\u00e1s pr\u00e1ctico. Av\u00edsame si descubres c\u00f3mo se hace."],["Con una sonrisa","Te quiero incluso antes de que me d\u00e9 tiempo de peinarme. Ese s\u00ed es amor madrugador."],["Con una sonrisa","Me pides que sea breve y yo obedezco. Ven."],["Con una sonrisa","Si alguna vez te escribo \u00abjajaja\u00bb por educaci\u00f3n, vas a tener que dudar de mi identidad. Contigo siempre se me escapa uno de verdad."],["Con una sonrisa","Quise redactarte una declaraci\u00f3n seria. Me sali\u00f3 \u00abay, mi bonita\u00bb. Creo que se entendi\u00f3."],["Con una sonrisa","Tenemos que hablar de ese asunto pendiente: c\u00f3mo haces para gustarme vestida de absolutamente cualquier color."],["Con una sonrisa","T\u00fa dime que hay sitio a tu costado. Yo de acomodarme s\u00e9, hasta de ladito entro."],["Con una sonrisa","Qu\u00e9 divertido ser\u00eda intercambiar caras un segundo para que veas la m\u00eda cuando te acercas."],["Con una sonrisa","Tengo una teor\u00eda. Si camino lento cuando te acompa\u00f1o, t\u00e9cnicamente el paseo dura m\u00e1s."],["Con una sonrisa","Me gusta la gente que sabe escuchar. Especialmente si eres t\u00fa y lo que estoy diciendo es que me encantas."],["Con una sonrisa","Vengo a dejarte un cari\u00f1o y a retirarme con dignidad. Bueno, primero otro cari\u00f1o."],["Con una sonrisa","Si apareciera un bot\u00f3n para verte ahora mismo, ya estar\u00eda pidiendo otro porque gast\u00e9 el primero."],["Con una sonrisa","El plan cabe en dos palabras: ven, pues."],["Con una sonrisa","Hay dos versiones de m\u00ed. El que ensaya un saludo bonito y el que te ve y dice \u00abholaaa\u00bb todo sonso."],["Con una sonrisa","Un se\u00f1or muy enamorado dej\u00f3 esto para ti. Soy yo, reci\u00e9n ascendido a se\u00f1or."],["Con una sonrisa","\u00bfY si hoy nos ahorramos la parte en que disimulo que quiero un abrazo?"],["Con una sonrisa","Hasta cuando intento redactar algo elegante termino dici\u00e9ndote chiki. Me sale del alma el diminutivo."],["Con una sonrisa","Qu\u00e9 paciencia la de mis bolsillos, guardando mis manos cuando lo que quieren es agarrar las tuyas."],["Con una sonrisa","A veces quisiera saber coquetear con sutileza. Se  es invitarte algo para disimular."],["Con una sonrisa","Si el amor diera puntos por esfuerzo, yo pedir\u00eda canjearlos por una tarde en la misma banca."],["Con una sonrisa","Mis mejores planes empiezan con \u00abcontigo\u00bb. Lo de la hora y el lugar todav\u00eda lo estoy improvisando."],["Con una sonrisa","Me vas a tener que perdonar el atrevimiento de seguir queri\u00e9ndote as\u00ed de contento."],["Con una sonrisa","A ver si organizamos una reuni\u00f3n de gente que se gusta. Hice la lista y solo faltas t\u00fa para que estemos completos."],["Con una sonrisa","No s\u00e9 si me veo rom\u00e1ntico envi\u00e1ndote besitos escritos. La ventaja es que puedo ponerles sonido: muac."],["Con una sonrisa","Me conformar\u00eda con verte cinco minutos. Eso dir\u00e9 hasta el minuto cuatro."],["Con una sonrisa","Dicen que el tiempo vuela. Si sabe volar, bien podr\u00eda recogerme y dejarme donde est\u00e1s t\u00fa."],["Con una sonrisa","Si te toca elegir entre postre y besito, me parece una injusticia obligarte a escoger."],["Con una sonrisa","A m\u00ed me ense\u00f1aron a saludar con educaci\u00f3n. Para ti tengo un \u00abbuenos d\u00edas\u00bb con abrazo incorporado."],["Con una sonrisa","M\u00edrame haci\u00e9ndome el distra\u00eddo como si no hubiera elegido justo el sitio desde el que puedo verte."],["Con una sonrisa","Tengo un consejo mal\u00edsimo para ahorrar tiempo: cu\u00e9ntame rapidito c\u00f3mo estuvo tu d\u00eda. Ya sabemos que voy a pedir detalles."],["Con una sonrisa","Con ese encanto tuyo deber\u00edan incluir instrucciones para volver a concentrarse despu\u00e9s de verte."],["Con una sonrisa","Me gustar\u00eda darte una serenata. Por consideraci\u00f3n a tus o\u00eddos, podr\u00edamos empezar con pantomima."],["Con una sonrisa","Mi bonita, te dir\u00eda que cierres los ojos para darte una sorpresa, pero a ver c\u00f3mo sigues leyendo jaja. Era un besito."],["Con una sonrisa","Mis ganas de verte tienen horario propio. Justo da la casualidad de que est\u00e1n abiertas todo el d\u00eda."],["Con una sonrisa","Si me quedo mirando tu boca mientras hablas, s\u00ed estaba escuchando. Solo tengo dos actividades favoritas ocurriendo al mismo tiempo."],["Con una sonrisa","Trat\u00e9 de escribir tu nombre con los ojos cerrados. Sali\u00f3 feo, pero bien enamorado."],["Con una sonrisa","Un besito tuyo me parece un buen argumento. Todav\u00eda no s\u00e9 a favor de qu\u00e9, pero te escucho."],["Con una sonrisa","Que conste que vine con intenciones muy respetables. Despu\u00e9s me sonre\u00edste y ahora quiero pellizcarte los cachetes con permiso."],["Con una sonrisa","Te juro que a veces s\u00ed tengo temas de conversaci\u00f3n. Justo te acercas y todos salen al recreo."],["Con una sonrisa","Acepto recomendaciones para dejar de extra\u00f1arte. Las que incluyan verte llevan ventaja."],["Con una sonrisa","\u00bfMe guardas un lugarcito? Con uno de mi tama\u00f1o basta, pero pegado al tuyo por favor."],["Con una sonrisa","Si hoy se te antoja un cumplido reci\u00e9n hecho, aqu\u00ed tienes: qu\u00e9 bonita eres, caray."],["Con una sonrisa","Con tanto cari\u00f1o acumulado voy a tener que entreg\u00e1rtelo en varias visitas. Qu\u00e9 contratiempo tan lindo."],["Con una sonrisa","Buen d\u00eda a la chica que me distrae sin siquiera estar en el mismo cuarto. Talento puro."],["Con una sonrisa","Podr\u00eda escribir \u00abte amo\u00bb en may\u00fasculas, pero prefiero dec\u00edrtelo al o\u00eddo y ahorrarnos el esc\u00e1ndalo."],["Con una sonrisa","Te dar\u00eda la \u00faltima papita. La mirar\u00eda irse con nostalgia, pero te la dar\u00eda."],["Con una sonrisa","Para conquistarte otra vez tendr\u00eda que invitarte a salir otra vez. Qu\u00e9 pena, toca."],["Con una sonrisa","El amor es generoso. Yo, por ejemplo, te cedo el gusto de elegir en qu\u00e9 mejilla me das un beso."],["Con una sonrisa","Pregunta seria, Mishell. \u00bfA ti tambi\u00e9n te parece poco un abrazo de la duraci\u00f3n normal de un abrazo?"],["Con una sonrisa","Si
