const notes=JSON.parse(document.getElementById('collection').textContent);
const key='papelitos-chiki-v1';
function mix(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
const previousSize = 1000;
const extra = JSON.parse(document.getElementById('extra').textContent);
notes.push(...extra);
function deck(seen = []) {
  const used = new Set(seen);
  const remaining = notes.map((_, i) => i).filter(i => !used.has(i));
  return {order: seen.concat(mix(remaining)), read: seen.length};
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(key));
    const size = s?.order?.length;
    if ([previousSize, notes.length].includes(size) && Array.isArray(s.order) &&
        Number.isInteger(s.read) && s.read >= 0 && s.read <= size &&
        new Set(s.order).size === size && s.order.every(i => Number.isInteger(i) && i >= 0 && i < size)) {
      return size === notes.length ? s : deck(s.order.slice(0,s.read));
    }
  } catch {}
}
let state = restore() || deck();
const el = id => document.getElementById(id);
function draw() {
  if (state.read === notes.length) {
    const last = state.order.at(-1);
    state = deck();
    if (state.order[0] === last) [state.order[0], state.order[1]] = [state.order[1], state.order[0]];
  }
  const [kind,text] = notes[state.order[state.read++]];
  el('kind').textContent = kind;
  el('note').textContent = text;
  try {localStorage.setItem(key,JSON.stringify(state))}
  catch {el('notice').hidden = false}
  el('card').classList.remove('enter');
  void el('card').offsetWidth;
  el('card').classList.add('enter');
}
el('next').onclick = draw;
draw();
</script></html>
