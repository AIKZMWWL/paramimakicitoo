ber en qu\u00e9 pienso y justo est\u00e9 pensando en c\u00f3mo decirte que estaba pensando en ti."],["Con una sonrisa","Me encanta ese momento imaginario en que te invito a bailar y ambos aceptamos que mis pies har\u00e1n lo que puedan."],["Con una sonrisa","Yo te regalar\u00eda flores con instrucciones innecesarias. \u00abMirarlas, olerlas y acordarte del sonso que eligi\u00f3 cada una\u00bb."],["Con una sonrisa","No me pidas que califique tu sonrisa del uno al diez. Voy a discutir con la escala y perdemos toda la tarde."],["Con una sonrisa","He considerado ponerle nombre a ese nerviosito que me da verte. Creo que tambi\u00e9n se llama Mishell."],["Con una sonrisa","Cuando tengas ganas de un abrazo largo, b\u00fascame. No tengo reloj para ese tipo de encargos."],["Con una sonrisa","Te mandar\u00eda mi coraz\u00f3n, pero despu\u00e9s qui\u00e9n me late tan fuerte cuando llegas."],["Con una sonrisa","Si me dieran una moneda por cada cosa que me gusta de ti, por fin podr\u00eda invitarte algo sin mirar los precios dos veces."],["Con una sonrisa","Me da risa pensar que en alg\u00fan momento me pareci\u00f3 razonable intentar que no se notara lo mucho que me gustas."],["Con una sonrisa","Qu\u00e9 ganas de estar a un \u00abp\u00e1same una cucharita\u00bb de distancia."],["Con una sonrisa","A las pel\u00edculas de amor les faltan escenas importantes. Por ejemplo, dos enamorados intentando sacarse una foto sin cortar media cabeza."],["Con una sonrisa","T\u00fa avisa si hoy toca ponernos melosos. Yo igual vine preparado."],["Con una sonrisa","El d\u00eda que salgamos a mirar estrellas, recu\u00e9rdame mirar arriba. Con una bonita al lado se me puede pasar."],["Con una sonrisa","Si yo fuera poeta profesional, me pagar\u00edan por hacer lo que ya hago gratis: buscar otra forma de llamarte preciosa."],["Con una sonrisa","Tenemos que ver una comedia juntos un d\u00eda. As\u00ed descubro si me hace m\u00e1s gracia el chiste o escucharte re\u00edrte del chiste."],["Con una sonrisa","Si te tuviera enfrente ahora mismo, esta frase ser\u00eda considerablemente m\u00e1s corta y tendr\u00eda un abrazo al final."],["Con una sonrisa","Mi nueva meta es ser un hombre de pocas palabras. Empiezo ma\u00f1ana, que hoy te quiero contar por qu\u00e9 me encantas."],["Con una sonrisa","Me gustas de cerca y de lejos, pero para futuras pruebas prefiero la primera opci\u00f3n."],["Con una sonrisa","Te escribo con excelente letra. Las ventajas de no exponerte todav\u00eda a mi caligraf\u00eda."],["Con una sonrisa","Espero que mi yo del futuro recuerde agradecerle a mi yo de hoy por seguir intentando sacarte sonrisas."],["Con una sonrisa","Necesito una excusa para verte. Hasta ahora el mejor borrador dice \u00abporque s\u00ed, pues\u00bb."],["Con una sonrisa","Cuando imagines a tu pr\u00edncipe azul, \u00bfpuedes imaginarlo con zapatillas c\u00f3modas? Es que quisiera poder alcanzarte."],["Con una sonrisa","Ya encontr\u00e9 qu\u00e9 ponerme para gustarte. Atenci\u00f3n a lo que me cuentas. El polo lo decido luego."],["Con una sonrisa","Qu\u00e9 extra\u00f1o lo de enamorarse. Uno est\u00e1 tratando de verse guapo y acaba content\u00edsimo de hacer el rid\u00edculo si la otra persona se r\u00ede."],["Con una sonrisa","Para las tardes fr\u00edas se recomienda abrigarse por capas. Mi favorita ser\u00eda una capa de tus brazos encima de los m\u00edos."],["Con una sonrisa","Espero que este mensaje te pille sentada. La noticia es fuert\u00edsima: todav\u00eda me gustas."],["Con una sonrisa","Si te llevas mi polera en mi imaginaci\u00f3n, por lo menos d\u00e9jame pensar que te queda bonita. Ya, s\u00ed te la puedes quedar."],["Con una sonrisa","Tengo ganas de darte flores de un color que combine contigo. Dif\u00edcil misi\u00f3n, te quedan bien todos."],["Con una sonrisa","Qu\u00e9 af\u00e1n el m\u00edo de querer quitarte un minuto solo para decirte que me alegraste los otros cincuenta y nueve."],["Con una sonrisa","No s\u00e9 c\u00f3mo se saluda a alguien que te gusta mucho. Ya pas\u00e9 del hola y todav\u00eda sigo sonriendo."],["Con una sonrisa","Si tuviera que elegir una mesa para un restaurante lleno, escoger\u00eda la tuya incluso si queda al lado de la puerta que chilla."],["Con una sonrisa","Puedo ser una persona muy razonable hasta que me dices \u00abcinco minutos m\u00e1s\u00bb. Ah\u00ed decido que el reloj es una sugerencia."],["Con una sonrisa","Soy partidario de las conversaciones profundas. Por ejemplo, \u00bfte acomodas mejor en este hombro o en el otro?"],["Con una sonrisa","Me gustas incluso escrita con pura letra de tr\u00e1mite: \u00abSe comunica que la se\u00f1orita Mishell me encanta\u00bb."],["Con una sonrisa","Yo te llevar\u00eda a ver el atardecer y despu\u00e9s tendr\u00eda que preguntar de qu\u00e9 color estuvo el cielo."],["Con una sonrisa","Ven con sue\u00f1o, con hambre o con ganas de hablar hasta por los codos. Yo veo c\u00f3mo acomodo las tres cosas."],["Con una sonrisa","Necesito reunirme urgentemente con la due\u00f1a de esa sonrisa. Cualquier banquita sirve de oficina."],["Con una sonrisa","Me comprometo a respetar tu espacio. Sobre todo ese espacio chiquito que a veces me haces a tu lado."],["Con una sonrisa","Qu\u00e9 dif\u00edcil es hacerme el fresco si apenas leo \u00abmi amor\u00bb ya ando derriti\u00e9ndome."],["Con una sonrisa","Yo intentando conservar la compostura ante ti parezco alguien sosteniendo una gelatina en un carro que frena."],["Con una sonrisa","Cuando digo que ya me voy a dormir, mis ganas de conversarte siempre levantan la mano para apelar."],["Con una sonrisa","Un d\u00eda voy a invitarte a una cita secreta. Tan secreta que primero tendr\u00e9 que averiguar a d\u00f3nde vamos."],["Con una sonrisa","Si te dijera cada vez que quiero besarte, ibas a pensar que estoy repitiendo mensajes por error."],["Con una sonrisa","Hola, vengo del futuro de este papelito. En cuanto termines de leerlo, te voy a seguir queriendo."],["Con una sonrisa","Me pondr\u00eda a dieta de decirte cosas cursis, pero estas de aqu\u00ed son de la casa y siempre repito."],["Con una sonrisa","Quiero tomarme una foto contigo que salga espont\u00e1nea. Mi plan de ensayar la espontaneidad ya empez\u00f3 mal."],["Con una sonrisa","El coraz\u00f3n es un \u00f3rgano muy sofisticado y el m\u00edo igual se acelera por algo tan sencillito como que te acerques."],["Con una sonrisa","Soy un rom\u00e1ntico pr\u00e1ctico. Si te traje una flor y te faltan manos, la cargo yo con tal de agarrar la que tienes libre."],["Con una sonrisa","Hasta el autocorrector debe de preguntarse si mi vocabulario incluye otras palabras adem\u00e1s de \u00abamor\u00bb. S\u00ed, tambi\u00e9n \u00abamorcito\u00bb."],["Con una sonrisa","Morenita, hoy pens\u00e9 en mandarte una se\u00f1al de humo. Me pareci\u00f3 m\u00e1s seguro abrir este papelito."],["Con una sonrisa","Me gustar\u00eda invitarte un helado y verificar cient\u00edficamente si todos los sabores me parecen m\u00e1s ricos cuando me das a probar el tuyo."],["Con una sonrisa","Si\u00e9ntate donde quieras. Yo ya eleg\u00ed mi sitio por proximidad."],["Con una sonrisa","Hay una raz\u00f3n perfectamente madura para querer pasar una tarde contigo. Y otra raz\u00f3n es que quiero molestarte con cari\u00f1o hasta que te r\u00edas."],["Con una sonrisa","Nunca subestimes el poder de un \u00abte cuento algo\u00bb tuyo para convertir a este distra\u00eddo en p\u00fablico de primera fila."],["Con una sonrisa","Se me ocurre un regalo econ\u00f3mico y bonito: mi mano izquierda. La derecha la necesito para abrirte la puerta."],["Con una sonrisa","He decidido esconder una indirecta en este mensaje. Me encantas, Mishell. Uy, me salt\u00e9 la parte de esconderla."],["Con una sonrisa","Si enamorarte de nuevo implicara hacer fila, llevar\u00eda agua y un banquito. De ah\u00ed no me muevo."],["Con una sonrisa","Tienes cara de merecer un abrazo y yo tengo pinta de voluntario."],["Con una sonrisa","T\u00fa di que quieres salir a tomar aire. Yo entender\u00e9 que el aire incluye agarrarte la mano si te provoca."],["Con una sonrisa","Me parece apropiado declarar patrimonio de nuestra relaci\u00f3n esos chistes mal\u00edsimos que igual merecen un besito por el esfuerzo."],["Con una sonrisa","Cuando te digo preciosa me quedo cortito. Pero si me alargo hasta explicar cada detalle nos da hambre a los dos."],["Con una sonrisa","Tengo una lista bastante exigente de requisitos para mi compa\u00f1\u00eda ideal. Uno, que seas t\u00fa. Ya terminamos."],["Con una sonrisa","Tu nombre es de esas palabras que me ponen buena cara sin tener que pedirle permiso al resto de mi cabeza."],["Con una sonrisa","Quisiera sorprenderte con una declaraci\u00f3n totalmente inesperada. Lo malo es que ya sospechas que te adoro."],["Con una sonrisa","Hay d\u00edas en los que me gustar\u00eda ser un poquito m\u00e1s alto solo para bajarte las cosas de la repisa con elegancia."],["Con una sonrisa","Si te parece que estoy muy meloso hoy, esp\u00e9rate a que se me ocurra la rima con bizcochito."],["Con una sonrisa","Un mandadito para cuando puedas: m\u00edrate al espejo y saluda de mi parte a esa chica linda."],["Con una sonrisa","Te invito a una pel\u00edcula. Si escogemos una rom\u00e1ntica, prometo evitar la tentaci\u00f3n de darte codazos cada vez que me identifique."],["Con una sonrisa","Si existiera una tienda de momentos, entrar\u00eda a preguntar cu\u00e1nto cuesta estirar uno de tus abrazos."],["Con una sonrisa","Imag\u00edname practicando una mirada seductora y terminando con cara de que me dio el sol en el ojo. Mejor te sonr\u00edo normal."],["Con una sonrisa","Qu\u00e9 seria se ve esta letra para alguien que solo quer\u00eda decirte que te llenar\u00eda de besos los cachetes."],["Con una sonrisa","Los poemas suelen hablar del mar. Yo quisiera hablar del tremendo gusto que me da cuando t\u00fa tambi\u00e9n quieres repetir postre."],["Con una sonrisa","Oficialmente tengo asuntos que hacer. Extraoficialmente vine a saludarte porque eres m\u00e1s bonita que todos mis pendientes juntos."],["Con una sonrisa","Me vendr\u00eda bien un mapa de tus antojos. El norte podr\u00eda llamarse \u00abalgo dulce\u00bb y yo te sigo la br\u00fajula."],["Con una sonrisa","Cada vez que pienso que podr\u00eda dejarte una nota chiquita me sale un mont\u00f3n de cari\u00f1o en letra peque\u00f1a."],["Con una sonrisa","\u00bfPuedo invitarte a no hacer planes? Eso s\u00ed, a una hora convenida y en un sitio donde pueda verte."],["Con una sonrisa","Si armamos un equipo para cualquier juego, el nombre ya lo tengo: \u00abyo confiando en ella\u00bb."],["Con una sonrisa","Nunca fui bueno adivinando. Por eso prefiero preguntarte exactamente d\u00f3nde quieres el beso."],["Con una sonrisa","A m\u00ed me parecer\u00eda v\u00e1lido suspender cualquier reuni\u00f3n por causas de fuerza mayor, como que me esperes t\u00fa en la puerta."],["Con una sonrisa","Te escribir\u00eda una canci\u00f3n de amor con un solo problema. En cuanto toque cantarla, nos conviene que entre el coro."],["Con una sonrisa","Te mando un abrazo por escrito. Las instrucciones para canjearlo en persona son bastante intuitivas."],["Con una sonrisa","A veces me hago preguntas importantes. Si te doy un beso en cada cachete, \u00bfya cuenta como comida balanceada para mi coraz\u00f3n?"],["Con una sonrisa","Mishell, hoy puedes presumir que alguien te escribi\u00f3 un piropo sin rimarte con miel. Me cost\u00f3 resistirme."],["Con una sonrisa","Tu sonrisa es mi debilidad. Puse esa respuesta en un formulario imaginario y al fin pude contestar algo sin pensarlo."],["Con una sonrisa","No me falta imaginaci\u00f3n para regalarte un castillo. Lo que me faltar\u00eda es d\u00f3nde enchufar el cargador en semejante edificio."],["Con una sonrisa","Quisiera llevarte a un lugar fino. Tambi\u00e9n acepto un lugar que venda algo rico y nos deje hablar sin gritar."],["Con una sonrisa","Estoy intentando ponerle medida a cu\u00e1nto me gustas. La regla escolar ya qued\u00f3 oficialmente descartada."],["Con una sonrisa","Lo bueno de tenerte cari\u00f1o es que siempre s\u00e9 qu\u00e9 hacer con un minuto libre. Decirte algo bonito toma hasta menos."],["Con una sonrisa","Si puedo escoger mi sonido para una alarma, que sea tu voz. Aunque correr\u00eda el riesgo de quedarme en la cama escuch\u00e1ndola."],["Con una sonrisa","Bodoque. Me gusta que a m\u00ed me suene a piropo lo que a otro le sonar\u00eda a una bola de papel."],["Con una sonrisa","A la hora de verte ensayar\u00eda una entrada espectacular si no fuera porque soy feliz con que me abras y me digas \u00abpasa\u00bb."],["Con una sonrisa","A m\u00ed me prometieron que con pr\u00e1ctica todo ser\u00eda m\u00e1s f\u00e1cil. Llevo queri\u00e9ndote un buen rato y todav\u00eda me pones nervioso."],["Con una sonrisa","Oye, me parece raro que exista un emoji para la berenjena y todav\u00eda ninguno para mi cara exacta cuando me dices algo tierno."],["Con una sonrisa","Te guardar\u00eda un puesto en primera fila para o\u00edr mis mejores chistes. Si son malos te devuelvo la entrada en besos."],["Con una sonrisa","Si quieres saber cu\u00e1nto me acuerdo de ti, preg\u00fantale a cualquier cosa bonita que veo y quiero ense\u00f1arte."],["Con una sonrisa","Podr\u00eda hacerte ojitos desde el otro lado de la mesa. Si parece que me entr\u00f3 polvo, tenme paciencia."],["Con una sonrisa","La vida es corta. Dicho eso, pienso tomarme todo el tiempo del mundo eligiendo el mote m\u00e1s cari\u00f1oso para ti."],["Con una sonrisa","Deber\u00eda existir una funda de celular con un bolsillito para guardar el beso que te debo hasta que te vea."],["Con una sonrisa","Me gustas a prueba de filtros. Incluso uno con bigote espectacular me parecer\u00eda un argumento a tu favor."],["Con una sonrisa","Acabo de descubrir un truco para que este texto suene diez veces m\u00e1s bonito. L\u00e9elo con la voz de alguien que te est\u00e1 sonriendo."],["Con una sonrisa","Mi coraz\u00f3n presume de independiente pero oye tu nombre y voltea primero que yo."],["Con una sonrisa","Si alguien propone cambiar tus besos por oro, averigua en qu\u00e9 joyer\u00eda me aceptan oro a cambio de tus besos."],["Con una sonrisa","Tengo toda la buena intenci\u00f3n de decirte algo sensato. Pero tambi\u00e9n tengo ganas de llamarte manguito y ver qu\u00e9 cara pones."],["Con una sonrisa","Para ti pedir\u00eda una mesa con buena iluminaci\u00f3n. Me parece justo apreciar como corresponde la belleza del plato y, ya de paso, la tuya."],["Con una sonrisa","Mi truco para sacar conversaci\u00f3n contigo es sencill\u00edsimo. Te saludo y despu\u00e9s intento que la conversaci\u00f3n no se acabe."],["Con una sonrisa","Me haces falta, y eso que para extra\u00f1arte poquito ya le puse todo mi esfuerzo. P\u00e9simo resultado."],["Con una sonrisa","Puedo explicar por qu\u00e9 hay tantos besitos en este papel. Estaba ahorrando en abrazos para d\u00e1rtelos en persona."],["Con una sonrisa","Entre cenar temprano y esperarte un ratito, elijo picar algo y esperarte. El romanticismo tambi\u00e9n requiere estrategia."],["Con una sonrisa","Yo s\u00e9 poner cara de que todo est\u00e1 bajo control. Por favor, no te acerques demasiado si quieres que me dure."],["Con una sonrisa","En este preciso instante podr\u00edas estar despeinada y yo seguir\u00eda feliz de tener la exclusiva de verte as\u00ed."],["Con una sonrisa","Pienso llevarte a bailar apenas resuelva un peque\u00f1o detalle: convencer a mis dos pies de que trabajen en equipo."],["Con una sonrisa","Est\u00e1s invitada a un paseo muy lujoso. Incluye charla privada conmigo y vistas exclusivas de la calle por donde vayamos."],["Con una sonrisa","Ay, si las almohadas hablaran. La m\u00eda probablemente pedir\u00eda que le deje de contar cu\u00e1nto te extra\u00f1o y la deje dormir."],["Con una sonrisa","Un momento de silencio por todos los piropos buen\u00edsimos que se me ocurren cinco minutos despu\u00e9s de despedirme."],["Con una sonrisa","Me caes tan bien que hasta me dan ganas de conocer a la persona que ser\u00edas despu\u00e9s de una siesta largu\u00edsima."],["Con una sonrisa","En los cuentos el pr\u00edncipe trae caballo. Yo traigo inter\u00e9s genuino en tus chismes y ganas de llevarte por algo rico."],["Con una sonrisa","La siguiente frase es un piropo apto para todos los horarios: qu\u00e9 linda te ves siendo t\u00fa."],["Con una sonrisa","Traigo una invitaci\u00f3n sin letra chica. Bueno, hay una l\u00ednea en chiquitito que dice que me har\u00eda ilusi\u00f3n verte."],["Con una sonrisa","Mi amada Mishell, reciba usted una muestra de mi m\u00e1s profunda admiraci\u00f3n. Ya, ven, que me sent\u00ed raro habl\u00e1ndote de usted."],["Con una sonrisa","Tengo un regalo invisible. Estira la mano, ci\u00e9rrala y ya tienes todas mis ganas de estar ah\u00ed. Pesa un poquito."],["Con una sonrisa","Quisiera aprender de memoria tu manera favorita de pedir comida. Ser\u00eda mi primer t\u00edtulo oficial en algo que importa de verdad."],["Con una sonrisa","Si alcanzas a escuchar un \u00abqu\u00e9 linda\u00bb desde donde est\u00e1s, puede que haya pensado en voz demasiado alta."],["Con una sonrisa","Mi lado poeta va de traje. Mi lado que te conoce lo manda a cambiarse para poder caminar contigo en zapatillas."],["Con una sonrisa","A veces quisiera que mi celular tuviera ruedas. Al menos uno de los dos llegar\u00eda m\u00e1s r\u00e1pido con mi mensaje de cari\u00f1o."],["Con una sonrisa","Tengo una cara reservada para ti. Es la de estar intentando aguantar la risa justo cuando me miras."],["Con una sonrisa","Al principio de cualquier plan contigo se recomienda revisar si queda espacio para el postre. Y para un ratito m\u00e1s."],["Con una sonrisa","Si tienes un minuto para un enamorado haciendo publicidad de sus abrazos, te puedo hacer una demostraci\u00f3n gratuita."],["Con una sonrisa","Deber\u00eda darte mi horario de atenci\u00f3n. Los cari\u00f1os a domicilio dependen del tr\u00e1fico, pero los \u00abte amo\u00bb salen al toque."],["Con una sonrisa","Si encontraras una linterna que proyecta mis pensamientos, tendr\u00edas que cobrarme derechos de imagen."],["Con una sonrisa","El d\u00eda ideal para invitarte algo termina en s. Y si termina en o tambi\u00e9n tengo disponibilidad."],["Con una sonrisa","Quiero decirte algo tan dulce que casi da sed. A ver, primero un traguito de agua: me fascinas."],["Con una sonrisa","Tengo la vaga sospecha de que tu nombre suena m\u00e1s lindo que los dem\u00e1s. Puede que el investigador est\u00e9 algo enamorado."],["Con una sonrisa","Me parece buena idea organizar un intercambio de talentos. T\u00fa sonr\u00edes y yo demuestro una capacidad impresionante para enternecerme."],["Con una sonrisa","Si pudiera doblar una esquina y aparecer a tu lado, me convertir\u00eda en un hombre de dar much\u00edsimas vueltas a la manzana."],["Con una sonrisa","Tu \u00abhola\u00bb acaba de ganarle por goleada a cualquier notificaci\u00f3n que yo tuviera pendiente en mi imaginaci\u00f3n."],["Con una sonrisa","Voy a ser honesto. Si escogiera una flor para ti, primero preguntar\u00eda cu\u00e1l dura m\u00e1s y despu\u00e9s cu\u00e1l te har\u00eda m\u00e1s ilusi\u00f3n. Y ganar\u00eda la segunda."],["Con una sonrisa","Una pregunta sin truco. Si te invito a vernos, \u00bfcu\u00e1ntas aes le puedo poner al \u00abya\u00bb que me va a salir de felicidad?"],["Con una sonrisa","Mishell, si hubiera subt\u00edtulos para mi cara, probablemente dir\u00edan \u00abanda bien enamorado\u00bb durante toda nuestra conversaci\u00f3n."],["Con una sonrisa","Ojal\u00e1 mis pesta\u00f1as fueran m\u00e1s obedientes. Intent\u00e9 gui\u00f1arte un ojo en mi imaginaci\u00f3n y te parpade\u00e9 con entusiasmo."],["Con una sonrisa","En vez de llevar una libreta de ideas rom\u00e1nticas podr\u00eda llevarte a ti. Eres mejor compa\u00f1\u00eda y las ideas me salen solas."],["Con una sonrisa","Tengo catorce razones para querer verte. Las iba a listar, pero la primera es \u00abporque te extra\u00f1o\u00bb y ya me convenci\u00f3."],["Con una sonrisa","Si tu cari\u00f1o fuera tallar\u00edn pedir\u00eda yapa. Ya s\u00e9, intento de poema antes del almuerzo."],["Con una sonrisa","Alg\u00fan d\u00eda voy a escribir un manual sobre c\u00f3mo verte y actuar normal. Por ahora solo tengo la portada."],["Con una sonrisa","Me gusta que seas mi enamorada. Qu\u00e9 t\u00edtulo tan bonito para ponerte en la lista de contactos y aun as\u00ed tener ganas de a\u00f1adirle corazones."],["Con una sonrisa","Ser\u00eda capaz de aprender a doblar servilletas como cisnes para impresionarte. O podemos ahorrarnos el curso y te digo de frente que me gustas."],["Con una sonrisa","Hay que reconocer que la tecnolog\u00eda ha avanzado mucho para transmitir besitos. Aunque la versi\u00f3n presencial sigue teniendo m\u00e1s \u00e9xito conmigo."],["Con una sonrisa","Hice espacio para ti entre mis pensamientos. Lo sensato habr\u00eda sido reservar menos de todo el sill\u00f3n, pero ya est\u00e1."],["Con una sonrisa","Si fu\u00e9ramos gatos, yo igual buscar\u00eda el pedacito de sol que queda pegado a ti."],["Con una sonrisa","No s\u00e9 qu\u00e9 dicen las reglas del coqueteo sobre repetir un piropo. Por si acaso, reformulo: precios\u00edsima."],["Con una sonrisa","Para hacerte sonre\u00edr tengo planes A, B y C. El C es que me d\u00e9 risa a m\u00ed haber llegado hasta el plan C."],["Con una sonrisa","Quisiera ser r\u00e1pido con las palabras. En el rato que me demoro escogiendo un apodo bonito ya me dieron ganas de decirte tres."],["Con una sonrisa","Si te escribo que quisiera robarte un besito, declaro de antemano que pienso pedirte permiso. P\u00e9simo ladr\u00f3n, excelente intenci\u00f3n."],["Con una sonrisa","Algunas personas ordenan las cosas por orden alfab\u00e9tico. Yo, por ganas de verte, te pongo primera aunque empieces con M."],["Con una sonrisa","Te har\u00eda una demostraci\u00f3n de mis dotes de gal\u00e1n. Qu\u00e9date con la parte de acercarme una silla y olvida la de chocar con la mesa por mirarte."],["Con una sonrisa","Mi estimada chiki, tengo una petici\u00f3n. \u00bfPodemos adelantar el pr\u00f3ximo abrazo unos cuarenta kil\u00f3metros o lo que falte?"],["Con una sonrisa","Voy a hacer una colecta de momentos libres. La causa es noble: invertirlos contigo."],["Con una sonrisa","Ponte c\u00f3moda, que viene una declaraci\u00f3n intensa. Me gustas m\u00e1s que quedarme cinco minutos m\u00e1s en la cama, y mira que me cuesta levantarme."],["Con una sonrisa","Qu\u00e9 bonita costumbre la de querer contarte todo. Aunque contigo de p\u00fablico hasta elegir un pan me parece digno de reportaje."],["Con una sonrisa","Si buscas a alguien con experiencia profesional en estar orgulloso de ti, puedo mandar referencias. Mi cara es una."],["Con una sonrisa","A veces te escribir\u00eda cosas profundas. Otras veces solo quiero mandarte un pollito chiquito y decirte \u00abmira, nosotros\u00bb aunque sea uno solo."],["Con una sonrisa","Tu abrazo viene en la talla exacta. La persona que hizo el molde claramente sab\u00eda lo que hac\u00eda."],["Con una sonrisa","Si me regalaran un cent\u00edmetro extra de estatura por cada piropo que te debo, hoy te podr\u00eda bajar la luna sin escalera."],["Con una sonrisa","A m\u00ed el \u00abpara llevar\u00bb siempre me suena incompleto. Para llevar ad\u00f3nde, con qui\u00e9n, y si vienes t\u00fa, qu\u00e9 rico."],["Con una sonrisa","Hay algo que tengo clar\u00edsimo en este mundo lleno de preguntas. Si queda sitio a tu lado, me corro para all\u00e1 de inmediato."],["Con una sonrisa","Este papelito ten\u00eda un discurso preparado y al verte se qued\u00f3 en blanco. Me pidi\u00f3 que te diga que le pareces preciosa."],["Con una sonrisa","La gente dice \u00abqu\u00e9 peque\u00f1o es el mundo\u00bb. A m\u00ed todav\u00eda me parece enorme cuando quiero pasar a verte un momentito."],["Con una sonrisa","Por si alguna vez dudas de mis habilidades para improvisar, mira todo el tiempo que puedo quedarme inventando razones para no despedirme."],["Con una sonrisa","Una sonrisita tuya y ya veo el d\u00eda de otro color. \u00bfVendes pintura o c\u00f3mo es el negocio?"],["Con una sonrisa","Me gustar\u00eda llevarte a un museo y conversar bajito. Principalmente por lo lindo que sonar\u00eda decirte al o\u00eddo una tonter\u00eda."],["Con una sonrisa","En mi defensa, si quisieras que yo actuara con normalidad, tendr\u00edas que ser un poquito menos encantadora. Qu\u00e9date as\u00ed, ya perd\u00ed el juicio feliz."],["Con una sonrisa","El mejor invento para una cita ser\u00eda una hora con minutos m\u00e1s largos. De paso que sirva para la siesta."],["Con una sonrisa","Si alguien lee este papel, que sepa que va dirigido espec\u00edficamente a la due\u00f1a del apodo \u00abmi bonita\u00bb. Los dem\u00e1s pueden seguir circulando."],["Con una sonrisa","Los abrazos largos deber\u00edan tener su propia unidad de tiempo. \u00abLlego en tres canciones y un todav\u00eda no me sueltes\u00bb."],["Con una sonrisa","Te invitar\u00eda a una degustaci\u00f3n de mis mejores cumplidos. El plato de fondo ser\u00eda mirarte un segundo y olvidarme de la carta."],["Con una sonrisa","Cuando quieras hacerme feliz sin gastar nada, te ofrezco un truco muy econ\u00f3mico. Dime que te hace ilusi\u00f3n verme."],["Con una sonrisa","El d\u00eda que llegue alguien con un detector de enamorados va a tener que pedirme que me aleje un poquito para calibrarlo."],["Con una sonrisa","T\u00fa bien podr\u00edas ser mi argumento favorito para salir de casa con la ropa bonita."],["Con una sonrisa","Me qued\u00e9 sin adjetivos para ti. Menos mal que todav\u00eda tengo manos para abrazarte y mejillas para ponerme rojo."],["Con una sonrisa","Cierro este papelito con una observaci\u00f3n completamente objetiva hecha por tu enamorado: eres una preciosura."],["Con una sonrisa","\u00bfY si nos vemos y fingimos que es por un asunto administrativo? Tenemos un par de besitos pendientes de entrega."],["Con una sonrisa","Cuando me dices algo bonito, quisiera responder como el protagonista de una pel\u00edcula. En la vida real me sale una risa y un \u00abay, t\u00fa\u00bb."],["Con una sonrisa","Me gusta tanto hablar contigo que hasta la bater\u00eda del celular tendr\u00e1 opiniones sobre nuestra relaci\u00f3n."],["Con una sonrisa","S\u00e9 de un buen sitio para guardar tus manos cuando tengas fr\u00edo. Me comprometo a desocupar mis bolsillos."],["Con una sonrisa","Puedo imaginar perfectamente el momento de decirte un piropo: t\u00fa ah\u00ed toda linda y yo acord\u00e1ndome demasiado tarde de respirar."],["Con una sonrisa","Si el cari\u00f1o se entregara en paquetes, el tuyo vendr\u00eda con la etiqueta \u00ababrir despacito, adentro hay un enamorado nervioso\u00bb."],["Con una sonrisa","Por favor, acepte este certificado de chica que me gusta mucho. La firma parece un garabato porque estabas t\u00fa presente."],["Con una sonrisa","Si nos dan un micr\u00f3fono para contar qu\u00e9 nos gusta del otro, espero que hayan tra\u00eddo cargador."],["Con una sonrisa","Tu manera de existir me parece exageradamente adorable para alguien que seguro solo estaba buscando un vaso de agua."],["Con una sonrisa","Estoy orgulloso de mi buen gusto. Basta con presentarte para que se entienda de qu\u00e9 hablo."],["Con una sonrisa","Estoy a favor de que escojamos algo para ver sin pasar media vida eligiendo. Si fracasamos, igual pas\u00e9 media vida contigo. Gan\u00e9."],["Con una sonrisa","Si nos tocara armar un mueble, yo leer\u00eda las instrucciones y t\u00fa podr\u00edas recordarme que estaba sosteniendo el dibujito al rev\u00e9s. Adoro ese plan incluso en teor\u00eda."],["Con una sonrisa","Enamorarme me ha vuelto detallista. Antes ve\u00eda una panader\u00eda; ahora veo la posibilidad concreta de comprarte un bizcochito y decirte \u00abt\u00fa\u00bb."],["Con una sonrisa","Hay gente que se levanta de buen humor por naturaleza. Yo acepto ayuda externa en forma de una carita tuya."],["Con una sonrisa","El amor tiene sus misterios. Todav\u00eda investigo c\u00f3mo consigues que quiera decirte \u00abqu\u00e9 bonita\u00bb incluso por un audio."],["Con una sonrisa","Si te regalo una plantita, elegir\u00e9 una f\u00e1cil de cuidar. Ya me encargo yo de ser el que anda floreciendo cada vez que me hablas."],["Con una sonrisa","Conozco la respuesta a \u00abqu\u00e9 quieres hacer el s\u00e1bado\u00bb. Dime primero si t\u00fa tienes planes y ajusto la propuesta rom\u00e1nticamente."],["Con una sonrisa","Qu\u00e9 linda tu cara cuando imagino que lees esto. Mi imaginaci\u00f3n acaba de pedirme una copia para su colecci\u00f3n."],["Con una sonrisa","Te envolver\u00eda un abrazo para regalo si tuviera idea de c\u00f3mo hacer el lazo con los dos brazos ocupados."],["Con una sonrisa","Mishell, hoy est\u00e1s cordialmente invitada a ser la protagonista de un pensamiento cursi m\u00edo. La funci\u00f3n ya empez\u00f3, llegaste justo."],["Con una sonrisa","\u00bfSabes hacer magia? Porque con una sola frase tuya soy capaz de tener al mismo tiempo mariposas en la barriga y hambre de salir contigo a comer."],["Con una sonrisa","Vamos por una bebida con dos ca\u00f1itas como en las pel\u00edculas. Si pedimos sabores diferentes nos ahorramos la pel\u00edcula y probamos dos cosas ricas."],["Con una sonrisa","Tengo que informarte de un error de c\u00e1lculo. Pens\u00e9 que ya me gustabas much\u00edsimo y todav\u00eda parec\u00eda quedarme espacio."],["Con una sonrisa","Estoy entrenando para ser m\u00e1s ordenado. Ya puse todas mis ganas de besar a alguien en el mismo sitio: contigo."],["Con una sonrisa","Si voy a perder el hilo de lo que estaba diciendo, prefiero que sea porque te acercaste a darme un beso. As\u00ed se pierde con prop\u00f3sito."],["Con una sonrisa","Me imagino llegando a una cita con una rosa en la boca. Mejor la llevo en la mano, que quiero saludarte sin comerme el tallo."],["Con una sonrisa","La ventaja de escribirte papelitos es que puedo borrar cuando me trabo. En persona solo toca hacerse el que estaba inventando una palabra."],["Con una sonrisa","Alguien deber\u00eda explicarme por qu\u00e9 \u00abte quiero cerquita\u00bb suena mejor que \u00absolicito reducir la distancia\u00bb. Supongo que por eso me enamor\u00e9 antes de redactar este tr\u00e1mite."],["Con una sonrisa","Qu\u00e9 ganas de ver una peli de suspenso contigo y decirte que me agarres la mano si te asustas. Tal vez la mano la necesite yo."],["Con una sonrisa","Hasta que inventen un teletransporte para enamorados te mando esto. Si sabes de alguien tomando reservas para el invento, ap\u00fantame."],["Con una sonrisa","Mis palabras suelen caminar normal. Cuando est\u00e1n a punto de decirte que me encantas, empiezan a tropezarse entre ellas."],["Con una sonrisa","Ando bastante enamorado para ser alguien que se acaba de sentar tranquilamente a mirar la hora."],["Con una sonrisa","Si ma\u00f1ana amanezco hecho poeta, ya sabes qui\u00e9n me inspir\u00f3. Si amanezco con sue\u00f1o, igual te digo que te quiero bostezando."],["Con una sonrisa","Habr\u00eda que inventar un signo de puntuaci\u00f3n para esa sonrisita que se me escapa despu\u00e9s de escribir \u00abmi bonita\u00bb."],["Con una sonrisa","Yo tambi\u00e9n tengo una receta secreta. Se llama llegar con un antojo para ti y aceptar con humildad la felicidad de que me des a probar."],["Con una sonrisa","Me das ganas de aprender a silbar canciones bonitas. De momento tengo dominada la parte de pensar en ti mientras me sale puro aire."],["Con una sonrisa","Si ya te dije hoy que me gustas, qu\u00e9 suerte la tuya. Vengo con la repetici\u00f3n a pedido del \u00fanico miembro de mi club de fans: yo."],["Con una sonrisa","T\u00fa mereces alguien que te mire con respeto y admiraci\u00f3n. Tambi\u00e9n puedo poner cara de tonto si hace falta variedad."],["Con una sonrisa","Para el pr\u00f3ximo papelito pens\u00e9 en escribir solo tu nombre. Luego me dio pena dejarte as\u00ed que aprovecho este para decirte mi vida."],["Con una sonrisa","Cuando quieras escoger entre un abrazo de bienvenida y otro de despedida, tengo buenas noticias. Podemos reservar ambos y poner una salida bonita en medio."],["Con una sonrisa","Tengo sue\u00f1o de campe\u00f3n y aun as\u00ed me quedar\u00eda un rato a o\u00edrte. No prometo respuestas brillantes, pero mi oreja sigue presente."],["Con una sonrisa","Qu\u00e9 linda ser\u00eda una vida en la que te pueda preguntar d\u00f3nde qued\u00f3 el pan y de paso darte un beso mientras lo buscamos."],["Con una sonrisa","Mi idea de hacer varias cosas a la vez es quererte mientras intento acordarme de qu\u00e9 estaba haciendo."],["Con una sonrisa","Si te llegan mis ganas de verte antes que yo, diles que se sienten y se porten bonito. Estoy haciendo lo posible por alcanzarlas."],["Con una sonrisa","\u00bfTe cuento una de amor? Hay una chica que abre papelitos sin sospechar que al que los escribe le gusta imaginarla justo haciendo eso."],["Con una sonrisa","La pr\u00f3xima vez que te vea intentar\u00e9 darte un abrazo de los que arreglan el d\u00eda. Si el d\u00eda ya estaba bonito, igual se hacen mejoras."],["Poemita","D\u00e9jame quererte despacito,\ncomo se toma algo rico\ncuando uno quiere que le dure."],["Poemita","Cierro los ojos para descansar\ny justo ah\u00ed apareces t\u00fa.\nHasta mi descanso tiene buena compa\u00f1\u00eda."],["Poemita","Hay una alegr\u00eda muy m\u00eda\nque tiene que ver contigo.\nMe sale por la cara aunque no diga nada."],["Poemita","Si mi cari\u00f1o ocupara espacio,\ntendr\u00eda que hacerte llegar este papel\ncon los brazos bien abiertos."],["Poemita","Podr\u00eda decir tu nombre de corrido.\nPrefiero ir despacio.\nMe gusta c\u00f3mo suena."],["Poemita","Tu voz y una silla a tu lado.\nCon eso ya s\u00e9\nd\u00f3nde quiero pasar la tarde."],["Poemita","En un d\u00eda de tantas cosas pendientes,\nquererte es la \u00fanica\nque me sale sin mirar la lista."],["Poemita","Una caricia tiene su propio idioma.\nLa m\u00eda dir\u00eda bajito\nqu\u00e9 gusto que seas t\u00fa."],["Poemita","Voy por la mitad de este poema\ny ya me dieron ganas de verte.\nAs\u00ed qui\u00e9n se concentra, bonita."],["Poemita","La luz que entra por la ventana\nme sirve para escribirte.\nLa sonrisa con que lo hago es toda tuya."],["Poemita","Quiero un beso de esos\nque tienen una risita en medio\ny hay que empezar de nuevo."],["Poemita","Ojal\u00e1 al cerrar este papelito\nte quede un poco de la ternura\ncon que lo escrib\u00ed."],["Poemita","Ahorita quiero algo bien sencillo.\nTener tu mano en la m\u00eda\ny sentir que t\u00fa tambi\u00e9n la aprietas."],["Poemita","Me asomo al pensamiento\nde pasar la vida contigo\ny hasta el lunes me parece bonito."],["Poemita","De todos los sonidos del d\u00eda\nme quedo con ese tonito tuyo\ncuando algo te da ilusi\u00f3n."],["Poemita","Es bonito tener\na qui\u00e9n mandarle un \u00abmira esto\u00bb\napenas algo me sorprende."],["Poemita","Si alguna vez me falta la rima,\nme alcanza con decirte la verdad.\nEstoy bien enamorado de ti."],["Poemita","Me cabe un mont\u00f3n de cari\u00f1o en el pecho.\nLo que todav\u00eda no aprendo\nes a meterlo entero en una frase."],["Poemita","Te mando una flor inventada.\nNo necesita agua.\nSolo quer\u00eda que hoy alguien te diera una."],["Poemita","Cu\u00e1nto me gusta pensar\nque una misma palabra, \u00abnosotros\u00bb,\nnos nombra a los dos."],["Poemita","Tal vez este verso no rime.\nTampoco riman nuestros nombres\ny me encanta c\u00f3mo quedan juntos."],["De m\u00ed para ti","Hoy volvimos a hacer planes para casarnos y viajar por todo el mundo. Nada exagerado."],["Poemita","Pasa tu dedo por esta l\u00ednea.\nAh\u00ed dejar\u00eda un besito\nsi supiera c\u00f3mo guardarlo."],["Poemita","Me haces bien de una manera sencilla.\nPuedo estar a mitad de un mal d\u00eda\ny todav\u00eda me nace quererte bonito."],["Poemita","Ojal\u00e1 un d\u00eda leas esto\nsentada al lado m\u00edo.\nPara que cuando levantes la vista\nya te est\u00e9 mirando."],["Poemita","Hay d\u00edas que me apuran por todos lados.\nEntonces recuerdo tus ojos\ny por dentro camino m\u00e1s lento."],["Poemita","Cuando algo te emociona\nhasta las pausas entre tus palabras\nparecen tener ganas de seguir."],["Poemita","Un pedacito de mi tarde\nse acaba de ir contigo.\nLo est\u00e1s leyendo."],["Poemita","Un beso para tu frente,\npara que empieces por ah\u00ed\na sentir todo lo que te quiero."],["Poemita","No importa si est\u00e1 nublado.\nSi sales contenta de casa,\nya tengo buenas noticias del d\u00eda."],["Poemita","Hasta el borde de una hoja\nme alcanza para anotarlo.\nMe encantas."],["Poemita","Qu\u00e9 forma tan bonita\ntiene el d\u00eda de empezar otra vez\ncuando me dices hola."],["Poemita","Intent\u00e9 resumir lo que me gustas.\nLo hice tan mal\nque ahora tengo otro poema."],["Poemita","Si escribiera con el dedo sobre arena,\npondr\u00eda tu nombre cerquita del m\u00edo\ny me sentar\u00eda a mirarlos un rato."],["Poemita","Mientras lees estas palabras,\nen alg\u00fan lado estoy queri\u00e9ndote.\nAs\u00ed coinciden nuestras tardes."],["Poemita","Guarda lo que te haga sonre\u00edr\nde todo esto que escribo.\nEl resto ya te lo dar\u00e9 en abrazos."],["Poemita","Querer saber c\u00f3mo est\u00e1s,\nesperarme a o\u00edr la respuesta.\nAs\u00ed tambi\u00e9n te digo que te quiero."],["Poemita","En lugar de contar ovejas,\nme quedar\u00eda pensando en todo lo bonito de ti.\nAunque as\u00ed duermo tard\u00edsimo."],["Poemita","Mis ganas de cuidarte\ncaben en cosas chiquitas.\nEscucharte hasta el final es una de ellas."],["Poemita","Si te pintara un cielo,\ndejar\u00eda un espacio en blanco\npara la nube que t\u00fa quieras inventar."],["Poemita","Que el reloj haga su trabajo.\nYo tengo el m\u00edo\ncuando te tengo cerca: disfrutarlo."],["Poemita","El d\u00eda puede empezar de nuevo\ncon una sola noticia.\nQue hoy est\u00e1s contenta, mi vida."],["Poemita","Me har\u00eda un bolsillo aparte\npara llevar las cosas que me dices\ny encontrarlas cuando te extra\u00f1o."],["Poemita","Hay una parte del silencio\nque me gusta much\u00edsimo.\nLa que comparto contigo sin apuro."],["Poemita","Te dejar\u00eda un beso en la mejilla\ny me llevar\u00eda esa sensaci\u00f3n bonita\nde haber llegado hasta ti."],["Poemita","Mis palabras van sin envoltura.\nAs\u00ed puedes ver qu\u00e9 traen.\nUn cari\u00f1o enorme por ti."],["Poemita","Con tanto mundo por conocer,\nqu\u00e9 suerte me da\ntener curiosidad por tu martes."],["Poemita","Si un d\u00eda dibujas una puerta,\ndib\u00fajame al otro lado,\nfeliz porque est\u00e1s por abrir."],["Poemita","Hoy mi poema tiene una sola idea.\nT\u00fa leyendo tranquila\ny yo deseando que est\u00e9s bien."],["Poemita","Algunas luces se apagan con un bot\u00f3n.\nEsta alegr\u00eda de quererte\nme acompa\u00f1a aun con los ojos cerrados."],["Poemita","Miro mis manos y pienso\nque podr\u00edan aprenderse las tuyas\nsin estudiar ni un poquito."],["Poemita","Todav\u00eda me sorprende\nque un nombre tan cortito\nme haga sentir tantas cosas, Mishell."],["Poemita","El mejor lugar para mi voz\nser\u00eda ese ladito de tu o\u00eddo\ndonde podr\u00eda decirte \u00abte amo\u00bb suavecito."],["Poemita","Si pudiera medir los d\u00edas bonitos,\nno usar\u00eda horas.\nMe acordar\u00eda de cu\u00e1nto nos re\u00edmos."],["Poemita","Tu cari\u00f1o le da a mi coraz\u00f3n\nalgo parecido a caminar descalzo\ndespu\u00e9s de un d\u00eda largu\u00edsimo."],["Poemita","Cuando sonr\u00edes de verdad\npasa una cosa muy simple.\nMe dan ganas de sonre\u00edr contigo."],["Poemita","Una palabra tuya\nse queda conmigo un rato.\nA veces me sorprendo haci\u00e9ndole compa\u00f1\u00eda."],["Poemita","Voy a cuidar tu confianza\ncomo se cuida una flor reci\u00e9n nacida,\ncon atenci\u00f3n todos los d\u00edas."],["Poemita","Que siempre tengas un lugar\ndonde te salga hablar tal como eres.\nMe encantar\u00eda ser ese lugar contigo."],["Poemita","Dos sombras caminar\u00edan juntitas\nsi t\u00fa y yo sali\u00e9ramos ahora.\nHasta el suelo nos har\u00eda compa\u00f1\u00eda."],["Poemita","Si estuvi\u00e9ramos sentados cerca,\neste papel dir\u00eda lo mismo,\npero tendr\u00edas mi mano encima de la tuya."],["Poemita","Me gusta este amor\nque entra en las cosas de todos los d\u00edas\ny les cambia la cara despacito."],["Poemita","Tienes esa forma de ser\nque me deja con ganas\nde conocer todav\u00eda m\u00e1s."],["Poemita","Me alcanzar\u00eda una esquinita de la tarde\npara recostarme contigo\ny dejar al mundo hacer su bulla."],["Poemita","Este verso viene sin prisa.\nSi\u00e9ntate con \u00e9l\nel tiempo que te haga bien."],["Poemita","Para m\u00ed el amor se parece\na acercarte la silla\nporque todav\u00eda quiero escucharte."],["Poemita","Las palabras \u00abqu\u00e9date un poquito\u00bb\nsiempre me quedan cortas.\nPor poquito yo entiendo toda la tarde."],["Poemita","Para tus d\u00edas felices\ntengo dos manos listas\npara aplaudirte primero."],["Poemita","Qu\u00e9 ganas de darte\nun abrazo tan honesto\nque hasta mis nervios se acomoden."],["Poemita","No s\u00e9 pintar retratos.\nPero cuando pienso en alguien linda,\ntu cara me sale clarita."],["Poemita","Me inventar\u00eda un camino cortito\nentre donde est\u00e1s y donde estoy.\nPara visitarte hasta por tonter\u00edas."],["Poemita","Entre todas las personas del mundo\nhay una que me hace ilusi\u00f3n todos los d\u00edas.\nAs\u00ed me pasa contigo."],["Poemita","Ten cuidado con este verso.\nLo dobl\u00e9 con tanto cari\u00f1o\nque capaz te abraza cuando lo abras."],["Poemita","Al verte se me juntar\u00edan las palabras.\nPor eso empezar\u00eda con un beso\ny luego ya vemos qu\u00e9 sale."],["Poemita","Lo que me nace contigo\nes sentarme cerquita\naunque haya sitio de sobra."],["Poemita","Mis ojos hacen algo curioso.\nSe les pone bonita la vida\nnom\u00e1s con imaginarte en ella."],["Poemita","Eres t\u00fa\nla que vuelve especial una pregunta\ntan chiquita como \u00ab\u00bfya llegaste?\u00bb."],["Poemita","Un cielo de tantas estrellas\ny yo pidiendo algo sencillo.\nTenerte a mi lado para mirarlo."],["Poemita","Me queda una esquina sin escribir.\nAh\u00ed me sentar\u00eda contigo\nsi fu\u00e9ramos as\u00ed de peque\u00f1itos."],["Poemita","Quisiera verte contenta\ncon la misma frecuencia\ncon la que te pienso."],["Poemita","Podr\u00edamos gastar la tarde\nen decidir d\u00f3nde ir\ny me la habr\u00eda pasado lindo igual."],["Poemita","Hacerte un espacio en mi d\u00eda\nme sale tan f\u00e1cil\ncomo moverme para que te sientes."],["Poemita","Te debo un mont\u00f3n de besos.\nPor suerte llevar la cuenta\ntambi\u00e9n nos puede tomar un ratito."],["Poemita","Esas ganas tuyas de vivir cosas bonitas\nme hacen querer poner de mi parte\npara que pasen."],["Poemita","Hoy amanec\u00ed sabiendo algo.\nHay una chica preciosa\na la que me encanta llamar mi amor."],["Poemita","Qu\u00e9 lindo cuando lo que sientes\nte asoma en los ojitos\nantes de llegar a la voz."],["Poemita","Si la alegr\u00eda pesara,\nyo terminar\u00eda con los brazos cansados\ncada vez que te cargo en un abrazo."],["Poemita","T\u00fa mereces amor atento,\ndel que pregunta, se acuerda\ny vuelve a preguntar."],["Poemita","Este cari\u00f1o tiene buen o\u00eddo.\nHasta si dices poquitito,\nme dan ganas de escucharte entero el d\u00eda."],["Poemita","Tu nombre al final de una carta\nser\u00eda mi motivo favorito\npara volver a leerla."],["Poemita","Voy dejando palabras\ncomo quien pone piedritas en un camino.\nTodas te llevan a un \u00abte quiero\u00bb."],["Poemita","Me gusta lo que hace mi pecho\ncuando te pienso de improviso.\nComo abrir una ventana al aire fresco."],["Poemita","Entre una canci\u00f3n y la siguiente\nte mandar\u00eda un besito.\nPara ponerte tambi\u00e9n en mi m\u00fasica."],["Poemita","Yo te quiero as\u00ed,\ncon los ojos abiertos\npara seguir descubri\u00e9ndote."],["Poemita","Un deseo para tu ma\u00f1ana.\nQue te pasen cosas bonitas\ny te alcance el d\u00eda para disfrutarlas."],["Poemita","Pondr\u00eda una lucecita en la puerta\npara que al llegar supieras\nque alguien se alegra de recibirte."],["Poemita","La semana tiene tantos nombres.\nMi d\u00eda favorito\nes cualquiera en que pueda verte."],["Poemita","Si pudiera doblar la luz,\nte har\u00eda con ella una lamparita\npara tus noches de quedarte leyendo."],["Poemita","Qu\u00e9 bien se siente\ntener ganas de decirte \u00abte amo\u00bb\naunque acabe de dec\u00edrtelo."],["Poemita","Entre tus planes y los m\u00edos\nhay un lugar precioso.\nLas cosas que nos ilusionan a los dos."],["Poemita","Un papelito es liviano.\nPor eso puede llegar hasta ti\ncon todo y mi cari\u00f1o adentro."],["Poemita","Te encuentro bonita\nhasta en esa imagen sencilla\nde ti haciendo cualquier cosa."],["Poemita","Hoy quisiera ser la raz\u00f3n\nde una sonrisa tuya\nque te sorprenda en plena calle."],["Poemita","El cari\u00f1o se deja ver\ncuando te nombro\ny se me ablanda la voz."],["Poemita","Tienes permiso de leer despacito.\nEste poema pas\u00f3 m\u00e1s tiempo\npensando en ti que escribi\u00e9ndose."],["Poemita","Puedo imaginar un horizonte hermoso.\nAun as\u00ed girar\u00eda la cabeza\npara ver si a ti tambi\u00e9n te gust\u00f3."],["Poemita","Qu\u00e9 suerte tan rara y tan linda\nque entre tu mundo y el m\u00edo\nhaya una historia nuestra."],["Poemita","Si te tropiezas con este poema\nen mitad de un d\u00eda com\u00fan,\nya tienes mi beso de media tarde."],["Poemita","Pondr\u00eda un banquito al sol\npara sentarme a quererte\nsin hacer ninguna otra cosa."],["Poemita","Ma\u00f1ana me gustar\u00eda\nvolver a tener esa sensaci\u00f3n\nde que eres t\u00fa quien viene hacia m\u00ed."],["Poemita","Cuando el cari\u00f1o es grande\nhasta un \u00abbuen provecho\u00bb\npuede llevar un abrazo adentro."],["Poemita","Mi coraz\u00f3n aprendi\u00f3 tu nombre\ny desde entonces lo pronuncia\nhasta cuando yo ando callado."],["Poemita","Las ganas de verte son educadas.\nMe dejan terminar mis cosas.\nPero esperan pegaditas a la puerta."],["Poemita","Te dar\u00eda un ramo de minutos\npara que los uses\nen algo que te haga bien."],["Poemita","Me hace feliz que existas\ntambi\u00e9n en todos esos lugares\ndonde yo no alcanzo a verte."],["Poemita","Con la punta de los dedos\nse puede sentir si algo est\u00e1 tibio.\nCon tu mano sentir\u00eda mucho m\u00e1s que eso."],["Poemita","Si se tratara de dibujar mi suerte,\nbastar\u00eda con un asiento vac\u00edo\ny t\u00fa acerc\u00e1ndote a ocuparlo."],["Poemita","El aire cabr\u00eda entre nosotros\nlo justo para dejarte decirme\notro ratito, por favor."],["Poemita","D\u00e9jame acercarme a tus sue\u00f1os\ncon la misma delicadeza\ncon la que se abre un regalo."],["Poemita","Esa sonrisa tuya\nmerece que la vida\nle d\u00e9 razones de sobra."],["Poemita","Nunca pens\u00e9 que fuera tan bonito\nusar la palabra \u00abcontigo\u00bb\nen tantos planes distintos."],["Poemita","Hay un \u00abte extra\u00f1o\u00bb\nque me sale con sonrisa.\nEs el que ya se imagina verte otra vez."],["Poemita","Me gusta c\u00f3mo cabe\ntu voz enorme de alegr\u00eda\nen algo tan chiquito como mi o\u00eddo."],["Poemita","Si t\u00fa fueras la destinataria\nhasta una lista de compras\nme saldr\u00eda con corazones al borde."],["Poemita","Hoy quiero ser un poquito m\u00e1s paciente,\nun poquito m\u00e1s atento.\nQuererte tambi\u00e9n me ense\u00f1a esas cosas."],["Poemita","Solo para que lo sepas,\neste coraz\u00f3n m\u00edo\nte quiere hasta en sus ratos distra\u00eddos."],["Poemita","Escribo una l\u00ednea\ny dejo aire alrededor.\nAs\u00ed hay sitio para el beso que te mando."],["Poemita","F\u00edjate qu\u00e9 lindo querer a alguien\nque el simple hecho de que le vaya bien\nya te alegra a ti tambi\u00e9n."],["Poemita","Lo que t\u00fa sue\u00f1as\nme interesa por algo bien sencillo.\nViene de ti."],["Poemita","Qu\u00e9 ganas de hacerte sentir\ntan bienvenida en mi abrazo\ncomo yo me siento en el tuyo."],["Poemita","Mi parte favorita de un viaje imaginario\nes voltear en el asiento\ny encontrarte al costado."],["Poemita","Yo te mirar\u00eda con ternura\naunque el d\u00eda entero\nse hubiera levantado de mal humor."],["Poemita","Una flor no pregunta\nsi vale la pena abrirse.\nYo tampoco dudo cuando me nace cuidarte."],["Poemita","Si te dejo una frase cortita,\nes para que alcance\nel espacio que queda entre dos besos."],["Poemita","Sobre una mesa pondr\u00eda dos vasos.\nSobre mi hombro, tu mejilla.\nQu\u00e9 poquitas cosas necesito para imaginar algo lindo."],["Poemita","Mis pasos tienen un favorito.\nEl que me deja\nal alcance de tus brazos."],["Poemita","Si yo tuviera buena letra,\nigual se me torcer\u00eda un poquito\ncuando escriba que me encantas."],["Poemita","Entra la ma\u00f1ana por la cortina.\nYo aprovecho la claridad\npara mandarte un pensamiento bonito."],["Poemita","Te quiero hasta en voz bajita,\nsin m\u00fasica de fondo\ny sin que nadie m\u00e1s lo sepa."],["Poemita","Sonar\u00edan tus pasos al acercarte.\nQu\u00e9 bonito poder reconocer alg\u00fan d\u00eda\nla alegr\u00eda antes de abrir la puerta."],["Poemita","Entre el primer beso\ny el que todav\u00eda te dar\u00eda\nhay uno que te espera justo ahora."],["Poemita","Ten\u00eda una p\u00e1gina entera para el poema.\nDej\u00e9 solo tu nombre.\nFue suficiente para sonre\u00edr mientras lo le\u00eda."],["Poemita","A quererte se aprende queri\u00e9ndote.\nPoco a poco voy entendiendo\nqu\u00e9 cosas te hacen sentir querida."],["Poemita","Me cruzar\u00eda la sala entera\naunque solo fuera\npara sentarme dos cent\u00edmetros m\u00e1s cerca."],["Poemita","Ojal\u00e1 te llegue\neste poquito de alegr\u00eda.\nLo puse en palabras para que alcanzara hasta ti."],["Poemita","Hay detalles tuyos\nque me ponen de buen \u00e1nimo\nantes de poder explicarme por qu\u00e9."],["Poemita","Quisiera cuidar de lo nuestro\ncomo se cuida un ritmo entre dos.\nEscuchando tu paso mientras doy el m\u00edo."],["Poemita","Junto a todo lo que te deseo para la vida\npondr\u00eda una \u00faltima cosita.\nQue nunca te falten ganas de ser t\u00fa."],["Poemita","Escrib\u00ed \u00abamor\u00bb bien despacio.\nMe dio tiempo de pensar en ti\nantes de llegar a la erre."],["Poemita","No hace falta esperar una fecha.\nHoy tambi\u00e9n es buen d\u00eda\npara que sepas cu\u00e1nto me gustas."],["Poemita","Si todas mis ganas de verte hicieran ruido,\nse oir\u00eda una fiesta\ncada vez que falta poquito."],["Poemita","Cuando se acabe esta frase,\nqu\u00e9date con lo de adentro.\nYo, feliz de estar enamorado de ti."],["Poemita","Ll\u00e9vate un beso para el camino\ny otro de reserva\npor si te provoca volver a m\u00ed un ratito."],["Poemita","Me gustar\u00eda ser parte\nde esas peque\u00f1as noticias buenas\nque te alegran sin avisar."],["Poemita","Entre tus manos y las m\u00edas\nhay una conversaci\u00f3n\nque empezar\u00eda con un apret\u00f3n suavecito."],["Poemita","Qu\u00e9 cosa tan simple y tan grande\ntener entre mis planes\nhacerte feliz hoy tambi\u00e9n."],["Poemita","De tu cari\u00f1o me gusta la huella\nque deja cuando ya pas\u00f3 el momento.\nMe quedo contento todav\u00eda."],["Poemita","Crecer contigo ser\u00eda aprender\nqu\u00e9 te sigue haciendo ilusi\u00f3n\na medida que cambian los a\u00f1os."],["Poemita","Un gesto tuyo tiene fuerza\npara quedarse en mi memoria\nsin hacer nada de ruido."],["Poemita","Ojal\u00e1 frente al espejo\nalguna vez te mires\ncon la ternura con que yo te veo."],["Poemita","Si lo bonito se pudiera oler,\neste papel llevar\u00eda\nun poquito de la tarde en que te lo escribo."],["Poemita","Cada vez que digo \u00abmi vida\u00bb\nme dan ganas de preguntarte\nqu\u00e9 parte de la tuya me quieres contar hoy."],["Poemita","Qu\u00e9 ganas de aplaudir tus alegr\u00edas\naunque sean de esas chiquitas\nque solo t\u00fa sabes cu\u00e1nto costaron."],["Poemita","Veo una luz encendida de lejos\ny pienso en lo lindo que ser\u00eda\nsaber que detr\u00e1s est\u00e1s t\u00fa."],["Poemita","A veces dos palabras alcanzan.\nHoy me quedo con estas:\nven cerquita."],["Poemita","Pon tu mano sobre el coraz\u00f3n.\nAs\u00ed de cerquita\nme gustar\u00eda que sintieras mi cari\u00f1o."],["Poemita","Me encanta pensar que puedes\nabrir cualquier verso de estos\ny encontrarme de tu lado."],["Poemita","Todo el d\u00eda anda movi\u00e9ndose.\nMi cari\u00f1o se queda quietito\ncuando necesitas d\u00f3nde apoyarte."],["Poemita","Qu\u00e9 bien suena tu nombre\ncuando lo encuentro al comienzo\nde una carta que estoy por escribir."],["Poemita","Te ofrecer\u00eda la sombra\nde mi propio sombrero\naunque terminemos pegaditos para alcanzarla."],["Poemita","De tener una hora extra,\nla usar\u00eda en preguntarte\neso que te quedaste con ganas de contar."],["Poemita","Algunas alegr\u00edas llegan saltando.\nLa de quererte est\u00e1 aqu\u00ed tranquila,\nhaci\u00e9ndome compa\u00f1\u00eda a cada rato."],["Poemita","Si coincidimos en un mismo banco,\nme mover\u00e9 un poquito.\nSiempre hay forma de quedar m\u00e1s cerca."],["Poemita","Mis abrazos andan practicando\npara que el d\u00eda que vengan los tuyos\nsepamos recibirnos bonito."],["Poemita","Qu\u00e9 bonito que el cari\u00f1o\nse pueda repartir todo el d\u00eda\nsin quedarse uno con menos."],["Poemita","T\u00fa me ense\u00f1as sin propon\u00e9rtelo\nque se puede querer mucho\ny seguir queriendo conocer m\u00e1s."],["Poemita","Este cari\u00f1o va contigo\nhasta cuando mi letra\nse acaba al borde del papel."],["Poemita","Le pregunt\u00e9 a mis ganas de verte\nsi pod\u00edan quedarse quietas.\nMe respondieron con tu nombre."],["Poemita","Voy a tomarme en serio\neso de hacerte re\u00edr.\nMe encanta cuando el esfuerzo me sale bien."],["Poemita","A m\u00ed que me den\nuna tarde lenta contigo.\nLas cosas urgentes sabr\u00e1n esperar su turno."],["Poemita","Lo chiquito de este mensaje\nsolo es el tama\u00f1o.\nPor dentro te estoy queriendo a lo grande."],["Poemita","Un d\u00eda de estos quisiera\nver el sol moverse por la pared\nsin mover mi mano de la tuya."],["Poemita","Me nace celebrar\ncada pedacito de ti\nque descubres y decides querer."],["Poemita","Qu\u00e9 descanso poder decirte\nque estoy enamorado de ti\ny quedarme tranquilo con la verdad."],["Poemita","Las canciones duran unos minutos.\nMi parte favorita ser\u00eda\nquedarme contigo despu\u00e9s de la \u00faltima nota."],["Poemita","Algo tan cotidiano como una ventana\nse vuelve un buen sitio\nsi nos deja mirar juntos lo que hay afuera."],["Poemita","Deja que este cari\u00f1o te alcance\nen la fila, en casa, en el carro.\nTambi\u00e9n sabe encontrarte en d\u00edas comunes."],["Poemita","Toda mi ternura\nse pone de puntitas\npara darte un besito en la frente."],["Poemita","Ser\u00e1 que te quiero en serio,\nque cuando imagino tu felicidad\npienso en lo que te gusta a ti."],["Poemita","Me quedar\u00eda a tu lado\nhasta ver cambiar la luz\nde clara a doradita."],["Poemita","Con una manta bastar\u00eda\nsi te arrimas a m\u00ed\ny dejamos los pies bien tapados."],["Poemita","Quiero escucharte decir\nque al fin se te dio algo que deseabas.\nQu\u00e9 ganas de estar ah\u00ed para celebrarlo."],["Poemita","Lo mejor que podr\u00eda pasarle a este poema\nser\u00eda que lo leyeras\ny supieras que hablo tal como siento."],["Poemita","El cielo se tarda horas en oscurecer.\nA m\u00ed me toma un segundo\nponerme contento al pensar en ti."],["Poemita","Yo quisiera aprender\na besarte de esa manera\nque dice exactamente \u00abme alegra verte\u00bb."],["Poemita","Me ganaste la atenci\u00f3n\ncon tanta naturalidad\nque ahora hasta mi distracci\u00f3n se va contigo."],["Poemita","Abracito de bolsillo.\nPara sacarlo cuando quieras\ny devolverlo cuando nos veamos."],["Poemita","Si trazara una l\u00ednea\npor cada motivo que tengo para quererte,\nme saldr\u00eda un cuaderno rayado completo."],["Poemita","Le gustas a mis domingos.\nSe imaginan contigo\ny ya quieren quedarse todo el d\u00eda en casa."],["Poemita","Que ninguna prisa\nme haga olvidar jam\u00e1s\nlo bien que me sabe tenerte cerquita."],["Poemita","Yo s\u00ed me ilusiono\ncon la idea tan simple\nde cruzar la calle tomado de tu mano."],["Poemita","Le har\u00eda un sitio a tu risa\nen cada recuerdo bonito\nque todav\u00eda nos queda por hacer."],["Poemita","Poder decirte \u00abamor\u00bb\nsin andar buscando otra palabra\nme sigue pareciendo una suerte."],["Poemita","Un abrazo largo tiene algo precioso.\nEn alg\u00fan momento dejamos de apretar\ny aun as\u00ed seguimos ah\u00ed."],["Poemita","Para escribirte hoy\nsolo necesit\u00e9 acordarme\nde lo bien que me hace quererte."],["Poemita","Te querr\u00eda con la misma ternura\nun d\u00eda en que todo te salga lindo\ny uno en que quieras volver a empezar."],["Poemita","Si alguna vez te presto un libro,\nseguro dejo algo entre las hojas.\nHay p\u00e1ginas que dan ganas de compartir contigo."],["Poemita","Entender lo que amas\ntambi\u00e9n es una manera\nde acercarme a ti."],["Poemita","Hoy doblar\u00eda la esquina contigo\naunque tuvi\u00e9ramos que regresar\nsolo por estirar el paseo."],["Poemita","Que el sol te encuentre a gusto,\nque la noche te encuentre tranquila\ny que mis besos te encuentren pronto."],["Poemita","Tener ganas de verte\nes sonre\u00edr por adelantado\npor algo que todav\u00eda no pasa."],["Poemita","Mishell, entre tantas cosas grandes,\nyo te quiero para las sencillas.\nHasta para elegir d\u00f3nde sentarnos."],["Poemita","Muy cerquita de la risa\nte asoma una mirada preciosa.\nAh\u00ed me quedar\u00eda yo un buen rato."],["Poemita","C\u00f3mo me gustar\u00eda llevarte algo rico\ny descubrir, con el primer bocado,\nque acert\u00e9 con el antojo."],["Poemita","Ese lugar donde uno suelta los hombros\ny por fin respira con calma.\nAs\u00ed quisiera que se sintiera mi amor para ti."],["Poemita","Se fue la \u00faltima l\u00ednea de la hoja.\nMenos mal que el cari\u00f1o\ntambi\u00e9n se puede decir por los m\u00e1rgenes."],["Poemita","Imagino un \u00e1lbum\ncon espacio de sobra\npara todos tus d\u00edas contentos por venir."],["Poemita","Voy juntando cari\u00f1o\npara el pr\u00f3ximo abrazo.\nYa te imaginar\u00e1s el apret\u00f3n."],["Poemita","Que un rayito de sol te alcance\njusto cuando tengas fr\u00edo.\nY que yo est\u00e9 cerca para taparte despu\u00e9s."],["Poemita","Mis palabras aprenden a bailar\ncada vez que las imagino\nllegando hasta tus ojos."],["Poemita","Ser\u00eda bonito conocernos de viejitos\ny reconocer la misma ternura\ndetr\u00e1s de una risa distinta."],["Poemita","Cuando me ves con cari\u00f1o\nsiento que puedo quedarme tal cual soy.\nEse descanso te lo agradezco mucho."],["Poemita","Qu\u00e9 generosa la vida\nal dejarme conocer\ntu forma particular de alegrarte."],["Poemita","Te escuchar\u00eda con la atenci\u00f3n\nde quien oye la parte preferida\nde una canci\u00f3n por primera vez."],["Poemita","Quiero poder contar mis d\u00edas\npor las cosas bonitas que disfrutamos\ny las dif\u00edciles que aprendimos a hablar."],["Poemita","Antes de terminar de escribir\nya me puse a pensar\nsi este besito te llegar\u00e1 a tiempo para el desayuno."],["Poemita","Hay palabras que contigo tienen gracia nueva.\n\u00abVen\u00bb, por ejemplo.\nTan chiquita y mira lo que consigue."],["Poemita","Si me dejaras decorar una tarde,\nle pondr\u00eda brisa suave,\nluz bonita y una sillita para ti."],["Poemita","Deja que te mire\nun segundito m\u00e1s.\nA veces me cuesta creer la suerte que tengo."],["Poemita","El d\u00eda puede salir regular\ny aun as\u00ed traer un momento hermoso.\nOjal\u00e1 este papelito te acerque uno."],["Poemita","Mi sonrisa se parece a m\u00ed\nhasta que apareces t\u00fa.\nEntonces me delata completito."],["Poemita","Quiero ser\nel que se fija en aquello\nque a ti te importa aunque parezca peque\u00f1o."],["Poemita","Ya me veo contento\nsolo porque t\u00fa\nconseguiste algo que deseabas hace tiempo."],["Poemita","Me faltan versos largos\npara hablar de todo lo que admiro.\nEmpezar\u00eda por lo linda que eres conmigo."],["Poemita","Ac\u00e9rcame tu mundo\nen el orden que t\u00fa quieras.\nMe interesa cada cosa que me dejes conocer."],["Poemita","Ojal\u00e1 pudiera ahorrarte unos pasos\ncon solo acercarte una silla.\nEl amor tambi\u00e9n puede hacer cosas as\u00ed de simples."],["Poemita","Si mi d\u00eda tuviera un jard\u00edn,\npensar en ti\nser\u00eda salir un momentito a respirar."],["Poemita","Nunca termino de decirlo\nde todas las maneras que quiero.\nQu\u00e9 linda eres, coraz\u00f3n."],["Poemita","La distancia de una silla a otra\na veces se arregla\ncon solo alargar la mano."],["Poemita","Te regalar\u00eda un rato sin pendientes\npara que hicieras eso\nque siempre dejas para despu\u00e9s."],["Poemita","Habr\u00e1 otros cielos m\u00e1s azules.\nYo elegir\u00eda el que tengamos encima\ncuando estemos caminando juntos."],["Poemita","El papel tiene dos lados.\nEn este digo que te amo.\nEn el otro ya estar\u00eda preparando el siguiente beso."],["Poemita","Dibujar\u00eda una flechita\ndesde donde termina este verso\nhasta tu mejilla. Es un beso."],["Poemita","A ti te quedan bien\ntodas esas ganas tuyas\nde ver qu\u00e9 m\u00e1s puedes hacer en la vida."],["Poemita","Un abrazo puede ser breve\ny aun as\u00ed acompa\u00f1arme\nmucho despu\u00e9s de soltar tus manos."],["Poemita","Si nos alcanzara la tarde para una sola cosa,\nyo pedir\u00eda mirarte cerca\nmientras me cuentas c\u00f3mo est\u00e1s."],["Poemita","Hay un mont\u00f3n de ternura\nen esa costumbre peque\u00f1ita\nde querer saber si llegaste bien."],["Poemita","Me dan ganas de cuidar\nel espacio en el que t\u00fa\nte animas a decir lo que sientes."],["Poemita","Escribirte un poema se parece\na caminar para verte.\nCada l\u00ednea me va acercando un poco."],["Poemita","Qu\u00e9 bonito ser\u00e1 alg\u00fan d\u00eda\npoder se\u00f1alar algo nuestro\ny decir \u00abmira todo lo que hicimos juntos\u00bb."],["Poemita","Se me hacen cortos los saludos.\nYo quisiera decir en un \u00abhola\u00bb\ntodas las ganas que ten\u00eda de encontrarte."],["Poemita","No s\u00e9 qu\u00e9 forma tendr\u00eda la alegr\u00eda.\nYo la dibujar\u00eda con tu sonrisa\ny seguro se entiende."],["Poemita","Puedo querer tus d\u00edas buenos\ny tambi\u00e9n los aburridos.\nMe gusta la vida que vive la chica que amo."],["Poemita","A ti, bonita,\nte guardar\u00eda la parte del paseo\ndonde se abre de pronto una buena vista."],["Poemita","Qu\u00e9 manera tan tuya\nde volverme tierno\nsin pedirme siquiera una palabra."],["Poemita","Cuando me pongo a pensar en ti,\ntodo lo dem\u00e1s sigue.\nSoy yo el que se queda un ratito sonriendo."],["Poemita","Quisiera que se me diera bien\nregalarte justo esa palabra\nque haga m\u00e1s liviano un momento dif\u00edcil."],["Poemita","De camino a donde vayas\nll\u00e9vate esta idea.\nHay alguien muy contento de que existas."],["Poemita","Le quiero hacer una fiesta\na ese brillo de tus ojos\ncuando algo sale como deseabas."],["Poemita","Qu\u00e9 falta me hacen a veces\ndos minutos de tu compa\u00f1\u00eda\npara acomodar un d\u00eda entero."],["Poemita","Este cari\u00f1o por ti\nme ense\u00f1a a mirar despacio.\nAlgunas cosas bonitas se ven reci\u00e9n as\u00ed."],["Poemita","Si alguna hoja se soltara de mi cuaderno,\nojal\u00e1 fuera a dar a tus manos.\nDe todas formas seguro habla de ti."],["Poemita","Quedarse en paz despu\u00e9s de hablar\nes una forma preciosa\nde saber que nos estamos cuidando."],["Poemita","Tambi\u00e9n es amor\nbajarle un poquito a la m\u00fasica\npara escuchar lo que ibas a decir."],["Poemita","A tu risa le viene bien el eco.\nSi vuelve hacia m\u00ed,\nme alegra el d\u00eda dos veces."],["Poemita","No necesito hacer algo enorme\npara saber cu\u00e1nto me importas.\nMe basta notar cu\u00e1nto me importa tu d\u00eda."],["Poemita","Qu\u00e9 belleza que seas\nla persona a la que puedo decirle\n\u00abmira qu\u00e9 linda la luna\u00bb y ya."],["Poemita","Este pedacito de verso\nte lo dejo tibio.\nLo tuve un buen rato cerquita del coraz\u00f3n."],["Poemita","Entre todas mis maneras de quererte\nme gusta especialmente\ncuando consigo hacerte sentir escuchada."],["Poemita","Si el cielo se pusiera rosado ahorita,\nmi primer impulso ser\u00eda\nbuscarte para que lo veas tambi\u00e9n."],["Poemita","Quisiera escribirte un poquito de calma\npara que la leas sin esfuerzo\ncomo quien se sienta a la sombra."],["Poemita","Sonre\u00edr por ti\nes de esas cosas bonitas\nque me pasan hasta estando solo."],["Poemita","Cuando tengas algo bueno entre manos,\nme gustar\u00eda verte la cara\nantes de que me lo cuentes."],["Poemita","Yo quisiera ser ese abrazo\nque te deja los hombros ligeros\ny el \u00e1nimo algo m\u00e1s bonito."],["Poemita","Al final de un d\u00eda largo\nte ofrecer\u00eda mi lugar m\u00e1s c\u00f3modo.\nY me sentar\u00eda cerquita de ese lugar."],["Poemita","Volver a verte suena sencillo.\nA m\u00ed se me acelera el pecho\ncon solo pensarlo."],["Poemita","Me aprender\u00eda tus gestos de a poquito\ncomo se aprende una canci\u00f3n bonita,\nde tanto disfrutarla."],["Poemita","Para decir \u00abte quiero\u00bb\npodr\u00eda acercarte la mitad m\u00e1s rica\nde lo que me estoy comiendo."],["Poemita","Un ratito a tu lado\nme alcanzar\u00eda para saberlo.\nAqu\u00ed estoy a gusto."],["Poemita","Aun si el d\u00eda pasa volando,\nquiero acordarme de hacerte\nal menos una pregunta con cari\u00f1o."],["Poemita","Escribo este poema con los ojos abiertos.\nAs\u00ed puedo imaginarte\nleyendo la \u00faltima l\u00ednea."],["Poemita","Conocerte me dej\u00f3 algo lindo.\nAhora cuando pienso en la ternura\ntambi\u00e9n pienso en una persona."],["Poemita","Un deseo peque\u00f1o, mi bonita.\nQue hoy te guste tanto la vida\ncomo a m\u00ed me gusta verte disfrutarla."],["Poemita","No te cambiar\u00eda ni el modo\nen que eliges tus palabras.\nMe gusta que seas precisamente t\u00fa la que me habla."],["Poemita","En alg\u00fan punto de esta l\u00ednea\nespero que sientas\nque te estoy hablando bien cerquita."],["Poemita","Me dar\u00eda risa vernos\ntratando de entrar los dos bajo un paraguas.\nYo feliz de mojarme un hombro por ti."],["Poemita","Me gustar\u00eda escribir al pie de tus alegr\u00edas\nuna frase de mi pu\u00f1o y letra.\nQu\u00e9 orgulloso estoy de ti."],["Poemita","Si este papel durara un instante,\naprovechar\u00eda el tiempo\npara decirte que te quiero much\u00edsimo."],["Poemita","Tengo algo nuevo para darte\nincluso despu\u00e9s de muchos besos.\nEl que todav\u00eda no te di hoy."],["Poemita","Qu\u00e9 cosa m\u00e1s dulce\nser el motivo\nde que alguien te pregunte por qu\u00e9 sonr\u00edes."],["Poemita","Tal vez pase una mariposa\ny t\u00fa te detengas a mirarla.\nYo me detendr\u00eda tambi\u00e9n, para mirarte a ti."],["Poemita","Me gusta que quepan\ntanto amor y tanta risa\nen el mismo ratito contigo."],["Poemita","Mirar por la ventana distra\u00eddo\ntambi\u00e9n tiene su lado rom\u00e1ntico.\nA veces lo que estoy viendo eres t\u00fa en mis planes."],["Poemita","En tus d\u00edas de dudas\nquisiera tenerte a mano\nun recuerdo de todo lo que ya pudiste hacer."],["Poemita","Qu\u00e9 bonita esa libertad\nde poder hacer una tonter\u00eda\ny re\u00edrnos sin tener que explicarla."],["Poemita","Cuando lea algo hermoso,\nquiero dejar una marquita\ndonde comiencen las ganas de ense\u00f1\u00e1rtelo."],["Poemita","A veces la alegr\u00eda habla bajito.\nAs\u00ed me pasa al pensar\nqu\u00e9 bien que t\u00fa y yo coincidimos."],["Poemita","Si me encontraras callado despu\u00e9s de un beso,\ndale un segundo a mi voz.\nTodav\u00eda estar\u00eda disfrut\u00e1ndolo."],["Poemita","Que siempre haya en tu semana\nun huequito de tiempo\ndonde nadie te apure y t\u00fa seas feliz."],["Poemita","Yo te escribir\u00eda en letra grande\nlo que a veces digo con timidez.\nMe encanta estar enamorado de ti."],["Poemita","Me basta o\u00edrte decir mi nombre.\nTiene las mismas letras de siempre,\npero contigo s\u00ed me dan ganas de o\u00edrlo otra vez."],["Poemita","Agradezco cada pedacito de confianza\ncon el que me haces\nun lugarcito en tu vida."],["Poemita","M\u00e1gico me parece\nque t\u00fa puedas estar leyendo\nalgo que hace un rato estaba solo en mi coraz\u00f3n."],["Poemita","Puede llover todo el camino.\nMe seguir\u00eda gustando salir\nsi al final del camino est\u00e1s t\u00fa."],["Poemita","Me gustar\u00eda aprender\ncu\u00e1ndo te viene bien una palabra\ny cu\u00e1ndo prefieres que te abrace."],["Poemita","A tus alegr\u00edas les quedar\u00eda bien\nuna foto donde salgas como eres,\ntan metida en el momento que olvides la c\u00e1mara."],["Poemita","Te quiero incluso cuando el idioma\nse me queda chiquito\ny solo encuentro c\u00f3mo decirte \u00abmi amor\u00bb."],["Poemita","Quisiera pasar los dedos\npor las arruguitas de nuestras manos\ndespu\u00e9s de muchos a\u00f1os de acompa\u00f1arnos."],["Poemita","No todos los momentos necesitan foto.\nAlgunos los guardar\u00eda\nprest\u00e1ndote de veras toda mi atenci\u00f3n."],["Poemita","Y si la vida se pone bonita,\nqu\u00e9 gusto poder volver la cara\ny decirte \u00abmira esto, amor\u00bb."],["Poemita","Yo te har\u00eda un dibujo sencillo.\nDos personas sentadas juntas.\nA veces mi idea de felicidad tiene pocos detalles."],["Poemita","Me gustas en esta frase,\nen lo que so\u00f1amos\ny en la vida de verdad, que es donde m\u00e1s."],["Poemita","Quiero seguir teni\u00e9ndote curiosidad\ncuando ya me sepa\ntu manera de pedir otro abrazo."],["Poemita","Bajo un cielo bien clarito\npodr\u00eda cerrar mis ojos un momento.\nPara saberte cerca tambi\u00e9n tengo mi mano."],["Poemita","Que el primer sorbo de algo rico\nte regale esa pausa\nque yo te dar\u00eda en un abrazo."],["Poemita","Qu\u00e9 afortunado me siento\ncuando pienso que hay algo\nque solo t\u00fa y yo llamamos nuestro."],["Poemita","Gu\u00e1rdame uno de tus abrazos.\nYo guardo el ratito de silencio\npara disfrutarlo bien."],["Poemita","Si el tiempo se dejara estirar,\nlo agarrar\u00edamos de dos esquinas\njusto antes de despedirnos."],["Poemita","A veces sue\u00f1o despierto con un beso\ny de paso se me arregla la cara.\nTu culpa, coraz\u00f3n."],["Poemita","Me hace ilusi\u00f3n conocer\nla pr\u00f3xima cosa peque\u00f1a\nque se te ocurra compartir conmigo."],["Poemita","Te escuchar\u00eda con todo el cuerpo,\nde esos momentos en que uno\nhasta se inclina para o\u00edr mejor."],["Poemita","Podr\u00eda inventar mundos enteros.\nMe gusta m\u00e1s este,\ndonde por suerte s\u00ed existes."],["Poemita","Quererte me sale en plural.\nVeo algo que me gusta\ny enseguida pienso que podr\u00edamos ir."],["Poemita","Te tengo tanta ternura\nque hasta al escribir tu nombre\nme dan ganas de dibujar algo bonito al lado."],["Poemita","Qu\u00e9 hermoso ser\u00eda\nllegar contigo a una edad\nen que ya ni recordemos nuestro primer chiste."],["Poemita","Brindar\u00eda por ti\nhasta con un vaso de agua.\nEl motivo igual me sobra."],["Poemita","Imagino lo bonito que ser\u00eda\nquedarnos sentados al aire libre\nhasta que parpadee la primera estrella."],["Poemita","Hay alegr\u00edas para guardar en secreto.\nLa m\u00eda se me escapa\ncada vez que me preguntan por ti."],["Poemita","La vida de todos los d\u00edas\nme parece un mejor regalo\nsi puedo compartirte al menos un pedacito."],["Poemita","Quisiera que me saliera muy bien\nesa magia sencillita\nde que se te pase el fr\u00edo entre mis brazos."],["Poemita","Mi forma favorita de esperarte\nser\u00eda pensar qu\u00e9 te voy a decir\ny olvidarlo todo cuando aparezcas."],["Poemita","Yo te quiero con esa suavidad\ncon la que se sostiene\nla mano de alguien que est\u00e1 por dormirse."],["Poemita","No s\u00e9 si existe un verso perfecto.\nCon que entiendas que te amo\nel m\u00edo ya hizo lo suyo."],["Poemita","Si ma\u00f1ana volviera a elegir\na qui\u00e9n mandarle una flor sin motivo,\nya sabes a nombre de qui\u00e9n saldr\u00eda."],["Poemita","Con este poema van mis ganas\nde encontrarte de buen \u00e1nimo.\nY si te encuentra cansada, que te haga compa\u00f1\u00eda igual."],["Un cari\u00f1o","Mishell, si hoy tienes ganas de celebrar una cosita que a los dem\u00e1s les parece m\u00ednima, cu\u00e9ntame. A m\u00ed s\u00ed me importa."],["Un cari\u00f1o","Te tengo un cari\u00f1o que se me nota hasta cuando intento decir tu nombre con toda la seriedad del mundo."],["Un cari\u00f1o","Mi parte favorita de preguntarte c\u00f3mo est\u00e1s es que la respuesta la das t\u00fa, con tus palabras y a tu ritmo."],["Un cari\u00f1o","A tu lado puedo ser el chico que a veces tarda un poco en entender el chiste. Gracias por esperarme la risa."],["Un cari\u00f1o","Ojal\u00e1 tengas un d\u00eda de esos en los que al volver a casa todav\u00eda te quedan ganas de cantar."],["Un cari\u00f1o","Te mando un beso sin motivo especial. Qu\u00e9 buena costumbre ser\u00eda esa, \u00bfno?"],["Un cari\u00f1o","Hay algo bien bonito en poder decirte \u00abme equivoqu\u00e9\u00bb y saber que podemos conversar."],["Un cari\u00f1o","Si te sale bien eso que est\u00e1s intentando, voy a estar contento por ti. Y si toca volver a empezar, igual aqu\u00ed me tienes."],["Un cari\u00f1o","Me da ternura que en un mundo tan grande me sepa un mont\u00f3n de maneras de llamarte solo a ti."],["Un cari\u00f1o","Quisiera que alguna vez te llegue de vuelta todo el cuidado que t\u00fa le pones a quererme."],["Un cari\u00f1o","Me haces bien de una forma sencilla. Me acuerdo de que existes y se me ablanda un poquito el d\u00eda."],["Un cari\u00f1o","Si un d\u00eda dudo entre darte un consejo o un abrazo, recu\u00e9rdame que puedo preguntarte cu\u00e1l quieres."],["Un cari\u00f1o","Para m\u00ed, conocerte tambi\u00e9n es dejar que cambies de opini\u00f3n tantas veces como necesites."],["Un cari\u00f1o","Te quiero cerquita de mis buenas noticias. Me hace ilusi\u00f3n que las sepas por m\u00ed."],["Un cari\u00f1o","Hoy s\u00ed tengo clar\u00edsimo qu\u00e9 me gusta de ti: toda t\u00fa. Hasta ah\u00ed lleg\u00f3 mi capacidad de elegir."],["Un cari\u00f1o","Chinita, no tengo gran discurso preparado. Nom\u00e1s me dieron ganas de decirte que me haces feliz."],["Un cari\u00f1o","Me entero de que algo te entusiasma y enseguida me entra la curiosidad. Se me pega un poquito de tu ilusi\u00f3n."],["Un cari\u00f1o","Qu\u00e9 rico es poder estar contigo sin tener que buscar algo impresionante que hacer."],["Un cari\u00f1o","Tengo una debilidad bien espec\u00edfica: verte disfrutar algo que escogiste t\u00fa misma."],["Un cari\u00f1o","Por si nadie te lo ha dicho hoy, mi bonita: puedes tomarte tu tiempo."],["Un cari\u00f1o","Gracias por hacerme un espacio en tu vida. Yo s\u00e9 que ah\u00ed tambi\u00e9n est\u00e1n tus gustos, tu gente y tus propios sue\u00f1os."],["Un cari\u00f1o","Se me ocurre que una buena tarde ser\u00eda preguntarte \u00ab\u00bfqu\u00e9 se te antoja?\u00bb y seguir ese plan."],["Un cari\u00f1o","Si alguna vez te regalo una canci\u00f3n, seguro voy a estar m\u00e1s pendiente de tu cara que de escucharla."],["Un cari\u00f1o","Quiero cuidarte hasta en eso de escoger bien la hora para hacer una broma."],["Un cari\u00f1o","Lo m\u00edo contigo empez\u00f3 a parecerme bien serio cuando hasta tus opiniones sobre cosas peque\u00f1as me dieron curiosidad."],["Un cari\u00f1o","Me gusta que podamos decir \u00abhoy mejor otro plan\u00bb y aun as\u00ed tener ganas de vernos."],["Un cari\u00f1o","Mishell, hay una versi\u00f3n de m\u00ed que sonr\u00ede apenas sabe que vas a llegar. Esa ya ni pregunta."],["Un cari\u00f1o","Una cosita, mi vida: hoy tambi\u00e9n eres digna de cari\u00f1o aunque hayas dejado mil pendientes."],["Un cari\u00f1o","Si est\u00e1s teniendo un buen d\u00eda, g\u00f3zatelo completito. Me hace bonito imaginarte as\u00ed."],["Un cari\u00f1o","A veces siento tanto cari\u00f1o por ti que me sale una frase bien chiquita. Ven ac\u00e1."],["Un cari\u00f1o","Me pregunto cu\u00e1ntas cosas tuyas me faltan por descubrir. Ojal\u00e1 sean un mont\u00f3n."],["Un cari\u00f1o","Tu punto de vista me interesa incluso cuando llegamos a conclusiones distintas. As\u00ed te conozco mejor."],["Un cari\u00f1o","Qu\u00e9 bonito ser\u00eda tener una tarde para escoger juntos una canci\u00f3n que nos guste a los dos."],["Un cari\u00f1o","Podr\u00eda intentar hacerme el dif\u00edcil, pero apenas me sonr\u00edes se me acaba el presupuesto."],["Un cari\u00f1o","No s\u00e9 c\u00f3mo estar\u00e1 tu d\u00eda ahora mismo, pero aqu\u00ed tienes un minuto en el que alguien pens\u00f3 bonito en ti."],["Un cari\u00f1o","El cari\u00f1o que te tengo cabe hasta en un \u00abav\u00edsame cuando llegues\u00bb dicho sin apurarte."],["Un cari\u00f1o","Hay algo que quiero hacer bien contigo: darme cuenta de las cosas buenas y dec\u00edrtelas a tiempo."],["Un cari\u00f1o","Te quiero cuando tienes un mont\u00f3n de cosas que decir y tambi\u00e9n cuando prefieres guardar algunas para ti."],["Un cari\u00f1o","Si hoy te compraste un gustito, imag\u00ednate que estoy al lado dici\u00e9ndote \u00abya pues, disfruta\u00bb."],["Un cari\u00f1o","T\u00fa sabes cosas de m\u00ed que me habr\u00eda dado roche contar en voz alta. Me encanta esa confianza."],["Un cari\u00f1o","Me har\u00eda feliz que un d\u00eda, al acordarte de m\u00ed, lo primero que pienses sea \u00abcon \u00e9l puedo ser yo\u00bb."],["Un cari\u00f1o","Entre tus apodos y mi poca capacidad para ponerme serio, un saludo nuestro puede terminar en cualquier cosa."],["Un cari\u00f1o","Si me ves callado mir\u00e1ndote, a veces la explicaci\u00f3n m\u00e1s sencilla es la correcta. Me gustas."],["Un cari\u00f1o","Tu nombre en mi cabeza ya tiene hasta tonito. Mishell, as\u00ed, con sonrisa al final."],["Un cari\u00f1o","Hay momentos en que me gustar\u00eda acercarte una silla y quedarme escuchando c\u00f3mo llegaste a pensar lo que piensas."],["Un cari\u00f1o","Me gusta quererte tambi\u00e9n en lo pr\u00e1ctico. Si algo pesa mucho, dame un ladito."],["Un cari\u00f1o","Qu\u00e9 suerte la m\u00eda de poder preguntarte qu\u00e9 te hace ilusi\u00f3n y escuchar la respuesta directamente de ti."],["Un cari\u00f1o","Ojal\u00e1 hoy te toque re\u00edrte con tantas ganas que necesites un ratito para explicar de qu\u00e9 te re\u00edas."],["Un cari\u00f1o","Si ma\u00f1ana te interesara algo completamente nuevo, me encantar\u00eda que me dieras una clase para principiantes."],["Un cari\u00f1o","T\u00fa mereces que te quieran con cuidado. Me importa aprender lo que eso significa para ti."],["Un cari\u00f1o","Mishell, me encanta que seas la protagonista de tu propia vida y que yo pueda aparecer de invitado con besitos."],["Un cari\u00f1o","Hoy me dieron unas ganas bien concretas de sentarme a tu costado y que se nos vaya la tarde ah\u00ed."],["Un cari\u00f1o","Hay gente que escribe cartas largu\u00edsimas. Yo a veces llego hasta \u00abte amo\u00bb y siento que ya te lo dije completito."],["Un cari\u00f1o","Lo que sea que quieras aprender este a\u00f1o, espero poder verte orgullosa de tu primer intento."],["Un cari\u00f1o","Si pudieras verme la cara cada vez que pienso en decirte algo cursi, te reir\u00edas antes de que abra la boca."],["Un cari\u00f1o","S\u00e9 que tienes tu propia manera de hacer las cosas. A m\u00ed me gusta ir conociendo tus razones."],["Un cari\u00f1o","Chiki, por si te faltaba un besito para que la ma\u00f1ana agarre ritmo, este va por adelantado."],["Un cari\u00f1o","Me gusta que la confianza tambi\u00e9n sea eso de decir \u00abesp\u00e9rame, todav\u00eda estoy pensando\u00bb y tener tiempo de verdad."],["Un cari\u00f1o","En mi idea de una tarde perfecta hay espacio para que t\u00fa cambies el plan entero."],["Un cari\u00f1o","S\u00e9 feliz con ganas, amor. Hasta cuando la alegr\u00eda te agarre desprevenida."],["Un cari\u00f1o","Hay una pregunta que seguir\u00e9 haci\u00e9ndote aunque ya te conozca un mont\u00f3n: qu\u00e9 te har\u00eda bien hoy."],["Un cari\u00f1o","Te dar\u00eda mi pedacito favorito de una canci\u00f3n, ese que uno retrocede dos veces para escucharlo mejor."],["Un cari\u00f1o","A veces me emociono tanto por verte que cualquier otra cosa de mi agenda se queda medio aburrida al lado."],["Un cari\u00f1o","Contigo aprend\u00ed que se puede hablar bonito sin buscar una palabra dif\u00edcil. Me encantas, por ejemplo."],["Un cari\u00f1o","Qu\u00e9 dulce
