 me parece que puedas estar pensando en una cosa completamente distinta a m\u00ed y aun as\u00ed estemos juntos, c\u00f3modos."],["Un cari\u00f1o","Si te muestro algo que me dio risa, mi segunda alegr\u00eda siempre es ver si a ti tambi\u00e9n te causa."],["Un cari\u00f1o","Podr\u00eda contarte que me encantas con un mont\u00f3n de adornos, pero hasta as\u00ed, en una sola l\u00ednea, me sale con ganas."],["Un cari\u00f1o","Te quiero lo suficiente como para decirte cuando algo me importa y para escuchar cuando algo te importa a ti."],["Un cari\u00f1o","Cuando me hables de un sue\u00f1o tuyo, voy a intentar entender por qu\u00e9 te hace ilusi\u00f3n antes de ponerme a hacer planes."],["Un cari\u00f1o","A mi lado hay lugar para esa t\u00fa que todav\u00eda est\u00e1s descubriendo, mi bonita."],["Un cari\u00f1o","Qu\u00e9 buena idea fue conocerte. A veces me acuerdo de esa suerte as\u00ed, de golpe."],["Un cari\u00f1o","Te mereces un \u00abbien hecho\u00bb tambi\u00e9n por esas cosas que aprendiste a hacer y que ya todos dan por hechas."],["Un cari\u00f1o","Si un d\u00eda te mando una foto de cualquier cosa, puede que simplemente me haya dado gusto imaginar qu\u00e9 dir\u00edas t\u00fa."],["Un cari\u00f1o","Me hace ilusi\u00f3n poder presumir algo de ti y, de paso, ver c\u00f3mo intentas cambiar de tema."],["Un cari\u00f1o","Hay tardes en las que un \u00ab\u00bftienes un ratito?\u00bb tuyo ser\u00eda todo lo que andaba esperando."],["Un cari\u00f1o","No tienes que ganarte mi cari\u00f1o con un d\u00eda perfecto. Ya te quiero desde antes de que empiece la ma\u00f1ana."],["Un cari\u00f1o","Qu\u00e9 lindo ser\u00eda que alguna vez encontremos un sabor tan rico que terminemos discutiendo de broma por la \u00faltima cucharada."],["Un cari\u00f1o","Me nace desearte cosas buenas hasta en lo chiquitito. Que encuentres asiento. Que te toque la canci\u00f3n que quer\u00edas."],["Un cari\u00f1o","De todas las versiones que mostrar\u00e1s con los a\u00f1os, me ilusiona conocer hasta las que hoy ni te imaginas."],["Un cari\u00f1o","Te aviso que mi talento para mirarte con cara de enamorado no descansa los domingos."],["Un cari\u00f1o","Mi cari\u00f1o por ti tambi\u00e9n significa celebrar el rato que te separas del mundo para hacer algo que solo t\u00fa disfrutas."],["Un cari\u00f1o","Mishell, \u00bfte has fijado en lo bonito que es tener a alguien con quien decir una tonter\u00eda apenas se te ocurre?"],["Un cari\u00f1o","Me sale quererte con detalles f\u00e1ciles de perder de vista. Acordarme de preguntarte c\u00f3mo te fue es uno de ellos."],["Un cari\u00f1o","Cuando digas \u00abme dio roche, pero lo hice\u00bb, acu\u00e9rdate de que eso tambi\u00e9n se llama ser valiente."],["Un cari\u00f1o","Quiero que puedas llegar contenta y contarme todo de corrido. Si se te cruzan las ideas, yo te sigo."],["Un cari\u00f1o","Tu forma de decir las cosas merece un oyente atento. Si me distraigo, dame un codazo imaginario."],["Un cari\u00f1o","En serio, qu\u00e9 guapa eres. A veces por estar buscando un poema se me pasa decirte lo primero que pens\u00e9."],["Un cari\u00f1o","Si hubiera un d\u00eda libre extra esta semana, ya tendr\u00eda a qui\u00e9n invitar a compartirlo."],["Un cari\u00f1o","Una cosa que s\u00ed me sale sin ensayo es alegrarme de verte contenta."],["Un cari\u00f1o","Me gusta cuando puedo darte la raz\u00f3n porque me hiciste ver algo que yo no hab\u00eda considerado."],["Un cari\u00f1o","Quererte me ha vuelto m\u00e1s observador. Hasta un color bonito me hace preguntarme si te gustar\u00eda."],["Un cari\u00f1o","Por hoy te receto algo que est\u00e1 dentro de mi especialidad: un beso y otro por si acaso."],["Un cari\u00f1o","Me basta pensarte por unos segundos para acordarme de algo bueno que tengo en la vida."],["Un cari\u00f1o","A veces lo cari\u00f1oso es guardar el celular. Cuando est\u00e9s delante de m\u00ed, quiero mirarte a ti."],["Un cari\u00f1o","S\u00e9 que tienes d\u00edas con mil cosas en la cabeza. Para leer \u00abme gustas\u00bb hacen falta dos segunditos nom\u00e1s."],["Un cari\u00f1o","Que un gusto tuyo sea distinto al m\u00edo me da una raz\u00f3n nueva para preguntarte qu\u00e9 tiene de especial."],["Un cari\u00f1o","Me gustas hasta cuando todav\u00eda no te encuentro el adjetivo exacto."],["Un cari\u00f1o","Imag\u00ednate que a este papelito le doblas la esquina. Ah\u00ed te escond\u00ed un besito extra."],["Un cari\u00f1o","Tu risa debe tener permiso especial para distraerme, porque lo hace con una facilidad tremenda."],["Un cari\u00f1o","El d\u00eda que te sientas orgullosa de algo y no sepas a qui\u00e9n cont\u00e1rselo, conmigo puedes empezar desde el principio."],["Un cari\u00f1o","Mishell, me parece lindo que una persona pueda gustarme tanto y todav\u00eda darme curiosidad por lo que piensa."],["Un cari\u00f1o","Te tengo una noticia bonita que lleva tiempo siendo cierta. Me encantas."],["Un cari\u00f1o","Si hoy te toc\u00f3 empezar de cero en algo, ojal\u00e1 seas paciente con esa versi\u00f3n tuya que est\u00e1 aprendiendo."],["Un cari\u00f1o","Qu\u00e9 agradable es tener la seguridad de que podemos hablar cuando algo nos hace ilusi\u00f3n."],["Un cari\u00f1o","Me intriga imaginar cu\u00e1l ser\u00e1 el pr\u00f3ximo libro, lugar o canci\u00f3n que te va a gustar mucho."],["Un cari\u00f1o","Por mucho que disfrute de un plan contigo, verte llegar siempre se lleva un premio aparte."],["Un cari\u00f1o","Hasta en un d\u00eda ocupado me dan ganas de hacer un huequito para preguntarte qu\u00e9 tal amaneciste."],["Un cari\u00f1o","Si me preguntan c\u00f3mo eres, seguro empiezo con un \u00abay\u00bb bien sonso y reci\u00e9n despu\u00e9s encuentro las palabras."],["Un cari\u00f1o","A ti, que est\u00e1s leyendo esto: qu\u00e9 linda manera tiene la vida de dejarme llegar hasta tu pantalla."],["Un cari\u00f1o","Hay una libertad preciosa en saber que podemos cambiar de tema cinco veces y regresar al primero si nos da la gana."],["Un cari\u00f1o","Me gusta que haya decisiones tuyas que do decirlo con autoridad: hoy te quiero un mont\u00f3n."],["Un cari\u00f1o","Si te da por cantar una canci\u00f3n solo porque s\u00ed, cuenta conmigo para la parte del coro que s\u00ed me sepa."],["Un cari\u00f1o","A veces quisiera encontrarte en medio de una semana cualquiera y regalarte una tarde libre."],["Un cari\u00f1o","Que te sientas mirada con cari\u00f1o, incluso con el pelo hecho un desastre y la cabeza en otra parte."],["Un cari\u00f1o","Te sigo eligiendo para conocer las partes de m\u00ed que tardan un poco m\u00e1s en salir."],["Un cari\u00f1o","Nunca me ha parecido poca cosa que alguien te diga \u00abesto me importa\u00bb. Cuando lo digas t\u00fa, quisiera acordarme bien."],["Un cari\u00f1o","El gusto de saber de ti me cabe completito en la cara. Hasta las orejas se me ponen contentas."],["Un cari\u00f1o","Mi amor, si hoy te das un capricho rico, me reservas la descripci\u00f3n detallada para despu\u00e9s."],["Un cari\u00f1o","Hay un detalle que a menudo olvido decirte: agradezco poder ocupar un lugar en tus d\u00edas."],["Un cari\u00f1o","Si un plan no te provoca, d\u00edmelo con confianza. Yo disfruto m\u00e1s cuando en verdad te dan ganas de ir."],["Un cari\u00f1o","Te quiero con tus cosas clar\u00edsimas y con esas preguntas que todav\u00eda est\u00e1s tratando de resolver."],["Un cari\u00f1o","Tu presencia mejora mis planes incluso cuando lo \u00fanico planeado era darte los buenos d\u00edas."],["Un cari\u00f1o","Cuando te entre la duda de si eres suficiente, recuerda que no est\u00e1s rindiendo un examen para merecer cari\u00f1o."],["Un cari\u00f1o","Hoy no tengo una frase brillante. Tengo ganas genuinas de que al leer esto se te alegre un poquito la ma\u00f1ana."],["Un cari\u00f1o","Me quedo con la persona real que vas mostr\u00e1ndome, con sus d\u00edas movidos y sus ratitos de calma."],["Un cari\u00f1o","Entre tantos posibles motivos para sonre\u00edr, me parece una suerte que t\u00fa seas uno tan frecuente."],["Un cari\u00f1o","Me encanta dejarme convencer de probar algo cuando veo lo mucho que a ti te gusta."],["Un cari\u00f1o","Un jueves cualquiera tambi\u00e9n me parece una fecha preciosa para aparecer con un detalle que te guste."],["Un cari\u00f1o","Que la tarde te trate bonito, coraz\u00f3n. Y si no, me cuentas para quejarme contigo un ratito."],["Un cari\u00f1o","Qu\u00e9 gusto me da que mis palabras terminen siendo le\u00eddas por esos ojos que tanto me gustan."],["Un cari\u00f1o","Si tuviera que escoger un gesto para despedirme por hoy, ser\u00eda ese de apretar la mano un poquito m\u00e1s."],["Un cari\u00f1o","No necesito entender un tema a la primera para disfrutar que t\u00fa me lo expliques con ganas."],["Un cari\u00f1o","Te pienso con mucho cari\u00f1o hasta los d\u00edas en los que cada uno anda ocupado en lo suyo."],["Un cari\u00f1o","En mi lista de cosas bonitas de este mundo tiene que haber una p\u00e1gina entera para ti."],["Un cari\u00f1o","A ver, bizcochito, imagina un beso bien suave en tu frente. Ya, ese te lo mand\u00e9 yo."],["Un cari\u00f1o","Se me hace bonita la idea de ir descubriendo, juntos y por separado, las cosas que nos gustan."],["De m\u00ed para ti","Qu\u00e9 bonito, Mishell, que entre tanta gente que te conoce a m\u00ed me haya tocado ser el que puede decirte \u00abmi vida\u00bb."],["Un cari\u00f1o","Un d\u00eda me vas a preguntar qu\u00e9 estoy mirando tanto y te voy a decir la verdad sin hacerme el loco. A ti."],["Un cari\u00f1o","Gracias por confiarme hasta esas ideas que todav\u00eda no tienen palabras muy claras."],["Un cari\u00f1o","Aprend\u00ed que hacerte compa\u00f1\u00eda a veces significa esperar cerquita a que t\u00fa quieras empezar a hablar."],["Un cari\u00f1o","Si una semana se te hizo larga, ojal\u00e1 el pr\u00f3ximo ratito de felicidad te dure el doble."],["Un cari\u00f1o","Me gusta tu compa\u00f1\u00eda para las cosas que se recuerdan siempre y para las que se olvidan apenas pasa el d\u00eda."],["Un cari\u00f1o","Hoy est\u00e1s invitada a recibir un cumplido sin discutirlo conmigo: qu\u00e9 bonita eres, Mishell."],["Un cari\u00f1o","Ojal\u00e1 de vez en cuando te escuches con la misma ternura con la que yo escucho tu nombre."],["Un cari\u00f1o","Qu\u00e9 lindo ser\u00eda sentarnos en un sitio nuevo y decidir juntos si merece una segunda visita."],["Un cari\u00f1o","Parte de quererte es saber que hay cosas que prefieres hacer sola y alegrarme de que tengas ese espacio."],["Un cari\u00f1o","Me ilusiona encontrar la manera de sorprenderte que m\u00e1s se parezca a ti."],["Un cari\u00f1o","Hay tantas formas de ser guapa. A m\u00ed me toc\u00f3 enamorarme de la tuya."],["Un cari\u00f1o","Suelta un ratito los hombros, mi vida. Te mando un beso que puedes recibir sin parar lo que est\u00e1s haciendo."],["Un cari\u00f1o","Si me ves aparecer con una idea rar\u00edsima para una cita, te doy permiso de re\u00edrte antes de decirme que s\u00ed."],["Un cari\u00f1o","Me encanta que tu existencia en el mundo haya cambiado tanto la forma en que disfruto del m\u00edo."],["Un cari\u00f1o","Aqu\u00ed, en esta esquina del d\u00eda, alguien se qued\u00f3 pensando en lo mucho que te quiere."],["Un cari\u00f1o","A tu lado me dan ganas de tratar mejor a la gente. Creo que querer bonito tambi\u00e9n se aprende as\u00ed."],["Un cari\u00f1o","Aunque yo sea quien escribe el papelito, la sonrisa que te saque ya es toda tuya."],["Un cari\u00f1o","Si te ilusiona algo peque\u00f1o y te da verg\u00fcenza decirlo en voz alta, conmigo puedes probar bajito."],["Un cari\u00f1o","Qu\u00e9 felices me hacen las buenas noticias que empiezan con tu nombre."],["Un cari\u00f1o","El t\u00edtulo de este mensajito podr\u00eda ser tu apodo. Todo lo que viene despu\u00e9s es cari\u00f1o."],["Un cari\u00f1o","Amor, me gusta que podamos ser torpes en algo nuevo sin arruinarnos la diversi\u00f3n."],["Un cari\u00f1o","Un gusto sencillo que me gustar\u00eda darme contigo es probar dos postres distintos y hacer intercambio de cucharitas."],["Un cari\u00f1o","Cuando pienso en c\u00f3mo quiero verte, la primera respuesta es tranquila, a gusto con quien eres."],["Un cari\u00f1o","Me parece preciosa esa valent\u00eda de probar algo aun cuando todav\u00eda no sabes si te va a salir."],["Un cari\u00f1o","Mishell, tu compa\u00f1\u00eda es uno de esos gustos que en lugar de pasar de moda se vuelven costumbre buena."],["Un cari\u00f1o","Si te faltan palabras, trae las que tengas. Podemos ir armando la conversaci\u00f3n entre los dos."],["Un cari\u00f1o","Me gusta que quererte me haya vuelto m\u00e1s atento a la parte del cuento que le toca a otra persona."],["Un cari\u00f1o","No hace falta que contestes este papelito, pero sonr\u00edeme un poquito si te naci\u00f3. Me har\u00e1 ilusi\u00f3n imagin\u00e1rmelo."],["Un cari\u00f1o","Le puse tanto cari\u00f1o a esta frase que casi me quedo sin sitio para la frase. Te quiero, pues."],["Un cari\u00f1o","Un d\u00eda quisiera caminar contigo por un lugar que t\u00fa conozcas mejor que yo y dejar que seas mi gu\u00eda."],["Un cari\u00f1o","Tu forma de mirar el mundo merece espacio. Me gusta hacerme a un lado y asomarme a verla contigo."],["Un cari\u00f1o","El cari\u00f1o tambi\u00e9n me sale en un \u00abpaso por ti\u00bb cuando te provoque tener compa\u00f1\u00eda."],["Un cari\u00f1o","Por si hoy te sentiste pasada por alto, qu\u00e9date con esto: para m\u00ed es una alegr\u00eda fijarme en ti."],["Un cari\u00f1o","Me nace decirte cosas lindas cuando estoy contento, pero te las sigo creyendo hasta cuando tengo sue\u00f1o."],["Un cari\u00f1o","Una manera simple de hacerme feliz es dejarme compartir un ratito de eso que te apasiona."],["Un cari\u00f1o","Qu\u00e9 bonita palabra, enamorada. Cada vez que la uso para hablar de ti me da un poquito de orgullo."],["Un cari\u00f1o","En medio de cualquier d\u00eda normal puede aparecer la idea de ti y hacer que me ponga cari\u00f1oso de la nada."],["Un cari\u00f1o","Si el mundo te pide que vayas m\u00e1s r\u00e1pido, reserva al menos tu comida favorita para comerla tranquila."],["Un cari\u00f1o","Me divierte imaginar una competencia de inventarnos saludos rid\u00edculos. Con ese \u00abpin pon\u00bb ya me llevas ventaja."],["Un cari\u00f1o","Gracias por animarte a descubrir qu\u00e9 tal es esto de andar por la vida conmigo."],["Un cari\u00f1o","Mi bonita, hay algo en tu forma de existir que me hace querer acercarme con cuidado y quedarme un buen rato."],["Un cari\u00f1o","Que siempre encuentres una raz\u00f3n tuya para celebrar, incluso si a los dem\u00e1s les pasa desapercibida."],["Un cari\u00f1o","Qu\u00e9 bien se siente que podamos decirnos \u00abno entend\u00ed\u00bb y empezar de nuevo con paciencia."],["Un cari\u00f1o","Cuando te mires al espejo con prisa, te encargo un saludo para mi persona favorita."],["Un cari\u00f1o","Ojal\u00e1 haya momentos en que sientas el cari\u00f1o que te tengo sin que yo alcance a abrir la boca."],["Un cari\u00f1o","Si me guardas cinco minutos alg\u00fan d\u00eda, yo los cambio por cinco minutos de atenci\u00f3n completita para ti."],["Un cari\u00f1o","Hay un gusto muy particular en que unas palabras m\u00edas vayan a acompa\u00f1arte a un lugar al que yo no pude ir."],["Un cari\u00f1o","Mishell, si te sonr\u00edo cuando no ha pasado nada, a veces es que reci\u00e9n caigo en que est\u00e1s aqu\u00ed."],["Un cari\u00f1o","Cuando andes de buen humor, riega un poquito de esa alegr\u00eda por donde pases. Te queda linda."],["Un cari\u00f1o","Puedo hacer una lista enorme de cosas que me gustan de ti y aun as\u00ed olvidarme de una que me encante."],["Un cari\u00f1o","Mi deseo para ti hoy es sencillo. Que tengas algo rico que comer y alguien que te escuche si te da por conversar."],["Un cari\u00f1o","Me alegra haberme atrevido a quererte. Qu\u00e9 mont\u00f3n de cosas bonitas habr\u00eda dejado pasar."],["Un cari\u00f1o","Si ma\u00f1ana tienes ganas de ponerte muy elegante, voy a estar feliz de admirarte. Si te pones c\u00f3moda tambi\u00e9n me apunto."],["Un cari\u00f1o","Me gusta que me puedas decir \u00abd\u00e9jame intentarlo yo\u00bb y que me toque hacer barra cerquita."],["Un cari\u00f1o","Hasta tus apodos m\u00e1s chistosos se me hacen tiernos, mapache. Mira t\u00fa lo que has logrado."],["Un cari\u00f1o","Quiero hacerte sentir bienvenida cuando llegas y tranquila cuando necesitas irte."],["Un cari\u00f1o","Creo que un regalo bonito ser\u00eda darte una tarde en la que todo vaya al ritmo que te provoque."],["Un cari\u00f1o","Cuando te digo que estoy feliz por ti, en verdad me dan ganas de aplaudir como sonso."],["Un cari\u00f1o","Tu cari\u00f1o me da ganas de hablarte con m\u00e1s claridad, hasta cuando yo mismo me estoy haciendo bolas."],["Un cari\u00f1o","Mishell, un beso en la mejilla para cuando abras esto. El de la otra mejilla te lo doy en persona."],["Un cari\u00f1o","A m\u00ed me caes bien de verdad. A veces por decirte siempre cu\u00e1nto te amo me olvido de contarte tambi\u00e9n eso."],["Un cari\u00f1o","Si te toca tomar una decisi\u00f3n dif\u00edcil, me ofrezco para escucharte pensar en voz alta."],["Un cari\u00f1o","Ojal\u00e1 conozcas de ti misma algo nuevo que te guste mucho. A m\u00ed me pasa contigo seguido."],["Un cari\u00f1o","En una sala llena de gente, me emociona saber que en alg\u00fan momento puedo voltearme y encontrarte la mirada."],["Un cari\u00f1o","Qu\u00e9 bonito es tener una persona que me importe tanto en una vida que a veces pasa tan de prisa."],["Un cari\u00f1o","Quiero ser alguien con quien puedas preguntar las cosas dos veces y seguir sinti\u00e9ndote c\u00f3moda."],["Un cari\u00f1o","Si te dijera todos los apodos que pens\u00e9 para ti, f\u00e1cil terminamos bautizando hasta una panader\u00eda."],["Un cari\u00f1o","Me enternece la posibilidad de aprender algo que te gusta solo para poder compartirlo contigo."],["Un cari\u00f1o","Por alg\u00fan motivo, escribir tu nombre me hace m\u00e1s ilusi\u00f3n que escribir cualquier otra palabra de esta nota."],["Un cari\u00f1o","Qu\u00e9 rica sensaci\u00f3n la de saber que puedes tener un d\u00eda buen\u00edsimo por tus propios m\u00e9ritos y cont\u00e1rmelo despu\u00e9s."],["Un cari\u00f1o","Se\u00f1orita Mishell, queda cordialmente invitada a dejarse querer un ratito. Cu\u00e1ndo y c\u00f3mo, escoges t\u00fa."],["Un cari\u00f1o","Si est\u00e1s orgullosa de algo, di \u00ablo hice bien\u00bb con todas sus letras. Me gusta escucharte reconocer lo que haces."],["Un cari\u00f1o","Me quedar\u00eda feliz cerquita de ti viendo c\u00f3mo escoges entre dos cosas que te gustan igual."],["Un cari\u00f1o","Me encanta poder decir que conozco un poquito de esa persona tan linda que los dem\u00e1s acaban de descubrir."],["Un cari\u00f1o","Por hoy te regalo una palabra que a veces no usamos lo suficiente. Gracias."],["Un cari\u00f1o","Estar contento por alguien se siente diferente cuando ese alguien eres t\u00fa. Como si tambi\u00e9n me hubiera tocado premio."],["Un cari\u00f1o","\u00bfSabes qu\u00e9 plan suena bonito? Elegir algo por primera vez los dos y averiguar juntos si nos gusta."],["Un cari\u00f1o","Tu manera de pensar puede cambiar con los a\u00f1os y yo encantado de volver a conocerte las veces que haga falta."],["Un cari\u00f1o","Me dan ganas de quererte bien hasta en los detalles que nadie m\u00e1s llega a ver."],["Un cari\u00f1o","Chiki, por favor recibe este cumplido en mi nombre: me gustas much\u00edsimo y la paso bien contigo."],["Un cari\u00f1o","Puedes venir con dudas y sin una conclusi\u00f3n ordenadita. Yo tambi\u00e9n estoy aprendiendo sobre la marcha."],["Un cari\u00f1o","Me gustan esas alegr\u00edas tuyas que tienen poco que ver conmigo. Qu\u00e9 bonito saber que tienes un mundo tan tuyo."],["Un cari\u00f1o","Algo que quiero conservar contigo es el gusto por seguir haci\u00e9ndote preguntas, incluso despu\u00e9s de creer que ya s\u00e9 la respuesta."],["Un cari\u00f1o","De todos los lugares que podr\u00eda ocupar en un d\u00eda tuyo, con ser el motivo de una sonrisita me doy por servido."],["Un cari\u00f1o","A veces pienso que la mejor invitaci\u00f3n ser\u00eda \u00abven como est\u00e9s\u00bb y tenerte listo un sitio c\u00f3modo."],["Un cari\u00f1o","Si te dan ganas de hacer una cosa por primera vez y necesitas compa\u00f1\u00eda, mi experiencia en ser principiante es ampl\u00edsima."],["Un cari\u00f1o","Tu carita merece una buena noticia; yo por ahora te adelanto un te quiero."],["Un cari\u00f1o","Cuando diga que tengo suerte de conocerte, cr\u00e9eme. T\u00fa sabes que para otras cosas mi suerte no trabaja tanto."],["Un cari\u00f1o","Me nace cuidar lo que me cuentas, porque t\u00fa escogiste compartirlo conmigo. Ese gesto vale."],["Un cari\u00f1o","Si pudiera regalarte una habilidad, ser\u00eda que pudieras verte un segundo con el cari\u00f1o con el que te veo yo."],["Un cari\u00f1o","Sospecho que ya encontr\u00e9 mi manera favorita de gastar un papelito: escribirte algo que te haga sentir querida."],["Un cari\u00f1o","Sue\u00f1a con libertad, mi vida. Me gusta saber que tus ganas pueden llevarte m\u00e1s lejos de lo que calculas."],["Un cari\u00f1o","Que nunca nos falte paciencia para dejar que el otro termine de contar su versi\u00f3n."],["Un cari\u00f1o","Te juro que iba a ser original, pero te pens\u00e9 y me sali\u00f3 la cosa m\u00e1s cl\u00e1sica del mundo. Te amo."],["Un cari\u00f1o","Una parte de m\u00ed quiere hacerte re\u00edr y la otra quiere quedarse mir\u00e1ndote re\u00edr. Se entienden bien entre ellas."],["Un cari\u00f1o","De solo pensar en una tarde sin pendientes a tu costado ya me siento un poquito de vacaciones."],["Un cari\u00f1o","En el fondo este papelito tiene una intenci\u00f3n recontra sencilla. Que sepas que me importas."],["Un cari\u00f1o","Si me regalaran una entrada doble para un sitio bonito, se me ocurre tu nombre antes de mirar para qu\u00e9 fecha es."],["Un cari\u00f1o","Hasta cuando estoy de acuerdo contigo me interesa que me cuentes c\u00f3mo llegaste hasta esa idea."],["Un cari\u00f1o","Mi amor, que tu semana tenga m\u00e1s \u00abqu\u00e9 rico\u00bb que \u00abqu\u00e9 sue\u00f1o\u00bb. Aunque una siesta tambi\u00e9n estar\u00eda bien."],["Un cari\u00f1o","Con la cantidad de cari\u00f1o que te tengo, me falta pr\u00e1ctica para disimular. Y ganas tambi\u00e9n."],["Un cari\u00f1o","Qu\u00e9 maravilloso que el mundo se pueda recorrer de a poquitos y que en uno de esos paseos te haya encontrado."],["Un cari\u00f1o","A la parte de ti que se anima a volver a intentar le guardo un aplauso especial."],["Un cari\u00f1o","Te mandar\u00eda el mejor pedazo de una torta si este papelito supiera cargar cosas. Por ahora lleva un \u00abte adoro\u00bb."],["Un cari\u00f1o","Si alg\u00fan d\u00eda las palabras lindas te parecen pocas, espero mostrarte con hechos lo que trataba de decir."],["Un cari\u00f1o","Me imagino abriendo una ventana en una tarde fresca y pregunt\u00e1ndote desde la sala qu\u00e9 canci\u00f3n ponemos."],["Un cari\u00f1o","Si hubiera un bot\u00f3n para aparecer un ratito a tu lado, ya le habr\u00eda gastado la pintura."],["Un cari\u00f1o","Gracias por elegirme para compartir pedacitos de tu tiempo. Es de las cosas m\u00e1s lindas que alguien puede regalar."],["Un cari\u00f1o","Me gustar\u00eda que hasta en mis respuestas m\u00e1s cortitas se me note el cari\u00f1o que te tengo."],["Un cari\u00f1o","A veces se necesita bastante coraje para cambiar de rumbo. Si t\u00fa lo haces, quiero saber hacia d\u00f3nde te entusiasma mirar."],["Un cari\u00f1o","No tengo forma de meter un abrazo en una pantalla, pero s\u00ed de reservarte uno para cuando coincidamos."],["Un cari\u00f1o","Te quiero con esa mezcla de ternura y curiosidad que me da ganas de acercarme y preguntarte qu\u00e9 andas tramando."],["Un cari\u00f1o","Si me pidieras que elija una palabra para hoy, escoger\u00eda un verbo. Mimarte."],["Un cari\u00f1o","Lo bonito de pensarte es que no hace falta arreglar el cuarto ni alistarse. De pronto apareces y sonr\u00edo."],["Un cari\u00f1o","A m\u00ed me dar\u00eda gusto verte defendiendo una idea tuya con esa seguridad que te deseo siempre."],["Un cari\u00f1o","Mi vida, aparece por mis pensamientos cuando quieras. Ya sabes que ah\u00ed tienes la puerta abierta."],["Un cari\u00f1o","Cu\u00eddate mucho en esas cosas peque\u00f1as que solo t\u00fa notas. Tambi\u00e9n son parte de mi persona favorita."],["Un cari\u00f1o","Me gana la ternura cuando pienso que ahora mismo existes en un lugar del mundo, haciendo tus cosas a tu manera."],["Un cari\u00f1o","Ojal\u00e1 podamos seguir descubriendo juntos qu\u00e9 maneras de demostrar cari\u00f1o nos gustan m\u00e1s."],["Un cari\u00f1o","Te tengo tanta fe que, si un resultado se demora, me sigue haciendo ilusi\u00f3n ver qu\u00e9 har\u00e1s despu\u00e9s."],["Un cari\u00f1o","Qu\u00e9 ganas de aprender una receta contigo y poder decidir los dos que ese plato nos qued\u00f3 buenazo."],["Un cari\u00f1o","Si te digo \u00abven\u00bb, casi siempre tengo por lo menos un beso esperando detr\u00e1s de la palabra."],["Un cari\u00f1o","Mishell, que se te pegue hoy una canci\u00f3n alegre y te acompa\u00f1e mientras vas de un lugar a otro."],["Un cari\u00f1o","Todav\u00eda tengo por delante un mont\u00f3n de oportunidades para decirte qu\u00e9 importante eres. Empiezo por esta."],["Un cari\u00f1o","Qu\u00e9 linda me resultas cuando me olvido de buscar las palabras correctas y simplemente me quedo mir\u00e1ndote."],["Un cari\u00f1o","Confieso que tengo debilidad por las ideas que empiezan con \u00ab\u00bfy si vamos los dos?\u00bb."],["Un cari\u00f1o","Cuando tengas mil pendientes, puedes dejar este beso para despu\u00e9s. No vence."],["Un cari\u00f1o","Tu felicidad me interesa tanto en los d\u00edas grandes como en ese d\u00eda en el que por fin terminaste algo chiquito."],["Un cari\u00f1o","Quiero que te sientas libre de corregirme. Me importa m\u00e1s entenderte que acertar de entrada."],["Un cari\u00f1o","Si un d\u00eda se te olvida por completo este papelito, igual habr\u00e1 cumplido su prop\u00f3sito si te alegr\u00f3 el momento."],["Un cari\u00f1o","Qu\u00e9 bueno poder decirte \u00abeso me hizo acordar a ti\u00bb y saber que detr\u00e1s de la frase ya hay cari\u00f1o suficiente."],["Un cari\u00f1o","Te inventar\u00eda un premio por ser t\u00fa, pero sospecho que ser\u00eda bien parcial, mi bonita."],["Un cari\u00f1o","Cuando eres amable contigo, me alegro doble. Me gusta que trates bien a alguien a quien yo quiero tanto."],["Un cari\u00f1o","Te imagino escogiendo el lado m\u00e1s c\u00f3modo del sill\u00f3n y se me antoja sentarme justo al otro ladito."],["Un cari\u00f1o","Para m\u00ed es una alegr\u00eda conocer a la Mishell de carne y hueso, la que tiene derecho a amanecer de cualquier humor."],["Un cari\u00f1o","Si se me escapa una risita al verte, casi seguro es de puro gusto."],["Un cari\u00f1o","Cuento con una certeza para esos d\u00edas en que todo anda un poco incierto. Me encanta tenerte en mi vida."],["Un cari\u00f1o","Amor, qu\u00e9 lindo ser\u00eda aprender de grandes una cosa que hoy nos parezca imposible y recordar el primer intento."],["Un cari\u00f1o","Te guardo una invitaci\u00f3n para cuando te provoque salir a dar una vuelta sin m\u00e1s compromiso que elegir algo rico en el camino."],["Un cari\u00f1o","Una de mis cosas favoritas de enamorarme de ti es que sigo encontrando motivos nuevos para ponerme contento."],["Un cari\u00f1o","Tu opini\u00f3n tiene sitio en mis decisiones cuando algo nos toca a los dos. Me gusta que podamos escoger juntos."],["Un cari\u00f1o","Si un d\u00eda sientes que avanzaste solo un poquito, m\u00edralo bien. Ese pedacito tambi\u00e9n lo hiciste t\u00fa."],["Un cari\u00f1o","Lo m\u00e1s bonito que te puedo prometer hoy es atenci\u00f3n de verdad cuando vengas a contarme algo tuyo."],["Un cari\u00f1o","Hasta una palabra sencilla como \u00abhola\u00bb suena m\u00e1s bonita cuando s\u00e9 que llega de ti."],["Un cari\u00f1o","Me sale imaginarte feliz y me dan ganas de contribuir aunque sea con el detalle m\u00e1s peque\u00f1o."],["Un cari\u00f1o","Qu\u00e9 gusto darme cuenta de que adem\u00e1s de querer besarte me dan ganas de preguntarte qu\u00e9 opinas del mundo."],["Un cari\u00f1o","Si te hago una broma mal\u00edsima, puedes cobrarme un beso por da\u00f1os a tu sentido del humor."],["Un cari\u00f1o","Mishell, qu\u00e9 bonito que la persona con la que quiero compartir las cosas sea tambi\u00e9n quien me despierta tantas ganas de descubrirlas."],["Un cari\u00f1o","Hasta hoy me sigue pareciendo incre\u00edble que tu nombre termine apareciendo en tantas sonrisas m\u00edas."],["Un cari\u00f1o","Si quieres traer a la conversaci\u00f3n algo que te dio vueltas toda la semana, yo te hago espacio en la m\u00eda."],["Un cari\u00f1o","Te mando un cari\u00f1o de esos que llegan despacito y se quedan el rato que necesites."],["Un cari\u00f1o","Hay cosas que se entienden solo de verlas de cerca. Yo quisiera aprender as\u00ed todo lo que te importa."],["Un cari\u00f1o","Que hoy te alcance el tiempo para eso que ibas postergando y que en el fondo te hace tan feliz."],["Un cari\u00f1o","Mi chinita, siempre que te quede la duda entre darme un besito o dos, podemos arreglarlo a mi favor."],["Un cari\u00f1o","Un d\u00eda te voy a pedir que escojas t\u00fa mi ropa para salir. Tengo curiosidad por conocer tu veredicto."],["Un cari\u00f1o","Me hace ilusi\u00f3n que podamos coincidir en lo importante y todav\u00eda sorprendernos en mil detalles."],["Un cari\u00f1o","Si la vida se pone interesante esta tarde, me alegrar\u00e1 enterarme. Si estuvo aburrid\u00edsima, tambi\u00e9n me interesa saber de ti."],["Un cari\u00f1o","Hay una forma muy tuya de llamarme que me hace voltear con una sonrisa incluso en la imaginaci\u00f3n."],["Un cari\u00f1o","Para ti tengo cari\u00f1o del que se demuestra prestando atenci\u00f3n y tambi\u00e9n del que se distrae mir\u00e1ndote."],["Un cari\u00f1o","Me gustas tanto que hasta me animo a escribir versos sin tener ning\u00fan t\u00edtulo oficial de poeta."],["Un cari\u00f1o","Si\u00e9ntete orgullosa de las veces que te animaste a pedir ayuda. Escoger compa\u00f1\u00eda tambi\u00e9n es saber cuidarse."],["Un cari\u00f1o","Mi parte m\u00e1s cursi tiene tu nombre agendado como contacto de emergencia."],["Un cari\u00f1o","Me parece buen\u00edsimo que tengas gustos muy tuyos. Si todos fueran como los m\u00edos, \u00bfqui\u00e9n me mostrar\u00eda algo distinto?"],["Un cari\u00f1o","Te dejar\u00eda escoger la pel\u00edcula y me guardar\u00eda el derecho de estirar la mano en busca de la tuya."],["Un cari\u00f1o","Ojal\u00e1 estas palabras te agarren tranquila y, si te encuentran corriendo, que al menos te den un segundo bonito."],["Un cari\u00f1o","A ti s\u00ed te volver\u00eda a hacer la misma pregunta solo para o\u00edr c\u00f3mo cambi\u00f3 tu respuesta con los a\u00f1os."],["Un cari\u00f1o","Mi bonita, ac\u00e1 tienes un cumplido para guardar en caso de emergencia: me encanta hasta c\u00f3mo dices mi nombre."],["Un cari\u00f1o","Me encantar\u00eda descubrir qu\u00e9 cosa vas a recordar con una sonrisa cuando pienses en este a\u00f1o."],["Un cari\u00f1o","Si alguna vez te resulta m\u00e1s f\u00e1cil explicarte por escrito, yo feliz de leerte con calma."],["Un cari\u00f1o","Amor, siempre he pensado que algo rico sabe mejor si puedo mirarte y preguntarte \u00ab\u00bfest\u00e1 bueno, no?\u00bb."],["Un cari\u00f1o","Que puedas ser sincera conmigo es una de esas cosas que quiero cuidar bien, hasta en los desacuerdos chiquitos."],["Un cari\u00f1o","Te quiero con todas esas partes tuyas que apenas est\u00e1s aprendiendo a nombrar."],["Un cari\u00f1o","Puedo quererte sentado en la sala, en el camino o en mitad de una cola largu\u00edsima. Para eso s\u00ed que soy eficiente."],["Un cari\u00f1o","Lo que m\u00e1s agradezco de poder decirte \u00abmi vida\u00bb es que sepas que detr\u00e1s del apodo hay una persona que te quiere."],["Un cari\u00f1o","Ayer ya me parec\u00edas preciosa y, mira t\u00fa, hoy tampoco me salen argumentos en contra."],["Un cari\u00f1o","Al pr\u00f3ximo abrazo le tengo un encargo: que te enteres de lo contento que estoy de verte."],["Un cari\u00f1o","Tu forma de ser se me hace un buen lugar para quedarme conversando."],["Un cari\u00f1o","Si te dieran a elegir un d\u00eda para repetir, me encantar\u00eda que me cuentes cu\u00e1l y por qu\u00e9. Seguro descubro algo bonito de ti."],["Un cari\u00f1o","Qu\u00e9 ganas de pasear por una librer\u00eda contigo y adivinar qu\u00e9 portada te har\u00eda detenerte."],["Un cari\u00f1o","No importa si hoy llegaste a todas tus metas o solo a tu cama. Ah\u00ed tambi\u00e9n te alcanza mi cari\u00f1o."],["Un cari\u00f1o","Prometo tratar con respeto esos detalles que para ti tienen un significado que yo todav\u00eda no alcanzo a entender."],["Un cari\u00f1o","Por si abriste este papelito al final de un d\u00eda cualquiera: alguien se alegra de que seas t\u00fa, exactamente t\u00fa. Ese alguien soy yo."],["De m\u00ed para ti","Tu nombre suena bonito hasta en mi letra fea."],["De m\u00ed para ti","Quisiera saber qu\u00e9 cara pones al leer que me encantas. Bueno, ya te lo dije. Ahora s\u00ed me dio curiosidad."],["De m\u00ed para ti","Me gusta la persona que soy cuando te quiero bien."],["De m\u00ed para ti","Si hoy me regalaran diez minutos contigo, perder\u00eda nueve mir\u00e1ndote y el \u00faltimo pidi\u00e9ndote otros diez."],["De m\u00ed para ti","Voy a tener que aprender a dibujar. Hay una sonrisa tuya que con palabras no me sale."],["De m\u00ed para ti","Me encanta que tengas ideas que a m\u00ed jam\u00e1s se me habr\u00edan ocurrido. Qu\u00e9 aburrido si los dos pens\u00e1ramos igualito."],["De m\u00ed para ti","En un d\u00eda con mil cosas pendientes, quererte es lo \u00fanico que hago sin mirar mi lista."],["De m\u00ed para ti","Mi bonita, me sali\u00f3 un \u00abte amo\u00bb en mitad de otra cosa. Lo vine a dejar ac\u00e1 para que no se pierda."],["De m\u00ed para ti","Hasta para hacerme el distra\u00eddo tengo que concentrarme mucho si est\u00e1s cerca."],["De m\u00ed ecibir cari\u00f1o. Me importa saber si el beso te lleg\u00f3."],["De m\u00ed para ti","Mi idea de presumir ser\u00eda se\u00f1alarte discretamente desde lejos y decir \u00abella es\u00bb con una sonrisa nada discreta."],["De m\u00ed para ti","Al final, una gran parte de mi cari\u00f1o consiste en preguntarme qu\u00e9 te har\u00eda sonre\u00edr a ti."],["De m\u00ed para ti","Si nuestros planes cambian de fecha, yo te sigo guardando las ganas."],["De m\u00ed para ti","C\u00f3mo quisiera escuchar lo que pensaste la primera vez que te diste cuenta de que me gustabas."],["De m\u00ed para ti","Yo te dedicar\u00eda una canci\u00f3n bailable y despu\u00e9s tendr\u00eda que admitir que no s\u00e9 qu\u00e9 hacer con los pies."],["De m\u00ed para ti","Me gusta que me hagas pensar. Salgo de algunas conversaciones contigo con una pregunta mejor que la que ten\u00eda."],["De m\u00ed para ti","Cuando me preguntan qu\u00e9 le veo a ella, pienso \u00abqu\u00e9 pena que no la puedas conocer como yo\u00bb."],["De m\u00ed para ti","Si una tarde te falta compa\u00f1\u00eda para un mandado aburrido, consid\u00e9rame candidato. Tengo experiencia caminando y queri\u00e9ndote."],["De m\u00ed para ti","Me gustar\u00eda regalarte algo tan tuyo que al verlo digas \u00abc\u00f3mo sab\u00eda\u00bb. Esa carita de sorpresa valdr\u00eda oro."],["De m\u00ed para ti","El cari\u00f1o tambi\u00e9n es preguntarte si prefieres la ventana abierta antes de cerrarla porque a m\u00ed me dio fr\u00edo."],["De m\u00ed para ti","Tus buenas noticias me llegan con efecto doble: primero me alegro por ti y despu\u00e9s me alegro de verte alegre."],["De m\u00ed para ti","Hola, vida. Me acord\u00e9 de que te puedo escribir solo porque s\u00ed, as\u00ed que vine a decirte que te adoro."],["De m\u00ed para ti","Hasta tu derecho a cambiar de opini\u00f3n me parece algo que vale la pena cuidar."],["De m\u00ed para ti","Qu\u00e9 bonito ser\u00eda escuchar una canci\u00f3n a\u00f1os despu\u00e9s y que los dos queramos buscar al otro para compartirla."],["De m\u00ed para ti","Me puede gustar mucho un paisaje y aun as\u00ed distraerme pensando en la cara que pondr\u00edas al verlo."],["De m\u00ed para ti","Me encanta imaginar el segundo exacto en que una notita m\u00eda termina en tus manos."],["De m\u00ed para ti","Hay una ausencia tuya que conozco bien: ese huequito al costado cuando algo da risa y te buscar\u00eda con la mirada."],["De m\u00ed para ti","Yo, que a veces dudo hasta antes de elegir un postre, contigo tengo ganas clar\u00edsimas de quedarme."],["De m\u00ed para ti","Si una cosa te da ilusi\u00f3n aunque parezca peque\u00f1a, quiero conocerla. Lo importante es c\u00f3mo se te ilumina la cara."],["De m\u00ed para ti","Alg\u00fan d\u00eda podemos releer estos papelitos. Si me da verg\u00fcenza lo cursi que fui, igual va a valer la pena."],["De m\u00ed para ti","A tu alrededor se me olvida que estaba tratando de parecer interesante. Ah\u00ed empiezo a pasarla de verdad bonito."],["De m\u00ed para ti","Una carta para mi amorcito: ac\u00e1 me tienes, orgulloso de ti, incluso en lo que todav\u00eda est\u00e1s aprendiendo."],["De m\u00ed para ti","Qu\u00e9 ganas de tener a la mano el beso exacto que necesitas despu\u00e9s de un d\u00eda largu\u00edsimo."],["De m\u00ed para ti","Si a veces me quedo mir\u00e1ndote, d\u00e9jame tantito. Estoy teniendo uno de esos momentos que despu\u00e9s voy a extra\u00f1ar."],["De m\u00ed para ti","Con una libreta llena de todo lo que me gusta de ti, todav\u00eda me faltar\u00edan p\u00e1ginas para tus sorpresas."],["De m\u00ed para ti","Pienso en ti de la forma en que uno piensa en algo bueno que est\u00e1 por venir, con ganitas."],["De m\u00ed para ti","Ojal\u00e1 este mensajito te encuentre justo donde te haga falta un poquito de amor."],["De m\u00ed para ti","Yo pondr\u00eda tu foto en mi billetera. Despu\u00e9s tocar\u00eda explicar por qu\u00e9 alguien sonr\u00ede mientras busca una moneda."],["De m\u00ed para ti","Aprender tus gustos me parece una manera preciosa de gastar la memoria."],["De m\u00ed para ti","Qu\u00e9 bueno que nunca tuve que conocer a la mitad de la poblaci\u00f3n para darme cuenta de que a ti te quiero."],["De m\u00ed para ti","Hay un \u00abte extra\u00f1o\u00bb muy particular que me da cuando me pasa algo bueno y quisiera celebrarlo contigo al instante."],["De m\u00ed para ti","Si te dieran a escoger entre dos cosas que te gustan, yo ser\u00eda el de atr\u00e1s diciendo \u00abll\u00e9vate las dos, amor\u00bb."],["De m\u00ed para ti","No conozco a nadie que sea exactamente como t\u00fa. Menos mal, porque a m\u00ed me gusta esta versi\u00f3n irrepetible."],["De m\u00ed para ti","Cuando est\u00e1s cansada, te quiero tambi\u00e9n con las respuestas cortitas y las ganas de quedarte tranquila."],["De m\u00ed para ti","Me gusta descubrir cosas bonitas de ti que ni siquiera estabas intentando mostrarme."],["De m\u00ed para ti","Me har\u00eda feliz ser quien te alcance un pa\u00f1uelito cuando te r\u00edas hasta que te salgan l\u00e1grimas."],["De m\u00ed para ti","Yo s\u00e9 que cada uno tiene su mundo. Me sigue pareciendo un regalo que me invites al tuyo."],["De m\u00ed para ti","Quisiera darte uno de esos besos que no llevan discurso antes ni explicaci\u00f3n despu\u00e9s."],["De m\u00ed para ti","Me gusta decir tu nombre cuando estoy contento. Como quien tararea algo que le encanta."],["De m\u00ed para ti","Si est\u00e1s leyendo esto sin prisa, qu\u00e9date un segundo conmigo: te quiero y me gusta mucho que seas parte de mi vida."],["De m\u00ed para ti","Es curioso sentir tanto por alguien y tener que usar las mismas letras que sirven para hacer la lista del mercado."],["De m\u00ed para ti","El regalo m\u00e1s dif\u00edcil de envolverte ser\u00eda mi emoci\u00f3n por verte. La cinta no aguantar\u00eda."],["De m\u00ed para ti","Te guardo un cari\u00f1o muy paciente para esos d\u00edas en que necesitas encontrar tus palabras a tu ritmo."],["De m\u00ed para ti","Me encantar\u00eda conocer las cosas que te daban curiosidad de ni\u00f1a y ver cu\u00e1les todav\u00eda te hacen detenerte a mirar."],["De m\u00ed para ti","Ya te diste cuenta de que me gustas, \u00bfcierto? Menos mal, porque mi estrategia para disimular nunca existi\u00f3."],["De m\u00ed para ti","Si mis brazos supieran escribir, este papelito durar\u00eda lo que dura apretarte despacito."],["De m\u00ed para ti","Eres preciosa. La palabra queda m\u00e1s convincente cuando te tengo enfrente, pero aqu\u00ed va por adelantado."],["De m\u00ed para ti","Me alegra que para quererte no tenga que volverme un experto en nada. S\u00ed tengo que ponerte atenci\u00f3n, y eso me encanta."],["De m\u00ed para ti","En mis planes tienes tanto sitio que a veces arranco a contarte uno diciendo \u00abpodr\u00edamos\u00bb sin pensarlo."],["De m\u00ed para ti","Deja que hoy te recuerde algo chiquito: me encanta coincidir contigo en esta \u00e9poca de nuestras vidas."],["De m\u00ed para ti","Hay una pregunta que me gusta hacerte porque la respuesta siempre puede cambiar: qu\u00e9 te har\u00eda feliz hoy."],["De m\u00ed para ti","Si estuvi\u00e9ramos frente a frente, probablemente ya me habr\u00eda olvidado de este discurso y estar\u00eda sonriendo."],["De m\u00ed para ti","Te quiero de esa forma que se nota cuando me pongo contento por algo que solo te sali\u00f3 bien a ti."],["De m\u00ed para ti","Nunca me parecer\u00e1 poquito que saques un momento para pensar en m\u00ed."],["De m\u00ed para ti","Ah\u00ed donde est\u00e1s leyendo hay alguien a quien quiero mucho. Trat\u00e9mosla bonito entre los dos, \u00bfya?"],["De m\u00ed para ti","Me har\u00eda ilusi\u00f3n regalarte una taza que escogieras por fe\u00edta y terminarle teniendo cari\u00f1o porque ser\u00eda la tuya."],["De m\u00ed para ti","Quiero poder decirte \u00abyo voy\u00bb cuando te falten ganas de hacer sola un tr\u00e1mite que da una flojera terrible."],["De m\u00ed para ti","Me encanta lo distinto que se siente volver a un lugar cuando s\u00e9 que ah\u00ed puedo encontrarte."],["De m\u00ed para ti","Si me prestas una tarde sin planes, te la devuelvo con besos, conversaci\u00f3n y quiz\u00e1 un poquito de sue\u00f1o."],["De m\u00ed para ti","Ojal\u00e1 mi voz pueda sonar en tu cabeza mientras lees esto. En la parte de \u00abte amo\u00bb me acerco un poquito."],["De m\u00ed para ti","No s\u00e9 elegir un color para el amor. Pero s\u00ed s\u00e9 la cara que tiene el m\u00edo."],["De m\u00ed para ti","Si hoy te sale algo al tercer intento, yo igual quiero enterarme para celebrar el tercero."],["De m\u00ed para ti","Te regalar\u00eda una palabra que pudieras decir cuando quieras un abrazo sin explicarme todav\u00eda la historia."],["De m\u00ed para ti","Lo que me pasa contigo es bien sencillo de notar. Hasta se me acomoda distinto la cara cuando alguien te menciona."],["De m\u00ed para ti","Un besito para esa frente donde andan tantas ideas tuyas que me gustar\u00eda escuchar."],["De m\u00ed para ti","El mundo se ver\u00eda un poquito menos bonito si nunca me hubieras ense\u00f1ado tu manera de mirarlo."],["De m\u00ed para ti","Yo creo que se puede querer a alguien a la vuelta de la esquina y extra\u00f1arla antes de doblar. Al menos contigo me pasar\u00eda."],["De m\u00ed para ti","Mi bonita, d\u00e9jame ser la persona a la que llamas tambi\u00e9n para las cosas que salieron mejor de lo esperado."],["De m\u00ed para ti","Deber\u00eda haber una manera de subrayar un abrazo para decirte que ese, en especial, lo necesitaba."],["De m\u00ed para ti","Tu cari\u00f1o me anima a ser m\u00e1s sincero, incluso con esas cosas que me cuesta reconocerme a m\u00ed."],["De m\u00ed para ti","Oye, me gusta que existas un lunes igualito que un s\u00e1bado. Mira nom\u00e1s cu\u00e1nto."],["De m\u00ed para ti","Si la semana viene pesada, por lo menos hay algo f\u00e1cil que puedo hacer: decirte que estoy de tu lado."],["De m\u00ed para ti","Quisiera conocer el rinc\u00f3n de tu cabeza donde se te ocurren los chistes que me agarran desprevenido."],["De m\u00ed para ti","Tu nombre parece escrito con tinta que no se me borra ni cuando tengo otras mil cosas de qu\u00e9 acordarme."],["De m\u00ed para ti","Una de las cosas m\u00e1s lindas de ti es que tienes algo que decir. Y yo qu\u00e9 afortunado de poder escucharte."],["De m\u00ed para ti","Si el d\u00eda te pide demasiado, conmigo puedes llegar sin tener nada preparado que decir."],["De m\u00ed para ti","Me gustas cuando me sorprendes y cuando haces algo que ya esperaba y me encanta igual."],["De m\u00ed para ti","Quiero prestarte toda mi atenci\u00f3n hasta en esos minutos en que el celular insiste en distraerme."],["De m\u00ed para ti","Ojal\u00e1 alg\u00fan d\u00eda te vea abrir una carta m\u00eda. Me dar\u00eda verg\u00fcenza y felicidad a partes bastante desiguales: ganar\u00eda la felicidad."],["De m\u00ed para ti","T\u00fa eres de esas personas por las que uno aprende a mirar dos veces un detalle que antes se le pasaba."],["De m\u00ed para ti","Estoy pensando en hablarte de amor y ya me sali\u00f3 tu nombre. Con eso podr\u00eda firmar y terminar esta carta."],["De m\u00ed para ti","Bueno, bonita, si te sale una sonrisa por esto, acu\u00e9rdate de que me gustar\u00eda verla."],["De m\u00ed para ti","Hay un cari\u00f1o callado en revisar que llevaste todo antes de salir. Me da ilusi\u00f3n cuidar de ti hasta as\u00ed."],["De m\u00ed para ti","Si yo fuera buen cocinero, inventar\u00eda un plato solo por el gusto de pedirte que lo bautices."],["De m\u00ed para ti","Cuando algo me asombra, me hace ilusi\u00f3n que alg\u00fan d\u00eda podamos verlo juntos y comparar nuestras caras."],["De m\u00ed para ti","Me encanta que en una misma tarde quepan una conversaci\u00f3n importante y otra que no sirve para nada salvo re\u00edrnos."],["De m\u00ed para ti","La distancia entre \u00abme gusta\u00bb y \u00abme encantas\u00bb la entend\u00ed bastante bien contigo."],["De m\u00ed para ti","Si est\u00e1s contenta contigo misma hoy, qu\u00e9 alegr\u00eda. Tienes muchos motivos, y te puedo recordar uno cada vez que me pidas."],["De m\u00ed para ti","Para algunos regalos hace falta ahorrar. Por suerte para este te quiero me alcanz\u00f3 con pensar en ti."],["De m\u00ed para ti","Me dan ganas de tener bien presentes las cosas que te gustan, por si un d\u00eda pasan por delante de m\u00ed y te las puedo llevar."],["De m\u00ed para ti","Si te ves al espejo despu\u00e9s de esto, dile a la chica de enfrente que a m\u00ed me tiene loco."],["De m\u00ed para ti","A veces una cosa simple, como saber que descansaste rico, me alegra m\u00e1s de lo que tendr\u00eda sentido explicar."],["De m\u00ed para ti","Tu voz no tiene que decir nada rom\u00e1ntico para gustarme. Me puedes leer los ingredientes de un paquete y yo feliz."],["De m\u00ed para ti","Quiero seguir conoci\u00e9ndote cuando ya no haga falta preguntarte tus cosas favoritas, para enterarme de cu\u00e1ndo cambien."],["De m\u00ed para ti","Te quiero con toda la tranquilidad de una decisi\u00f3n que volver\u00eda a tomar."],["De m\u00ed para ti","Hay algo muy bonito en poder echarte de menos y al mismo tiempo alegrarme de que est\u00e9s haciendo algo que disfrutas."],["De m\u00ed para ti","Si hoy el cielo se pone bonito, me gustar\u00eda que pudi\u00e9ramos quedarnos un momento vi\u00e9ndolo, sin sacar la c\u00e1mara."],["De m\u00ed para ti","Tu cercan\u00eda hace una diferencia que noto hasta cuando ya pas\u00f3 el d\u00eda."],["De m\u00ed para ti","Me gusta imaginar que puedo hacerte sentir tan acompa\u00f1ada como t\u00fa me has hecho sentir a m\u00ed."],["De m\u00ed para ti","Cuando sonr\u00edo sin querer y me preguntan qu\u00e9 pas\u00f3, a veces dar\u00eda menos vueltas ense\u00f1ando una foto tuya."],["De m\u00ed para ti","Aprend\u00ed que tambi\u00e9n se puede decir \u00abme importas\u00bb prestando atenci\u00f3n a la segunda mitad de una historia."],["De m\u00ed para ti","Yo te quiero con la ternura del que todav\u00eda se alegra cuando lo buscas."],["De m\u00ed para ti","Qu\u00e9 ganas de tener algo bonito envuelto para ti y ganarte la adivinanza manteniendo la boca cerrada por una vez."],["De m\u00ed para ti","Un d\u00eda me gustar\u00eda leerte mis notas favoritas en voz alta. T\u00fa corriges las que sonar\u00edan mejor con beso al final."],["De m\u00ed para ti","Es dif\u00edcil aprenderse de memoria a alguien que sigue creciendo. Eso me encanta de quererte."],["De m\u00ed para ti","Tu forma de ser no necesita otro adorno. De hecho, verte c\u00f3moda siendo t\u00fa es de las cosas m\u00e1s bonitas que hay."],["De m\u00ed para ti","Si me dieran una estrellita cada vez que pienso en ti, mi techo parecer\u00eda la habitaci\u00f3n de un ni\u00f1o feliz."],["De m\u00ed para ti","Cuando tengas que contarme algo importante, quiero que sientas que me puedo sentar y escucharte hasta el punto final."],["De m\u00ed para ti","Hay d\u00edas para planes incre\u00edbles y d\u00edas para una fruta cortadita en un plato compartido. Me apunto a ambos."],["De m\u00ed para ti","La parte preciosa de sorprenderte empieza antes de darte el regalo, cuando imagino c\u00f3mo vas a abrir los ojos."],["De m\u00ed para ti","No siempre atino a demostrarte lo que siento. Por eso te escribo, para que donde me falte un gesto te llegue una palabra."],["De m\u00ed para ti","A tu nombre le tengo tanto cari\u00f1o que hasta en una lista de asistencia sonar\u00eda especial."],["De m\u00ed para ti","Si me das un l\u00e1piz y me dices que dibuje a la persona m\u00e1s bonita que conozco, te va a tocar quedarte quieta."],["De m\u00ed para ti","Quisiera poder acercarte una silla c\u00f3moda cada vez que el d\u00eda te obliga a esperar."],["De m\u00ed para ti","Lo que me encanta de ti tiene m\u00e1s que ver con c\u00f3mo tratas a la gente que con lo hermosa que sales en una foto."],["De m\u00ed para ti","A ti podr\u00eda dedicarte una carta de cinco p\u00e1ginas y posdata de otras tres. Hoy te ahorro las p\u00e1ginas: me encantas."],["De m\u00ed para ti","Cuando digo \u00abaqu\u00ed estoy\u00bb, quisiera que signifique algo concreto: dime c\u00f3mo te acompa\u00f1o hoy."],["De m\u00ed para ti","Tengo la teor\u00eda de que cualquier sitio mejora un poco cuando puedo voltear y comentarte algo al o\u00eddo."],["De m\u00ed para ti","Me gusta que haya tanto m\u00e1s en ti de lo que cabe en la primera impresi\u00f3n."],["De m\u00ed para ti","Tu cari\u00f1o me lleg\u00f3 distinto a como lo imaginaba. Qu\u00e9 bueno que la imaginaci\u00f3n a veces se queda corta."],["De m\u00ed para ti","Si alguna vez me escucharas hablar de ti estando t\u00fa lejos, entender\u00edas por qu\u00e9 este papelito se me hace tan chiquito."],["De m\u00ed para ti","Ojal\u00e1 tenga el cuidado de preguntarte c\u00f3mo te sientes incluso cuando por fuera parece que va todo bien."],["De m\u00ed para ti","Yo tambi\u00e9n me alegro cuando te consientes un poquito. Para m\u00ed, el detalle fue para mi persona favorita."],["De m\u00ed para ti","Si t\u00fa me preguntas en qu\u00e9 ando y estoy escribiendo esto, voy a tener que decirte \u00abpensando en una chica linda\u00bb."],["De m\u00ed para ti","Qu\u00e9 gustazo que unas mismas palabras, dichas por ti, me lleguen distinto."],["De m\u00ed para ti","A veces me entran ganas de adelantar el reloj cuando falta para verte. Despu\u00e9s me dar\u00eda pena haberlo gastado justo antes de estar contigo."],["De m\u00ed para ti","Puedes entrar a este papelito con el \u00e1nimo que traigas. Mi cari\u00f1o te pertenece igual."],["De m\u00ed para ti","Cuando el mundo te parezca demasiado ruidoso, yo puedo aprender a hacerte compa\u00f1\u00eda en voz bajita."],["De m\u00ed para ti","Yo ser\u00eda el tipo que comprar\u00eda un marco bonito sin haber elegido la foto, sabiendo que en cualquiera donde est\u00e9s t\u00fa ya acert\u00f3."],["De m\u00ed para ti","Me gustar\u00eda que me cuentes una canci\u00f3n que te guste tanto que te d\u00e9 pena que termine. Quiero escucharla pensando en ti."],["De m\u00ed para ti","No hace falta que lo entiendas todo enseguida. Tambi\u00e9n en tus dudas me pareces una persona maravillosa."],["De m\u00ed para ti","Qu\u00e9 bonito que haya afectos que crecen con detalles tan econ\u00f3micos como acordarse y preguntar."],["De m\u00ed para ti","Un paseo contigo me saldr\u00eda caro en distracciones. Seguro me pierdo alguna direcci\u00f3n por escucharte."],["De m\u00ed para ti","Cuando estoy contento de verdad, me sale buscar la manera de hacerte sitio en esa alegr\u00eda."],["De m\u00ed para ti","Est\u00e1n las cosas bonitas que puedo decir de ti y luego est\u00e1 lo que sentir\u00eda si pudiera abrazarte ahora. Eso no me cabe en una oraci\u00f3n."],["De m\u00ed para ti","Morenita, si alg\u00fan d\u00eda se me olvida decirte que me importas, este papelito te lo deja por escrito."],["De m\u00ed para ti","Te elegir\u00eda para acompa\u00f1arme a algo emocionante y para esperar conmigo mientras se enfr\u00eda la comida."],["De m\u00ed para ti","Si tuvieras una mala semana, no se me ocurrir\u00eda pedirte que la disimules para verme. Ven como est\u00e9s."],["De m\u00ed para ti","Qu\u00e9 dif\u00edcil hacerte una sorpresa si eres justamente a quien m\u00e1s ganas me dan de contarle que estoy preparando algo."],["De m\u00ed para ti","Imagino nuestros nombres chiquitos en dos boletos cualquiera. Ya tendr\u00eda una raz\u00f3n de sobra para guardarlos."],["De m\u00ed para ti","Nos pasamos el d\u00eda viendo la hora. Cuando nos toque estar juntitos, quiero guardar el reloj y escucharte sin apuro."],["De m\u00ed para ti","Si me preguntaras qu\u00e9 guardo en esta hoja, te dir\u00eda \u00ablas ganas de darte un beso en el momento menos pensado\u00bb."],["De m\u00ed para ti","Cuando tengas algo entre manos que te ilusione, me encantar\u00e1 verte tan metida en eso que hasta se te olvide la hora."],["De m\u00ed para ti","Me gusta que tu alegr\u00eda me ense\u00f1e a celebrar cosas que por mi cuenta quiz\u00e1 no habr\u00eda notado."],["De m\u00ed para ti","Tengo un cari\u00f1o por ti que hasta quiere aprender los nombres de las personas que son importantes para ti."],["De m\u00ed para ti","T\u00fa me puedes hacer feliz hasta sin propon\u00e9rtelo. Qu\u00e9 talento m\u00e1s mal aprovechado para concursos, jaja."],["De m\u00ed para ti","Escribirte hoy es una manera peque\u00f1ita de decir que sigues en mis pensamientos cuando no alcanzo a verte."],["De m\u00ed para ti","Me encantar\u00eda que alg\u00fan d\u00eda mires hacia atr\u00e1s y veas cari\u00f1o en lo que te dije y tambi\u00e9n en las cosas que hice."],["De m\u00ed para ti","Tu atenci\u00f3n me parece un regalo porque s\u00e9 que entre tantas cosas podr\u00edas haber elegido mirar hacia otro lado."],["De m\u00ed para ti","A m\u00ed me gustar\u00eda seguir siendo curioso contigo, hasta cuando me toque aprender algo que juraba que ya sab\u00eda."],["De m\u00ed para ti","Si me encuentras mir\u00e1ndote con cara rara, capaz estaba calculando c\u00f3mo decirte tanto sin ponerme muy cursi. C\u00e1lculo fallido."],["De m\u00ed para ti","Hay un mont\u00f3n de cosas tuyas que me parecen lindas, pero mi favorita hoy es que est\u00e1s aqu\u00ed leyendo mis ocurrencias."],["De m\u00ed para ti","Te dar\u00eda un beso primero y despu\u00e9s buscar\u00eda una frase con sentido. En papel tuve que hacerlo al rev\u00e9s."],["De m\u00ed para ti","Qu\u00e9 bonito poder imaginarte feliz en algo que ni siquiera me incluye y aun as\u00ed desear que te pase."],["De m\u00ed para ti","Si yo pudiera ayudar en una sola parte de tu d\u00eda, empezar\u00eda por preguntarte en cu\u00e1l necesitas ayuda."],["De m\u00ed para ti","Me emociona saber que nos quedan conversaciones sobre cosas que todav\u00eda ni siquiera han sucedido."],["De m\u00ed para ti","Cuando aparece tu nombre en mi pantalla, cualquier cara de ocupado que traiga pierde credibilidad."],["De m\u00ed para ti","A veces quisiera que este te quiero pesara algo, para que al sostener el celular notaras de una vez lo mucho que es."],["De m\u00ed para ti","Si pudi\u00e9ramos vernos por cinco minutos hoy, aceptar\u00eda hasta los cuatro que me queden despu\u00e9s de ponerme nervioso."],["De m\u00ed para ti","Me gusta hacerte preguntas porque nunca me ha parecido que se me hayan acabado las cosas por descubrir de ti."],["De m\u00ed para ti","Te querr\u00eda tambi\u00e9n en un d\u00eda de planes cancelados, con los zapatos ya puestos y cero ganas de volver a guardarlos."],["De m\u00ed para ti","Me gustar\u00eda estar ah\u00ed al lado cuando descubras por ti misma algo de lo que yo ya estoy orgulloso."],["De m\u00ed para ti","M\u00e1ndame mentalmente una sonrisa. No tengo c\u00f3mo comprobar si lleg\u00f3, pero ya me alegr\u00f3 la idea."],["De m\u00ed para ti","Me siento afortunado de que, entre las personas que pueden cuidarte bonito, me dejes intentar ser una."],["De m\u00ed para ti","Si hacemos una competencia por ver qui\u00e9n se pone m\u00e1s feliz al encontrarse, acepto que revisen mi cara en c\u00e1mara lenta."],["De m\u00ed para ti","Lo que yo llamo ternura a veces eres t\u00fa dici\u00e9ndome algo a tu manera y yo queriendo acordarme toda la tarde."],["De m\u00ed para ti","Prefiero conocerte con todas tus contradicciones a enamorarme de una idea muy ordenada que no se parezca a ti."],["De m\u00ed para ti","Quisiera poder hacer que un sem\u00e1foro se ponga en verde solo por el gusto de que llegues antes a donde quieres estar."],["De m\u00ed para ti","Cerquita de tu o\u00eddo, \u00abte adoro\u00bb me saldr\u00eda sin tanta letra. Espero que puedas imaginarlo."],["De m\u00ed para ti","Un d\u00eda me encantar\u00eda llevarte a ver algo que yo encontr\u00e9 bonito y regresar pensando que lo mejor fue tu reacci\u00f3n."],["De m\u00ed para ti","El mundo seguir\u00e1 inventando novedades. Yo, mientras tanto, sigo emocion\u00e1ndome con algo tan sencillo como verte venir."],["De m\u00ed para ti","Te escribir\u00eda un poema largu\u00edsimo, pero capaz llegas a la mitad y ya te estoy esperando al final para robarte un besito."],["De m\u00ed para ti","A ti te dejar\u00eda elegir la primera canci\u00f3n de un viaje y luego discutir\u00edamos con toda seriedad cu\u00e1l va segunda."],["De m\u00ed para ti","Me encantar\u00eda que mis gestos fueran tan claros que, incluso antes de leer esto, ya supieras cu\u00e1nto me importas."],["De m\u00ed para ti","Si hoy necesitas un empujoncito, acu\u00e9rdate de todas las cosas que ya lograste mientras todav\u00eda estabas aprendiendo."],["De m\u00ed para ti","Me dan ganas de regalarte una tarde sin pendientes. La envolver\u00eda en una mantita y te dejar\u00eda dormir."],["De m\u00ed para ti","Te quiero as\u00ed, con ganas de hacer realidad lo que s\u00ed se pueda y re\u00edrnos juntos de las ideas disparatadas."],["De m\u00ed para ti","Si pudiera saludar a la Mishell de hace muchos a\u00f1os, le dir\u00eda que conserve sus ocurrencias. A alguien le van a encantar."],["De m\u00ed para ti","Pasaron por mi cabeza cosas muy serias que pod\u00eda escribirte. Al final prefer\u00ed decirte que te dar\u00eda un beso en la nariz."],["De m\u00ed para ti","Tu presencia cambia el ambiente para m\u00ed del modo m\u00e1s sencillo: llegas y me dan ganas de quedarme."],["De m\u00ed para ti","Quiero poder alegrarme de tus pasos tambi\u00e9n cuando te lleven a un sitio que yo todav\u00eda no conozca."],["De m\u00ed para ti","Si una tarde no tenemos nada para estrenar, podr\u00edamos estrenar la costumbre de regalarnos un ratito sin mirar el tel\u00e9fono."],["De m\u00ed para ti","Me gusta tu nombre solo, con tu apellido, escrito en un sobre y, sobre todo, cuando te llamo y volteas."],["De m\u00ed para ti","Un d\u00eda te quiero acompa\u00f1ar a comprar una tonter\u00eda que te haga ilusi\u00f3n y tomar muy en serio la decisi\u00f3n contigo."],["De m\u00ed para ti","Si tienes una idea que te da un poquito de verg\u00fcenza contar, me encantar\u00eda escucharla sin quitarte las ganas de intentarlo."],["De m\u00ed para ti","Ten\u00eda pensado hacerte un cumplido elegante, pero a m\u00ed lo que me sale cuando pienso en ti es \u00abala, qu\u00e9 bonita\u00bb."],["De m\u00ed para ti","Cada quien tiene su forma de dar cari\u00f1o. La m\u00eda anda ahorita doblando palabras para que te quepan en el bolsillo."],["De m\u00ed para ti","Te amo con las ganas de estar presente que me nacen cuando me dices que algo es importante para ti."],["De m\u00ed para ti","A veces me basta la idea de saberte cerca. Otras, si te tengo al lado, igual me dan ganas de pedirte un beso."],["De m\u00ed para ti","Si pudiera guardar un instante por adelantado, reservar\u00eda uno de esos en que vas a estar feliz de ti misma."],["De m\u00ed para ti","Hay que ver todo lo que cabe en una cara. En la m\u00eda, cuando apareces, se puede leer hasta lo que todav\u00eda no te he dicho."],["De m\u00ed para ti","Te tengo una invitaci\u00f3n para cualquier tarde libre: pr\u00e9stame tu o\u00eddo y yo te presto mi hombro. La merienda la negociamos."],["De m\u00ed para ti","Si un d\u00eda te cansas justo antes de terminar algo, aqu\u00ed hay alguien dispuesto a sentarse contigo para el \u00faltimo empujoncito."],["De m\u00ed para ti","Me gustar\u00eda que supieras diferenciar mi voz de lejos, solo para poder decirte \u00abbonita\u00bb y que ya sepas qui\u00e9n fue."],["De m\u00ed para ti","Si hoy me preguntan para qui\u00e9n estoy escribiendo con tanta concentraci\u00f3n, igual mi sonrisa me va a delatar antes que la respuesta."],["De m\u00ed para ti","A m\u00ed, que apenas dibujo palitos, me dan ganas de aprender para hacerte una tarjeta que de verdad se parezca a ti."],["De m\u00ed para ti","Me enamora que seas una persona entera, con ilusiones tuyas que puedo acompa\u00f1ar y otras que t\u00fa solita vas a descubrir."],["De m\u00ed para ti","Cierro esta cartita pensando en el rato en que por fin pueda decirte todo esto mir\u00e1ndote. Mientras tanto, va un beso."]]</script>
<script>
const notes = JSON.parse(document.getElementById('collection').textContent);
// This edition has completely new texts. Its reading history starts afresh.
const key = 'papelitos-mishell-originales-v1';
const el = id => document.getElementById(id);
function newDeck(previous) {
  const order = notes.map((_, index) => index);
  for (let i=order.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  if (order[0] === previous) [order[0],order[1]] = [order[1],order[0]];
  return {order, read:0};
}
function restore() {
  try {
    const state = JSON.parse(localStorage.getItem(key));
    if (state && Array.isArray(state.order) && state.order.length === notes.length &&
        Number.isInteger(state.read) && state.read >= 0 && state.read <= notes.length &&
        new Set(state.order).size === notes.length &&
        state.order.every(i => Number.isInteger(i) && i >= 0 && i < notes.length)) return state;
  } catch {}
}
let state;
function draw() {
  state = restore() || state || newDeck();
  if (state.read === notes.length) state = newDeck(state.order[state.read - 1]);
  const [kind, body] = notes[state.order[state.read++]];
  el('kind').textContent = kind;
  el('note').textContent = body;
  try { localStorage.setItem(key,JSON.stringify(state)); }
  catch { el('notice').hidden = false; }
  const card = el('card');
  card.classList.remove('enter');
  void card.offsetWidth;
  card.classList.add('enter');
}
el('next').addEventListener('click',draw);
draw();
</script></body></html>
